"<div class=\"source-line\">Fuente de la investigación: ","<div class=\"investigator-head\"><h2>🕵️ Modo investigador</h2><span class=\"progress-badge\">"," evidencias</span></div>","<div class=\"block-title\">📓 Cuaderno del investigador</div>","<p class=\"notebook-note\">Notas libres, solo tuyas — no forman parte de la hipótesis formal ni se comparan con la causa oficial.</p>","\" placeholder=\"Anota aquí tus dudas, teorías, cosas para recordar después...\">","es-ES","INV-","<span class=\"cert-eyebrow\">Investigador Aéreo</span>","<h1 class=\"cert-title\">Certificado de<br>Investigador</h1>","<div class=\"cert-seal\">✔ Emitido</div>","<p class=\"cert-sub\">Otorgado a</p>","<div class=\"field\"><div class=\"k\">Casos resueltos</div><div class=\"v\">","<div class=\"field\"><div class=\"k\">Tasa de aciertos en los quizzes</div><div class=\"v\">","<div class=\"field\"><div class=\"k\">Fecha de emisión</div><div class=\"v\">","<div class=\"field\"><div class=\"k\">Período investigado</div><div class=\"v\">","<p class=\"cert-footnote\">Este certificado es una credencial ficticia, generada solo con fines educativos dentro de este proyecto — no es un documento oficial de ningún organismo de investigación de accidentes.</p>","<button class=\"btn primary\" data-print-cert>Imprimir / guardar como PDF</button>","<p><strong>Aviso importante:</strong> este certificado no tiene validez en ningún lugar — no es reconocido por ninguna institución, organismo regulador, empresa o proceso de selección. Es solo una credencial simbólica, creada exclusivamente con fines educativos dentro de este proyecto (Investigador Aéreo).</p>","<div class=\"cert-eyebrow\">Investigador Aéreo · credencial pendiente</div>","<h1 class=\"cert-title\">Certificado de Investigador</h1>","<p class=\"cert-sub\" style=\"margin:0 0 10px;\">investigaciones cerradas · faltan "," para emitir tu credencial</p>","<p class=\"cert-sub cert-pending-title\">Casos que todavía faltan cerrar</p>","<h2>Acerca del proyecto</h2>","<p class=\"sub\">Metodología y transparencia de fuentes</p>","Ningún dato inventado. Toda ficha tiene fuente.","<p style=\"max-width:680px;color:var(--text-1);\">Este es un proyecto educativo sobre investigación de accidentes aeronáuticos, con foco en casos brasileños y latinoamericanos. Ningún dato de víctimas, aeronaves o causas fue inventado: cada ficha se construyó cruzando informes de organismos oficiales de investigación con reportajes de medios de prensa establecidos.</p>","<p style=\"max-width:680px;color:var(--text-1);\">Algunos casos son muy recientes y todavía están bajo investigación — en ellos, la ficha está marcada como <b>\"investigación en curso\"</b> y muestra solo los hechos y hallazgos preliminares ya confirmados públicamente, sin señalar una causa oficial que todavía no existe. En cuanto el organismo responsable publique su informe final, la ficha se actualiza.</p>","<div class=\"block-title\" style=\"margin-top:28px;\">Organismos oficiales consultados</div>","<li><b>CENIPA</b> — Centro de Investigación y Prevención de Accidentes Aeronáuticos (Brasil)</li>","<li><b>NTSB</b> — National Transportation Safety Board (Estados Unidos)</li>","<li><b>Aerocivil</b> — Unidad Administrativa Especial de Aeronáutica Civil (Colombia)</li>","<li><b>JIAAC</b> — Junta de Investigación de Accidentes de Aviación Civil (Argentina)</li>","<li><b>BEA</b> — Bureau d’Enquêtes et d’Analyses (Francia)</li>","<li><b>DGAC/Perú</b> — Comisión de Investigación de Accidentes, Dirección General de Aeronáutica Civil (Perú)</li>","<li><b>AIB</b> — Aircraft Accident Investigation Bureau (Etiopía)</li>","<li><b>AAIASB</b> — Air Accident Investigation and Aviation Safety Board (Grecia)</li>","<li><b>AAIC</b> — Aircraft Accident Investigation Committee (Tailandia), con apoyo de la NTSB y de investigadores austríacos</li>","<div class=\"block-title\" style=\"margin-top:28px;\">Prensa e investigación complementaria</div>","<p style=\"color:var(--text-1);max-width:680px;\">Los datos complementarios (fechas, rutas, número de víctimas) se cruzaron con reportajes de G1, CNN Brasil, Folha de Londrina/Folha Vitória, O Tempo, InfoMoney, Metrópoles, Aventuras na História y otros medios, además de entradas consolidadas de Wikipedia — siempre usadas como punto de partida y no como fuente final. Esta versión en español fue traducida del portugués original; los medios de prensa citados son brasileños y publican en portugués.</p>","<div class=\"block-title\" style=\"margin-top:28px;\">Sobre el inicio de sesión</div>","<p style=\"color:var(--text-1);max-width:680px;\">El acceso tiene 3 pantallas: <b>crear cuenta</b> (correo, nombre y contraseña), <b>entrar</b> (para quien ya tiene cuenta) y <b>recuperar contraseña</b> (cambia la contraseña directamente con el correo registrado, ya que este proyecto no envía correos de verdad). <b>Esto no es un inicio de sesión con seguridad de nivel profesional</b>: como el sitio no tiene un servidor propio, la contraseña no usa cifrado real y queda guardada en un espacio que, técnicamente, cualquier persona con acceso a este sitio podría consultar. Por eso, nunca uses aquí una contraseña que uses en otro lugar — crea una contraseña nueva, solo para este proyecto.</p>","<div class=\"block-title\" style=\"margin-top:28px;\">Sobre el progreso guardado</div>","<p style=\"color:var(--text-1);max-width:680px;\">Tus evidencias reveladas, hipótesis, quizzes y casos cerrados quedan guardados automáticamente, asociados al correo que escribiste. Si quieres empezar de cero (manteniendo el mismo correo), usa el botón de abajo. Para usar otro correo, usa \"Cambiar correo\" en la parte superior de la página.</p>","<button class=\"reset-link\" id=\"reset-progress\">Borrar mi progreso y empezar de nuevo</button>","Agradecimientos","Este proyecto fue ideado y desarrollado por <b>Benjamin</b>, con el propósito de hacer que la seguridad aérea sea comprensible para cualquier persona, y no solo para quien es de la aviación.","Agradezco a los organismos de investigación, como CENIPA, NTSB, BEA, JIAAC, Aerocivil y los demás citados en las fichas, cuyo trabajo público hace posible aprender de cada caso.","<p class=\"gate-note\" style=\"color:var(--danger) !important;\">⚠️ Este entorno no está logrando guardar datos ahora. Puedes continuar, pero el progreso no se recordará la próxima vez.</p>","<p class=\"gate-note\" style=\"color:var(--blue) !important;\">ℹ️ Abriste el archivo directamente (fuera de Claude): el progreso quedará guardado solo en este navegador/computador, sin sincronizar con otros dispositivos.</p>","\" data-gate-tab=\"signup\">Crear cuenta</button>","\" data-gate-tab=\"login\">Entrar</button>","\" data-gate-tab=\"recover\">Recuperar contraseña</button>","<h1>Crea tu usuario</h1>","<p>Registra un correo y una contraseña para guardar las evidencias que ya revelaste, tus hipótesis y los casos cerrados.</p>","<input type=\"text\" id=\"gate-nome\" placeholder=\"Tu nombre\" autocomplete=\"name\">","<input type=\"email\" id=\"gate-email\" placeholder=\"tucorreo@ejemplo.com\" autocomplete=\"email\">","<input type=\"password\" id=\"gate-password\" placeholder=\"Crea una contraseña (mín. 4 caracteres)\" autocomplete=\"new-password\">","<input type=\"password\" id=\"gate-confirm\" placeholder=\"Confirma la contraseña\" autocomplete=\"new-password\">","<button class=\"btn primary\" id=\"gate-submit\" style=\"width:100%;justify-content:center;\">Crear usuario</button>","<p class=\"gate-switch\">¿Ya tienes una cuenta? <button data-gate-tab=\"login\">Entrar</button></p>","<p class=\"gate-note\">⚠️ Este registro existe solo para este proyecto: la contraseña no usa cifrado real y queda guardada en un espacio que cualquier persona con acceso a este sitio podría, en teoría, consultar. <b>Nunca uses aquí una contraseña que uses en otro lugar</b> — crea una contraseña nueva solo para esto.</p>","<h1>Recuperar contraseña</h1>","<p>Escribe el correo de tu cuenta y elige una nueva contraseña. (Como este proyecto no tiene servidor de correo, el cambio se hace aquí mismo, sin enlace de confirmación.)</p>","<input type=\"email\" id=\"gate-email\" placeholder=\"tucorreo@ejemplo.com\" autocomplete=\"email\" value=\"","<input type=\"password\" id=\"gate-password\" placeholder=\"Nueva contraseña (mín. 4 caracteres)\" autocomplete=\"new-password\">","<input type=\"password\" id=\"gate-confirm\" placeholder=\"Confirma la nueva contraseña\" autocomplete=\"new-password\">","<button class=\"btn primary\" id=\"gate-submit\" style=\"width:100%;justify-content:center;\">Actualizar contraseña</button>","<p class=\"gate-switch\">¿Recordaste la contraseña? <button data-gate-tab=\"login\">Entrar</button></p>","<h1>Entrar</h1>","<p>Escribe el correo y la contraseña de tu cuenta para continuar donde lo dejaste.</p>","<input type=\"password\" id=\"gate-password\" placeholder=\"Contraseña\" autocomplete=\"current-password\">","<button class=\"btn primary\" id=\"gate-submit\" style=\"width:100%;justify-content:center;\">Entrar</button>","<p class=\"gate-switch\">¿No tienes cuenta? <button data-gate-tab=\"signup\">Crear usuario</button> · <button data-gate-tab=\"recover\">Olvidé mi contraseña</button></p>","← Volver al sitio sin cuenta","#AFDCF7","#1D6FA8","position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;","Creando…","Actualizando…","Entrando…","🗺️ Ocultar mapa de la ruta","🗺️ Ver ruta en el mapa","Esto no es publicidad — es solo una referencia para que veas fotos reales de esta aeronave. Serás redirigido(a) al sitio externo JetPhotos.com, que no tiene relación con este proyecto. ¿Continuar?","¿Seguro que quieres borrar todo tu progreso asociado a este correo?","Sistema a bordo que avisa a los pilotos sobre aeronaves cercanas usando la señal de su transpondedor, sin depender de equipos en tierra. Si el transpondedor de un avión está apagado, es invisible para el TCAS de los demás.","Transpondedor","Aparato que responde automáticamente a las señales del radar. Es por él que el control de tránsito y el TCAS de otros aviones \"ven\" a la aeronave.","MEL","Lista de Equipo Mínimo: define con qué equipos inoperativos el avión todavía puede volar, y bajo qué condiciones.","CFIT","Vuelo controlado contra el terreno: una aeronave en condiciones de vuelo y bajo control de los pilotos es llevada sin querer contra el terreno, el agua o un obstáculo.","GPWS / EGPWS","Sistemas que alertan a los pilotos sobre terreno peligroso adelante, a tiempo para evitar un CFIT. El EGPWS es la versión más avanzada.","Pérdida (estol)","Caída repentina de la sustentación del ala cuando se alcanza o supera el ángulo de ataque crítico. Es un fenómeno del ala y no significa que el motor se detuvo.","Ángulo de ataque","Ángulo en el que el viento relativo encuentra el ala. Por encima de un límite (el ángulo crítico), el ala entra en pérdida.","Reversor de empuje","Mecanismo del motor que invierte el flujo de aire para ayudar al avión a frenar en la pista después del aterrizaje o en un despegue abortado.","Tubo Pitot / tomas estáticas","Sensores de presión del aire usados para calcular velocidad, altitud y velocidad vertical. Si se obstruyen (hielo en el AF447, cinta adhesiva en el Aeroperú 603), los instrumentos muestran valores erróneos.","Ley de control de vuelo del Boeing 737 MAX que reduce la tendencia de la nariz a subir en ángulos de ataque altos, moviendo el estabilizador horizontal automáticamente.","EICAS","Sistema que muestra en la cabina los parámetros de los motores y alerta a la tripulación sobre fallas o configuraciones incorrectas.","FDR y CVR","Las \"cajas negras\": el FDR graba parámetros de vuelo y el CVR graba el sonido de la cabina de los pilotos, para la investigación.","Hipoxia","Falta de oxígeno en los tejidos del cuerpo. Con la cabina despresurizada en altitud, puede llevar a la pérdida del conocimiento, como en el Helios 522.","Conciencia situacional","Tener noción de todo lo que hace falta saber sobre lo que está ocurriendo.","CRM (gestión de recursos de la tripulación)","Uso eficaz de todos los recursos disponibles en la cabina para una operación segura y eficiente.","Flaps y slats","Superficies móviles en las alas que aumentan la sustentación a baja velocidad, en el despegue y el aterrizaje.","Aerofrenos (speedbrakes)","Paneles en las alas que, abiertos, reducen la velocidad y también la capacidad de ascenso, como en el American 965.","Barrena plana","Giro descontrolado en el que el avión desciende en espiral vertical tras perder sustentación. Fue lo que ocurrió en el Voepass 2283.","Detención de los motores por falta total de combustible.","Ranurado (grooving)","Ranuras en el asfalto de la pista que drenan el agua y mejoran el frenado con lluvia.","Overspeed","Velocidad por encima del límite estructural del avión.","Altitud de cabina","La \"altitud\" equivalente a la presión dentro del avión. Si sube demasiado, falta oxígeno a bordo.","Palanca de potencia","La palanca que controla la potencia del motor.","Timón de profundidad (elevator)","Superficie móvil en la cola que hace que la nariz suba o baje.","Fuente: SKYbrary (EUROCONTROL / Flight Safety Foundation)","Fuente: fichas de los casos de este sitio","Definición general — todavía sin fuente específica verificada","Ver en SKYbrary ↗","Aparece en:","<h2>Glosario</h2>","Términos técnicos que aparecen en las fichas de los casos, explicados de forma sencilla","Buscar término (ej.: pérdida, TCAS, reversor)…","{n} términos","Ningún término encontrado.","Cadete","Observador de plataforma","Asistente de investigación","Analista de evidencias","Investigador júnior","Investigador","Investigador sénior","Investigador jefe","Director de investigaciones","Leyenda de la seguridad aérea","Términos técnicos","Une cada término con la explicación correcta — y viceversa.","Términos en los casos","Descubre en qué fichas aparece cada término.","Línea de tiempo","Años de los accidentes y qué vino antes o después.","Vuelos y aerolíneas","Dónde fue, quién operaba y c   /* ---------- MAPA DE ROTAS (catálogo) ---------- */
  /* Projeção equirretangular simples (lng/lat -> x/y). O contorno dos
     continentes (WORLD_LAND) vem de dados reais (Natural Earth, domínio
     público); a rota desenhada é uma linha reta aproximada entre os
     aeroportos de origem, escala(s) e destino de cada voo — não é a
     trajetória real de voo nem indica o local exato da queda, e isso fica
     escrito na legenda abaixo do mapa pra não dar a entender mais precisão
     do que realmente existe aqui. */
  var WORLD_VIEWBOX = { lngMin:-180, lngMax:180, latMin:-90, latMax:90 };

  function projectInBox(lng, lat, w, h, box){
    return {
      x: (lng - box.lngMin) / (box.lngMax - box.lngMin) * w,
      y: (box.latMax - lat) / (box.latMax - box.latMin) * h
    };
  }

  /* Calcula a "janela" do mapa (viewBox) a partir dos aeroportos da rota
     selecionada, pra dar zoom automático em voos curtos/regionais — sem
     isso, rotas domésticas (poucos graus de distância) viravam dois pontos
     colados no mapa-múndi inteiro, com a linha escondida embaixo deles. A
     proporção da janela é sempre ajustada pra bater com a proporção do
     canvas (960x480 = 2:1), senão os marcadores saem ovais. */
  function computeRouteViewBox(waypoints, w, h){
    var lngs = waypoints.map(function(p){ return p.lng; });
    var lats = waypoints.map(function(p){ return p.lat; });
    var minLng = Math.min.apply(null, lngs), maxLng = Math.max.apply(null, lngs);
    var minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);

    var rawSpanLng = Math.max(maxLng - minLng, 6);
    var rawSpanLat = Math.max(maxLat - minLat, 6);
    var padded = { lng: rawSpanLng * 1.7, lat: rawSpanLat * 2.1 };

    var aspect = w / h;
    var spanLat = Math.max(padded.lat, padded.lng / aspect);
    var spanLng = spanLat * aspect;

    /* não vale a pena "zoom" maior que o mundo inteiro */
    if(spanLng >= 340 || spanLat >= 150) return WORLD_VIEWBOX;

    var cLng = (minLng + maxLng) / 2, cLat = (minLat + maxLat) / 2;
    var box = {
      lngMin: cLng - spanLng / 2, lngMax: cLng + spanLng / 2,
      latMin: Math.max(cLat - spanLat / 2, -89), latMax: Math.min(cLat + spanLat / 2, 89)
    };
    return box;
  }

  function drawWorldBase(ctx, w, h, box){
    var cs = getComputedStyle(document.documentElement);
    var oceanColor = (cs.getPropertyValue('--bg-1') || '#eef3fb').trim();
    var landColor = (cs.getPropertyValue('--bg-2') || '#e1ebf9').trim();
    var lineColor = (cs.getPropertyValue('--line') || '#c7d6ec').trim();

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = oceanColor || '#eef3fb';
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = landColor || '#e1ebf9';
    ctx.strokeStyle = lineColor || '#c7d6ec';
    ctx.lineWidth = 1;
    WORLD_LAND.forEach(function(poly){
      /* pula polígonos totalmente fora da janela visível (otimização simples) */
      var touches = false;
      for(var i=0;i<poly.length;i++){
        if(poly[i][0] >= box.lngMin-2 && poly[i][0] <= box.lngMax+2 && poly[i][1] >= box.latMin-2 && poly[i][1] <= box.latMax+2){ touches = true; break; }
      }
      if(!touches) return;
      /* Alguns polígonos (ex.: Sibéria/Alasca) cruzam a linha de mudança de
         data (±180°). Projetados direto, isso criava uma linha horizontal
         enorme ligando os dois lados opostos do mapa — a "faixa" estranha
         cortando o mapa que foi reportada. Quando o salto de longitude
         entre dois pontos seguidos é maior que 180°, começa um novo
         subcaminho em vez de ligar os dois lados. */
      ctx.beginPath();
      var lastLng = null;
      poly.forEach(function(pt, i){
        var p = projectInBox(pt[0], pt[1], w, h, box);
        var crosses = (lastLng !== null) && (Math.abs(pt[0] - lastLng) > 180);
        if(i === 0 || crosses) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        lastLng = pt[0];
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    });

    /* linhas de grade a cada 10° dentro da janela visível (ou a cada 30°
       quando a janela é o mundo inteiro), com destaque pro equador e pro
       meridiano de Greenwich — só uma referência de orientação */
    ctx.save();
    var step = (box === WORLD_VIEWBOX) ? 30 : (box.lngMax-box.lngMin > 60 ? 10 : 5);
    var lngStart = Math.ceil(box.lngMin/step)*step, lngEnd = Math.floor(box.lngMax/step)*step;
    var latStart = Math.ceil(box.latMin/step)*step, latEnd = Math.floor(box.latMax/step)*step;
    for(var lng=lngStart; lng<=lngEnd; lng+=step){
      var isZero = Math.abs(lng) < 1e-6;
      ctx.globalAlpha = isZero ? 0.55 : 0.22;
      ctx.strokeStyle = lineColor || '#c7d6ec';
      ctx.lineWidth = 1;
      var p1 = projectInBox(lng, box.latMax, w, h, box), p2 = projectInBox(lng, box.latMin, w, h, box);
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    }
    for(var lat=latStart; lat<=latEnd; lat+=step){
      var isZeroLat = Math.abs(lat) < 1e-6;
      ctx.globalAlpha = isZeroLat ? 0.55 : 0.22;
      ctx.strokeStyle = lineColor || '#c7d6ec';
      ctx.lineWidth = 1;
      var q1 = projectInBox(box.lngMin, lat, w, h, box), q2 = projectInBox(box.lngMax, lat, w, h, box);
      ctx.beginPath(); ctx.moveTo(q1.x, q1.y); ctx.lineTo(q2.x, q2.y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawRouteOnMap(caseId){
    var canvas = document.getElementById('route-map-canvas');
    if(!canvas || !canvas.getContext) return;

    /* O canvas tem um tamanho "lógico" (w x h, sempre proporção 2:1) que é
       usado em todas as contas de desenho abaixo, mas o BUFFER de pixels de
       verdade do canvas é redimensionado pra bater com devicePixelRatio ×
       tamanho exibido na tela. Sem isso, em telas retina/4K o navegador
       esticava uma imagem de baixa resolução pra caber no espaço, e esse
       esticamento é o que causava aquelas faixas claras tortas cortando o
       mapa (um artefato clássico de reamostragem/escala, não um bug nos
       dados do mapa em si). */
    var dpr = window.devicePixelRatio || 1;
    var w = Math.max(320, Math.round(canvas.clientWidth || 960));
    var h = Math.round(w / 2);
    var pxW = Math.round(w * dpr), pxH = Math.round(h * dpr);
    if(canvas.width !== pxW || canvas.height !== pxH){
      canvas.width = pxW;
      canvas.height = pxH;
    }
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var emptyMsg = document.getElementById('route-map-empty');

    var c = caseId ? CASES.filter(function(x){ return x.id === caseId; })[0] : null;
    if(!c || !c.rotaCoords || !c.rotaCoords.length){
      drawWorldBase(ctx, w, h, WORLD_VIEWBOX);
      if(emptyMsg) emptyMsg.style.display = 'flex';
      return;
    }
    if(emptyMsg) emptyMsg.style.display = 'none';

    /* o ponto da queda entra no cálculo do zoom pra nunca ficar cortado
       fora da tela, mesmo quando é bem longe da rota (ex.: AF447, que caiu
       no meio do oceano, longe do Rio e de Paris) */
    var boxWaypoints = c.crashSite ? c.rotaCoords.concat([c.crashSite]) : c.rotaCoords;
    var box = computeRouteViewBox(boxWaypoints, w, h);
    drawWorldBase(ctx, w, h, box);

    var cs = getComputedStyle(document.documentElement);
    var routeColor = (cs.getPropertyValue('--blue-deep') || '#0b3d91').trim();
    var originColor = (cs.getPropertyValue('--success') || '#1f7a52').trim();
    var stopColor = (cs.getPropertyValue('--gold') || '#c9720a').trim();
    var destColor = (cs.getPropertyValue('--danger') || '#b23a24').trim();
    var labelColor = (cs.getPropertyValue('--text-0') || '#0a1830').trim();
    var haloColor = (cs.getPropertyValue('--bg-0') || '#ffffff').trim();
    var crashColor = (cs.getPropertyValue('--text-0') || '#0a1830').trim();

    var pts = c.rotaCoords.map(function(wp){ return projectInBox(wp.lng, wp.lat, w, h, box); });

    ctx.strokeStyle = routeColor || '#0b3d91';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]);
    ctx.lineCap = 'round';
    ctx.beginPath();
    pts.forEach(function(p, i){ if(i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
    ctx.stroke();
    ctx.setLineDash([]);

    /* anti-colisão de rótulos: quando duas ou mais paradas da rota ficam bem
       próximas no mapa (ex.: TAM 402, com Caxias do Sul/Curitiba/Congonhas/
       Santos Dumont quase coladas), desenhar cada nome na mesma altura fixa
       produzia texto ilegível, um em cima do outro. Em vez disso, cada rótulo
       já desenhado guarda sua "caixa" (bounding box) aproximada, e o próximo
       rótulo testa algumas alturas candidatas até achar uma livre. */
    var placedLabels = [];
    function labelBBox(text, align, tx, ty, padX, padY){
      var width = ctx.measureText(text).width;
      var x0, x1;
      if(align === 'left'){ x0 = tx - padX; x1 = tx + width + padX; }
      else if(align === 'right'){ x0 = tx - width - padX; x1 = tx + padX; }
      else { x0 = tx - width / 2 - padX; x1 = tx + width / 2 + padX; }
      return { x0: x0, x1: x1, y0: ty - 11 - padY, y1: ty + 4 + padY };
    }
    function rectsOverlap(a, b){
      return a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
    }
    function placeLabel(text, align, tx, tyCandidates){
      var chosen = null, chosenRect = null;
      for(var i = 0; i < tyCandidates.length; i++){
        var cand = tyCandidates[i];
        if(cand < 14 || cand > h - 6) continue;
        var rect = labelBBox(text, align, tx, cand, 4, 2);
        var collides = placedLabels.some(function(r){ return rectsOverlap(rect, r); });
        if(!collides){ chosen = cand; chosenRect = rect; break; }
      }
      if(chosen === null){
        chosen = tyCandidates[0] < 14 ? tyCandidates[1] : tyCandidates[0];
        chosenRect = labelBBox(text, align, tx, chosen, 4, 2);
      }
      placedLabels.push(chosenRect);
      return chosen;
    }

    pts.forEach(function(p, i){
      var isFirst = i === 0, isLast = i === pts.length - 1;
      var color = isFirst ? originColor : (isLast ? destColor : stopColor);

      ctx.beginPath();
      ctx.arc(p.x, p.y, (isFirst || isLast) ? 7 : 5.5, 0, Math.PI * 2);
      ctx.fillStyle = color || '#0b3d91';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = haloColor || '#ffffff';
      ctx.stroke();

      var label = c.rotaCoords[i].nome;
      var tx = p.x, align = 'center';
      if(tx < 90){ align = 'left'; tx = p.x + 10; }
      else if(tx > w - 90){ align = 'right'; tx = p.x - 10; }

      ctx.font = (isFirst || isLast ? 'bold ' : '') + '12px Inter, system-ui, sans-serif';
      var ty = placeLabel(label, align, tx, [p.y - 13, p.y + 20, p.y - 30, p.y + 37, p.y - 47, p.y + 54, p.y - 64]);

      ctx.textAlign = align;
      ctx.lineWidth = 3;
      ctx.strokeStyle = haloColor || '#ffffff';
      ctx.strokeText(label, tx, ty);
      ctx.fillStyle = labelColor || '#0a1830';
      ctx.fillText(label, tx, ty);
    });

    /* local da queda: um marcador diferente dos aeroportos (quadrado escuro
       com um "✕"), sem ligação pela linha tracejada da rota — ele não faz
       parte do trajeto planejado, é só o ponto onde a aeronave caiu. */
    if(c.crashSite){
      var rawCp = projectInBox(c.crashSite.lng, c.crashSite.lat, w, h, box);
      /* quando a queda foi bem perto de um dos aeroportos da rota (ex.:
         TAM 3054, que caiu dentro do próprio Congonhas), os dois marcadores
         ficariam exatamente um em cima do outro, ilegível. Nesse caso, o
         marcador da queda é deslocado alguns pixels na tela (puramente
         visual, pra caber a legenda) e uma linha fina liga ele à posição
         real — a posição real continua sendo a usada no cálculo do zoom. */
      var tooClose = pts.some(function(p){ return Math.hypot(p.x - rawCp.x, p.y - rawCp.y) < 70; });
      var cp = tooClose ? { x: rawCp.x + 26, y: rawCp.y + 30 } : rawCp;
      if(tooClose){
        ctx.save();
        ctx.globalAlpha = 0.7;
        ctx.strokeStyle = crashColor || '#0a1830';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(rawCp.x, rawCp.y);
        ctx.lineTo(cp.x, cp.y);
        ctx.stroke();
        ctx.restore();
      }
      var half = 7;
      ctx.fillStyle = crashColor || '#0a1830';
      ctx.strokeStyle = haloColor || '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.rect(cp.x - half, cp.y - half, half * 2, half * 2);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = haloColor || '#ffffff';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(cp.x - half * 0.55, cp.y - half * 0.55); ctx.lineTo(cp.x + half * 0.55, cp.y + half * 0.55);
      ctx.moveTo(cp.x + half * 0.55, cp.y - half * 0.55); ctx.lineTo(cp.x - half * 0.55, cp.y + half * 0.55);
      ctx.stroke();

      /* o nome do local da queda costuma ser mais longo que o de um
         aeroporto (ex.: "pátio da TAM Express, dentro do Aeroporto de
         Congonhas"), então a largura real do texto é medida antes de
         decidir pra que lado ele cresce, em vez de usar uma margem fixa
         que funciona pra rótulos curtos mas estoura pra rótulos longos. */
      var crashLabel = '✕ ' + c.crashSite.nome;
      ctx.font = 'bold 12px Inter, system-ui, sans-serif';
      var crashLabelW = ctx.measureText(crashLabel).width;
      var align2, ctx2;
      if(cp.x + 12 + crashLabelW <= w - 6){ align2 = 'left'; ctx2 = cp.x + 12; }
      else if(cp.x - 12 - crashLabelW >= 6){ align2 = 'right'; ctx2 = cp.x - 12; }
      else if(cp.x > w / 2){ align2 = 'right'; ctx2 = cp.x - 12; }
      else { align2 = 'left'; ctx2 = cp.x + 12; }
      var ctyBase = tooClose ? cp.y + 4 : cp.y - 14;
      /* o rótulo da queda também entra no sistema de anti-colisão acima: sem
         isso, quando o local da queda cai perto de um aeroporto da rota (ex.:

  function findContinentForLngLat(lng, lat){
    for(var i=0; i<CONTINENTS.length; i++){
      var c = CONTINENTS[i];
      if(lng >= c.lngMin && lng <= c.lngMax && lat >= c.latMin && lat <= c.latMax) return c;
    }
    /* clique fora de toda caixa (oceano, litoral, bordas entre continentes):
       em vez de não fazer nada, amplia pro continente mais próximo, pra
       o mapa inteiro ficar clicável, não só o interior de cada caixa */

    for(var j=0; j<CONTINENTS.length; j++){
      var cc = CONTINENTS[j];
      var cLng = (cc.lngMin + cc.lngMax) / 2, cLat = (cc.latMin + cc.latMax) / 2;
      var dLng = lng - cLng, dLat = lat - cLat;
      var dist = dLng * dLng + dLat * dLat;

  /* Mesma lógica de "janela com aspecto 2:1" do mapa de rota (computeRouteViewBox),
     mas a partir dos limites fixos do continente em vez das coordenadas de um
     voo específico — por isso o continente quase sempre aparece bem mais
     largo em longitude do que o seu retrato "de verdade" sugeriria: é o preço
     de manter o mapa sempre na mesma proporção 2:1. */

    var rawSpanLng = cont.lngMax - cont.lngMin;
    var rawSpanLat = cont.latMax - cont.latMin;
    var padded = { lng: rawSpanLng * 1.12, lat: rawSpanLat * 1.18 };
    var aspect = w / h;
    var spanLat = Math.max(padded.lat, padded.lng / aspect);

  var confettiCanvas = null, confettiCtx = null, confettiParticles = [], confettiAnimId = null;

  function confettiRand(min,max){ return Math.random()*(max-min)+min; }
  function ensureConfettiCanvas(){
    if(confettiCanvas) return;
    confettiCanvas = document.createElement('canvas');
    confettiCanvas.id = 'confetti-canvas';
    confettiCanvas.setAttribute('aria-hidden','true');

  function resizeConfettiCanvas(){
    if(!confettiCanvas) return;

    confettiCanvas.width = window.innerWidth*dpr;
    confettiCanvas.height = window.innerHeight*dpr;

  function confettiBurst(){
    ensureConfettiCanvas();
    var w = window.innerWidth;
    for(var i=0;i<160;i++){
      confettiParticles.push({
        x: confettiRand(w*0.15, w*0.85), y:-20,
        vx: confettiRand(-2.4,2.4), vy: confettiRand(1.5,4.5),
        size: confettiRand(6,12),
        color: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
        rotation: confettiRand(0,Math.PI*2), rotationSpeed: confettiRand(-0.25,0.25),
        shape: Math.random()<0.5 ? 'rect':'circle',
        drag: confettiRand(0.995,0.999),

        life:1, decay: confettiRand(0.0025,0.005)

  function confettiTick(){
    confettiCtx.clearRect(0,0,window.innerWidth,window.innerHeight);
    for(var i=confettiParticles.length-1;i>=0;i--){
      var p = confettiParticles[i];
      p.wobble += p.wobbleSpeed;
      p.vx *= p.drag;
      p.vy += 0.05;
      p.x += p.vx + Math.sin(p.wobble)*0.6;
      p.y += p.vy;
      p.rotation += p.rotationSpeed;
      p.life -= p.decay;
      if(p.life<=0 || p.y > window.innerHeight+30){ confettiParticles.splice(i,1); continue; }
      confettiCtx.save();
      confettiCtx.globalAlpha = Math.max(p.life,0);
      confettiCtx.translate(p.x,p.y);
      confettiCtx.rotate(p.rotation);
      confettiCtx.fillStyle = p.color;
      if(p.shape==='rect') confettiCtx.fillRect(-p.size/2,-p.size/3.2,p.size,p.size/1.6);

  function startBoardDrag(e){

    var boardRect = boardEl.getBoundingClientRect();
    var cardRect = card.getBoundingClientRect();

      caseId:caseId, key:key, card:card, boardEl:boardEl, pointerId:e.pointerId,
      startClientX:e.clientX, startClientY:e.clientY,
      startLeftPx: cardRect.left - boardRect.left,
      startTopPx: cardRect.top - boardRect.top,
      moved:false

    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  }

  function moveBoardDrag(e){
    if(!boardDrag || e.pointerId !== boardDrag.pointerId) return;
    var dx = e.clientX - boardDrag.startClientX;
    var dy = e.clientY - boardDrag.startClientY;
    if(!boardDrag.moved && (Math.abs(dx)>6 || Math.abs(dy)>6)){
      boardDrag.moved = true;
      boardDrag.card.classList.add('dragging');
    }
    if(!boardDrag.moved) return;
    var boardRect = boardDrag.boardEl.getBoundingClientRect();
    var maxLeft = boardRect.width - boardDrag.card.offsetWidth;
    var maxTop = boardRect.height - boardDrag.card.offsetHeight;
    var newLeft = Math.max(0, Math.min(boardDrag.startLeftPx + dx, maxLeft));
    var newTop = Math.max(0, Math.min(boardDrag.startTopPx + dy, maxTop));
    boardDrag.card.style.left = newLeft + 'px';
    boardDrag.card.style.top = newTop + 'px';

    GLOSSARY.forEach(function(g){ map[g.id] = glossCasesFor(g).map(function(c){ return c.id; }); });
    termCasesCache = {lang:lang, map:map};
    return map;
  }

  function genQuestion(track, level){
    var map, g, c, ids, others;
    if(track === 'termos'){
      g = pickOne(GLOSSARY);
      var mode = level === 3 ? pickOne([1, 2]) : (level === 4 ? 2 : level);
      if(mode === 1) return mkQ(fmt(__S[1195], {termo:quote(g.term)}), g.def, GLOSSARY.map(function(x){ return x.def; }), level === 1 ? 3 : 4);
      return mkQ(fmt(__S[1196], {def:quote(g.def)}), g.term, GLOSSARY.map(function(x){ return x.term; }), level === 4 ? 5 : 4);
    }
    if(track === 'termoscasos'){
      map = termCases();
      if(level < 3){
        g = pickOne(GLOSSARY.filter(function(x){ return map[x.id].length && map[x.id].length <= CASES.length - 3; }));
        ids = map[g.id];
        var cid = pickOne(ids);
        c = CASES.filter(function(x){ return x.id === cid; })[0];
        others = CASES.filter(function(x){ return ids.indexOf(x.id) === -1; }).map(function(x){ return x.nome; });
        return mkQ(fmt(__S[1197], {termo:quote(g.term)}), c.nome, others, level === 1 ? 3 : 4);
      }
      c = pickOne(CASES.filter(function(x){ return GLOSSARY.some(function(t){ return map[t.id].indexOf(x.id) !== -1; }); }));
      var inCase = GLOSSARY.filter(function(t){ return map[t.id].indexOf(c.id) !== -1; });
      var notIn = GLOSSARY.filter(function(t){ return map[t.id].indexOf(c.id) === -1; }).map(function(t){ return t.term; });
      return mkQ(fmt(__S[1198], {caso:quote(c.nome)}), pickOne(inCase).term, notIn, level === 4 ? 5 : 4);
    }
    if(track === 'tempo'){
      if(level === 4){
        /* Especialista: 5 anos, e as alternativas erradas são os anos mais próximos do certo */
        c = pickOne(CASES);
        var years = [];
        CASES.forEach(function(x){ if(x.ano !== c.ano && years.indexOf(x.ano) === -1) years.push(x.ano); });
        years.sort(function(a, b){ return Math.abs(a - c.ano) - Math.abs(b - c.ano); });
        var yopts = shuffled(years.slice(0, 4).concat([c.ano])).map(String);
        return {prompt:fmt(__S[1199], {caso:quote(c.nome)}), options:yopts, correct:yopts.indexOf(String(c.ano))};
      }
      if(level === 1){
        c = pickOne(CASES);
        return mkQ(fmt(__S[1199], {caso:quote(c.nome)}), String(c.ano), CASES.map(function(x){ return String(x.ano); }), 4);
      }
      var n = level === 2 ? 2 : 4;
      var byYear = {};
      shuffled(CASES).forEach(function(x){ if(!byYear[x.ano]) byYear[x.ano] = x; });
      var pickCases = shuffled(Object.keys(byYear).map(function(y){ return byYear[y]; })).slice(0, n);
      var target = pickCases.slice().sort(function(a, b){ return level === 2 ? a.ano - b.ano : b.ano - a.ano; })[0];
      var opts = pickCases.map(function(x){ return x.nome; });
      return {prompt: level === 2 ? __S[1200] : __S[1201],
              options:opts, correct:opts.indexOf(target.nome)};
    }
    if(track === 'mundo'){
      c = pickOne(CASES);
      if(level === 1) return mkQ(fmt(__S[1202], {caso:quote(c.nome)}), c.pais, CASES.map(function(x){ return x.pais; }), 3);
      if(level === 2) return mkQ(fmt(__S[1203], {caso:quote(c.nome)}), c.operadora, CASES.map(function(x){ return x.operadora; }), 4);
      return mkQ(fmt(__S[1204], {caso:quote(c.nome)}), c.aeronave, CASES.map(function(x){ return x.aeronave; }), level === 4 ? 5 : 4);
    }
    if(track === 'causas'){
      if(level === 1){
        c = pickOne(CASES);
        return mkQ(fmt(__S[1205], {caso:quote(c.nome)}), c.causaResumo, CASES.map(function(x){ return x.causaResumo; }), 3);
      }
      if(level === 2){
        c = pickOne(CASES);
        return mkQ(fmt(__S[1206], {causa:quote(c.causaResumo)}), c.nome, CASES.map(function(x){ return x.nome; }), 4);
      }
      c = pickOne(CASES.filter(function(x){ return !x.emAberto && (x.fatores || []).length; }));
      var otherF = [];
      CASES.forEach(function(x){ if(x.id !== c.id) otherF = otherF.concat(x.fatores || []); });
      return mkQ(fmt(__S[1207], {caso:quote(c.nome)}), pickOne(c.fatores), otherF, level === 4 ? 5 : 4);
    }
    return null;
  }

  function genLevel(track, level){
    var qs = [], seen = {};
    for(var tries = 0; qs.length < LEVEL_SIZE && tries < 200; tries++){
      var q = genQuestion(track, level);
      if(!q || q.correct < 0) continue;
      var k = q.prompt + '|' + q.options[q.correct];
      if(seen[k]) continue;
      seen[k] = 1;
      qs.push(q);
    }
    return qs;
  }

  function startChallenge(track, level){
    if(!levelUnlocked(track, level)) return;

    challengeRun = {kind:'quiz', track:track, level:level, qs:genLevel(track, level), idx:0, answers:[], done:false, xpBefore:levelXP(track, level), score:0};
    render();
    window.scrollTo(0, 0);
  }

  function bindDesafios(){
    document.querySelectorAll('[data-ch-start]').forEach(function(el){

        startChallenge(p[0], parseInt(p[1], 10));
      });
    });
    document.querySelectorAll('[data-ch-exit]').forEach(function(el){
      el.addEventListener('click', function(){ stopClock(); challengeRun = null; render(); window.scrollTo(0, 0); });
    });
    bindElite();
    document.querySelectorAll('[data-ch-opt]').forEach(function(el){
      el.addEventListener('click', function(){
        if(!challengeRun || challengeRun.kind !== 'quiz' || challengeRun.answers[challengeRun.idx] !== undefined) return;
        challengeRun.answers[challengeRun.idx] = parseInt(el.getAttribute('data-ch-opt'), 10);
        render();
      });
    });
    var next = document.querySelector('[data-ch-next]');
    if(next) next.addEventListener('click', function(){
      var run = challengeRun;
      if(!run || run.kind !== 'quiz') return;
      if(run.idx + 1 < run.qs.length){ run.idx++; render(); return; }
      run.score = run.qs.filter(function(q, i){ return run.answers[i] === q.correct; }).length;
      if(!progress.challenges) progress.challenges = {};
      var key = levelKey(run.track, run.level);
      var prev = progress.challenges[key] || {best:0, passed:false};
      progress.challenges[key] = {best:Math.max(prev.best || 0, run.score), passed:!!prev.passed || run.score >= LEVEL_PASS};
      run.done = true;
      saveProgress();
      render();
      window.scrollTo(0, 0);
    });
  }

  /* =========================================================
     DESAFIOS DE ELITE (liberados por título) + NÍVEL ESPECIALISTA
     ---------------------------------------------------------
     - Onde caiu? ........ clicar no mapa o local da queda (pontos por km)
     - Monte a rota ...... clicar nas cidades na ordem do voo
     - Ordene a linha do tempo ... arrastar 5 acidentes em ordem
     - Contra o relógio .. 60 s de perguntas misturadas
     - Nível 4 "Especialista" em cada trilha (5 opções)
     Tudo sai das fichas (crashSite, rotaCoords, ano, etc.). Locais de
     queda são aproximados, como já avisado nas fichas.
     ========================================================= */
  var EXPERT_UNLOCK = 2800;
  var ELITE = [
    {id:'map', icon:'📍', name:__S[1252], desc:__S[1253], unlock:800, rounds:5, max:500},
    {id:'route', icon:'🧭', name:__S[1254], desc:__S[1255], unlock:1300, rounds:5, max:500},
    {id:'order', icon:'🗂️', name:__S[1256], desc:__S[1257], unlock:2000, rounds:3, max:300},
    {id:'clock', icon:'⏱️', name:__S[1258], desc:__S[1259], unlock:2800, rounds:0, max:0}
  ];
  var CLOCK_SECONDS = 60;
  var clockTimer = null;

  function eliteById(id){ return ELITE.filter(function(e){ return e.id === id; })[0]; }
  function eliteState(id){ return (progress.challenges || {})['elite-' + id] || null; }
  function eliteXP(id){
    var s = eliteState(id);
    if(!s) return 0;
    var b = s.best || 0;
    if(id === 'clock') return Math.min(150, b * 10);
    if(id === 'order') return Math.round(b / 3);
    return Math.round(b / 5);
  }
  function eliteMaxXP(id){ return id === 'clock' ? 150 : 100; }
  function titleAt(xp){
    var t = TITLES[0];
    TITLES.forEach(function(T){ if(T.xp <= xp) t = T; });
    return t;
  }

  /* ---------- utilidades de mapa ---------- */
  function setupCanvas(canvas){
    var dpr = window.devicePixelRatio || 1;
    var w = Math.max(280, Math.round(canvas.clientWidth || 960));
    var h = Math.round(w / 2);
    var pxW = Math.round(w * dpr), pxH = Math.round(h * dpr);
    if(canvas.width !== pxW || canvas.height !== pxH){ canvas.width = pxW; canvas.height = pxH; }
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return {ctx:ctx, w:w, h:h};
  }
  function kmBetween(a, b){
    var R = 6371, toR = Math.PI / 180;
    var dLat = (b.lat - a.lat) * toR, dLng = (b.lng - a.lng) * toR;
    var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(x)));
  }
  function mapPoints(km){
    if(km <= 250) return 100;
    if(km <= 750) return 75;
    if(km <= 1500) return 50;
    if(km <= 3000) return 25;
    return 0;
  }
  function cssVar(name, fb){ return (getComputedStyle(document.documentElement).getPropertyValue(name) || fb).trim() || fb; }
  function drawDot(ctx, p, color, r){
    ctx.beginPath(); ctx.arc(p.x, p.y, r || 6, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = cssVar('--bg-0', '#fff'); ctx.stroke();
  }
  function drawCross(ctx, p, color){
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p.x - 7, p.y - 7); ctx.lineTo(p.x + 7, p.y + 7);
    ctx.moveTo(p.x + 7, p.y - 7); ctx.lineTo(p.x - 7, p.y + 7); ctx.stroke(); ctx.restore();
  }
  /* rótulo com desvio simples de colisão: tenta direita/esquerda, acima/abaixo
     do ponto e usa a primeira posição que não cobre outro rótulo ou ponto */
  function drawLabel(ctx, text, p, color, placed, w, h){
    ctx.save();
    ctx.font = '600 11px Inter, system-ui, sans-serif';
    var tw = ctx.measureText(text).width, th = 12;
    var spots = [[9, -7], [9, 15], [-9 - tw, -7], [-9 - tw, 15], [-tw / 2, -12], [-tw / 2, 22]];
    var chosen = null;
    placed = placed || [];
    for(var i = 0; i < spots.length; i++){
      var x = p.x + spots[i][0], y = p.y + spots[i][1];
      var r = {x:x - 2, y:y - th, w:tw + 4, h:th + 4};
      if(w && (r.x < 0 || r.x + r.w > w || r.y < 0 || r.y + r.h > h)) continue;
      var hit = placed.some(function(q){ return r.x < q.x + q.w && q.x < r.x + r.w && r.y < q.y + q.h && q.y < r.y + r.h; });
      if(!hit){ chosen = {x:x, y:y, r:r}; break; }
    }
    /* sem espaço livre (mapa pequeno, cidades coladas): não escreve o rótulo
       em cima de outro — o nome continua nos botões logo abaixo do mapa */
    if(!chosen){ ctx.restore(); return; }
    placed.push(chosen.r);
    ctx.lineWidth = 3; ctx.strokeStyle = cssVar('--bg-0', '#fff'); ctx.fillStyle = color;
    ctx.strokeText(text, chosen.x, chosen.y); ctx.fillText(text, chosen.x, chosen.y);
    ctx.restore();
  }

  /* ---------- montagem das rodadas ---------- */
  function buildMapRounds(){
    return shuffled(CASES.filter(function(c){ return c.crashSite; })).slice(0, 5).map(function(c){ return {caseId:c.id}; });
  }
  function buildRouteRounds(){
    var pool = shuffled(CASES.filter(function(c){ return (c.rotaCoords || []).length >= 2; }));
    var multi = pool.filter(function(c){ return c.rotaCoords.length >= 3; });
    var picked = multi.concat(pool.filter(function(c){ return c.rotaCoords.length < 3; })).slice(0, 5);
    return shuffled(picked).map(function(c){
      var route = c.rotaCoords;
      var cLat = 0, cLng = 0;
      route.forEach(function(p){ cLat += p.lat; cLng += p.lng; });
      cLat /= route.length; cLng /= route.length;
      var cand = [], seen = {};
      CASES.forEach(function(o){
        if(o.id === c.id) return;
        (o.rotaCoords || []).forEach(function(p){
          if(seen[p.nome]) return;
          var tooClose = route.some(function(r){ return r.nome === p.nome || kmBetween(r, p) < 150; });
          if(tooClose) return;
          seen[p.nome] = 1;
          cand.push({nome:p.nome, lat:p.lat, lng:p.lng, d:kmBetween({lat:cLat, lng:cLng}, p)});
        });
      });

  function routePick(i){
    var run = challengeRun, rr = run.rounds[run.idx];

    var cc = CASES.filter(function(x){ return x.id === rr.caseId; })[0];
    var need = cc.rotaCoords.length;
    if(rr.picks.length === need){
      var seq = rr.picks.map(function(ci){ return rr.cities[ci].order; });
      var exact = seq.every(function(o, k){ return o === k; });
      var ends = seq[0] === 0 && seq[need - 1] === need - 1;

<script>
(function(){
  /* Boot trilíngue: na primeira visita mostra a tela de escolha de idioma
     (antes do cadastro); depois lembra a escolha e já abre no idioma certo.
     A troca posterior (botões PT · EN · ES no menu) salva e recarrega. */
  var LANGS = ['pt','en','es'];
  var TITLES = {pt:'Investigador Aéreo', en:'Air Investigator', es:'Investigador Aéreo'};
  var HTML_LANG = {pt:'pt-BR', en:'en', es:'es'};

  function valid(l){ return LANGS.indexOf(l) !== -1; }
  function readLang(){
    try{
      var saved = window.localStorage.getItem('da_iaa_lang');
      if(valid(saved)) return saved;
    }catch(e){}
    /* sem localStorage: window.name sobrevive ao recarregar a mesma aba */
    var m = String(window.name || '').match(/(?:^|;)iaa_lang=(pt|en|es)(?:;|$)/);
    return m ? m[1] : null;
  }
  function saveLang(l){
    try{ window.localStorage.setItem('da_iaa_lang', l); }catch(e){}
    try{
      var rest = String(window.name || '').replace(/(?:^|;)iaa_lang=[a-z]+/g, '');
      window.name = rest + ';iaa_lang=' + l;
    }catch(e){}
  }
  window.__IAA_setLang = function(l){
    if(!valid(l)) return;
    saveLang(l);
    window.location.reload();
  };

  function start(l){
    window.__IAA_LANG = l;
    document.documentElement.lang = HTML_LANG[l];
    document.title = TITLES[l];

  }
