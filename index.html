tton></div>","\" data-jetphotos-link=\"1\" target=\"_blank\" rel=\"noopener noreferrer\">↗ See photos on JetPhotos</a>","<div class=\"field\"><div class=\"k\">Aircraft</div><div class=\"v\">","<div class=\"field\"><div class=\"k\">Registration</div><div class=\"v\">","<div class=\"field\"><div class=\"k\">Operator</div><div class=\"v\">","<div class=\"field\"><div class=\"k\">Date</div><div class=\"v\">","<div class=\"field\"><div class=\"k\">Route</div><div class=\"v\">","<div class=\"field\"><div class=\"k\">Crew / passengers</div><div class=\"v\">","<div class=\"field\"><div class=\"k\">Fatalities</div><div class=\"v death\">","<div class=\"field\"><div class=\"k\">Victim details</div><div class=\"v\">","\">Reveal evidence "," of ","See the investigation status so far","See official conclusion","<div class=\"your-hyp\"><b style=\"color:var(--text-1);\">YOUR HYPOTHESIS:</b> ","Investigation status so far","Official conclusion","What is still open","What changed after this accident","<div class=\"quiz-progress\">Question ","<p class=\"qr-a\">Your answer: ","<p class=\"qr-correct\">Correct answer: ","<div class=\"quiz-score\">You got ","\">Retake quiz</button>","<div class=\"investigator-head\"><h2>📝 Review — test your knowledge</h2><span class=\"progress-badge\">"," answered</span></div>","<div class=\"breadcrumb\"><button class=\"breadcrumb-back\" data-route=\"catalogo\" aria-label=\"Back to catalog\" title=\"Back to catalog\"><svg class=\"breadcrumb-arrow\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M10.5 2.5 L4.5 8 L10.5 13.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button></div>","Investigation ongoing","Case closed","<div class=\"case-num\">CASE NO. ","\">🗺️ See route on the map</button>","<canvas id=\"route-map-canvas\" width=\"960\" height=\"480\" role=\"img\" aria-label=\"Map with this flight's route\"></canvas>","<div class=\"block-title\">What happened</div>","What is known so far","Contributing factors","<div class=\"radar-open-note\">⏳ This case does not yet have an official cause determined, so there is no factor-weight classification here — that is only possible after the investigation (",") publishes its conclusion.</div>","<p class=\"radar-caption\">Educational classification of the weight of each factor in this accident, based on the official cause found · dominant factor highlighted</p>","<div class=\"source-line\">Investigation source: ","<div class=\"investigator-head\"><h2>🕵️ Investigator mode</h2><span class=\"progress-badge\">"," evidence</span></div>","<div class=\"block-title\">📓 Investigator's notebook</div>","<p class=\"notebook-note\">Free notes, just for you — they are not part of the formal hypothesis and are not compared with the official cause.</p>","\" placeholder=\"Jot down your questions, theories, things to remember later...\">","en-US","INV-","<span class=\"cert-eyebrow\">Air Investigator</span>","<h1 class=\"cert-title\">Investigator<br>Certificate</h1>","<div class=\"cert-seal\">✔ Issued</div>","<p class=\"cert-sub\">Awarded to</p>","<div class=\"field\"><div class=\"k\">Cases solved</div><div class=\"v\">","<div class=\"field\"><div class=\"k\">Quiz accuracy</div><div class=\"v\">","<div class=\"field\"><div class=\"k\">Date of issue</div><div class=\"v\">","<div class=\"field\"><div class=\"k\">Period investigated</div><div class=\"v\">","<p class=\"cert-footnote\">This certificate is a fictional credential, generated only for educational purposes within this project — it is not an official document from any accident investigation agency.</p>","<button class=\"btn primary\" data-print-cert>Print / save as PDF</button>","<p><strong>Important notice:</strong> this certificate has no validity anywhere — it is not recognized by any institution, regulator, company or hiring process. It is only a symbolic credential, created exclusively for educational purposes within this project (Air Investigator).</p>","<div class=\"cert-eyebrow\">Air Investigator · credential pending</div>","<h1 class=\"cert-title\">Investigator Certificate</h1>","<p class=\"cert-sub\" style=\"margin:0 0 10px;\">investigations closed · "," more to earn your credential</p>","<p class=\"cert-sub cert-pending-title\">Cases still to be closed</p>","<h2>About the project</h2>","<p class=\"sub\">Methodology and source transparency</p>","No invented data. Every file has a source.","<p style=\"max-width:680px;color:var(--text-1);\">This is an educational project about aircraft accident investigation, focused on Brazilian and Latin American cases. No data about victims, aircraft or causes has been invented: each file was built by cross-checking reports from official investigation agencies with coverage from established news outlets.</p>","<p style=\"max-width:680px;color:var(--text-1);\">Some cases are very recent and still under investigation — in those, the file is marked as <b>\"investigation ongoing\"</b> and shows only the facts and preliminary findings already publicly confirmed, without pointing to an official cause that does not yet exist. As soon as the responsible agency publishes its final report, the file is updated.</p>","<div class=\"block-title\" style=\"margin-top:28px;\">Official agencies consulted</div>","<li><b>CENIPA</b> — Aeronautical Accident Investigation and Prevention Center (Brazil)</li>","<li><b>NTSB</b> — National Transportation Safety Board (United States)</li>","<li><b>Aerocivil</b> — Unidad Administrativa Especial de Aeronáutica Civil (Colombia)</li>","<li><b>JIAAC</b> — Junta de Investigación de Accidentes de Aviación Civil (Argentina)</li>","<li><b>BEA</b> — Bureau d’Enquêtes et d’Analyses (France)</li>","<li><b>DGAC/Peru</b> — Comisión de Investigación de Accidentes, Dirección General de Aeronáutica Civil (Peru)</li>","<li><b>AIB</b> — Aircraft Accident Investigation Bureau (Ethiopia)</li>","<li><b>AAIASB</b> — Air Accident Investigation and Aviation Safety Board (Greece)</li>","<li><b>AAIC</b> — Aircraft Accident Investigation Committee (Thailand), with support from the NTSB and Austrian investigators</li>","<div class=\"block-title\" style=\"margin-top:28px;\">Press and supplementary research</div>","<p style=\"color:var(--text-1);max-width:680px;\">Supplementary data (dates, routes, victim counts) was cross-checked with reporting from G1, CNN Brasil, Folha de Londrina/Folha Vitória, O Tempo, InfoMoney, Metrópoles, Aventuras na História and other outlets, as well as established Wikipedia entries — always used as a starting point and not as a final source. This English version was translated from the original Portuguese; the press outlets listed are Brazilian and publish in Portuguese.</p>","<div class=\"block-title\" style=\"margin-top:28px;\">About sign-in</div>","<p style=\"color:var(--text-1);max-width:680px;\">Access has 3 screens: <b>create account</b> (email, name and password), <b>sign in</b> (for those who already have an account) and <b>recover password</b> (changes the password directly using the registered email, since this project does not actually send emails). <b>This is not a professional-grade secure login</b>: since the site has no server of its own, the password does not use real encryption and is stored in a space that, technically, anyone with access to this site could look at. So never use a password here that you use anywhere else — create a new password just for this project.</p>","<div class=\"block-title\" style=\"margin-top:28px;\">About saved progress</div>","<p style=\"color:var(--text-1);max-width:680px;\">Your revealed evidence, hypotheses, quizzes and closed cases are saved automatically, linked to the email you entered. If you want to start over from scratch (keeping the same email), use the button below. To use another email, use \"Switch email\" at the top of the page.</p>","<button class=\"reset-link\" id=\"reset-progress\">Delete my progress and start over</button>","Acknowledgments","This project was conceived and developed by <b>Benjamin</b>, with the purpose of making flight safety understandable to anyone, not only to people in aviation.","Thanks to the investigation agencies, such as CENIPA, NTSB, BEA, JIAAC, Aerocivil and the others cited in the case files, whose public work makes it possible to learn from each case.","<p class=\"gate-note\" style=\"color:var(--danger) !important;\">⚠️ This environment can't save data right now. You can continue, but your progress won't be remembered next time.</p>","<p class=\"gate-note\" style=\"color:var(--blue) !important;\">ℹ️ You opened the file directly (outside Claude): your progress will be saved only in this browser/computer, without syncing to other devices.</p>","\" data-gate-tab=\"signup\">Create account</button>","\" data-gate-tab=\"login\">Sign in</button>","\" data-gate-tab=\"recover\">Recover password</button>","<h1>Create your user</h1>","<p>Register an email and a password to save the evidence you've already revealed, your hypotheses and your closed cases.</p>","<input type=\"text\" id=\"gate-nome\" placeholder=\"Your name\" autocomplete=\"name\">","<input type=\"email\" id=\"gate-email\" placeholder=\"youremail@example.com\" autocomplete=\"email\">","<input type=\"password\" id=\"gate-password\" placeholder=\"Create a password (min. 4 characters)\" autocomplete=\"new-password\">","<input type=\"password\" id=\"gate-confirm\" placeholder=\"Confirm the password\" autocomplete=\"new-password\">","<button class=\"btn primary\" id=\"gate-submit\" style=\"width:100%;justify-content:center;\">Create user</button>","<p class=\"gate-switch\">Already have an account? <button data-gate-tab=\"login\">Sign in</button></p>","<p class=\"gate-note\">⚠️ This registration exists only for this project: the password does not use real encryption and is stored in a space that anyone with access to this site could, in theory, look at. <b>Never use a password here that you use anywhere else</b> — create a new password just for this.</p>","<h1>Recover password</h1>","<p>Enter your account email and choose a new password. (Since this project has no email server, the change is made right here, without a confirmation link.)</p>","<input type=\"email\" id=\"gate-email\" placeholder=\"youremail@example.com\" autocomplete=\"email\" value=\"","<input type=\"password\" id=\"gate-password\" placeholder=\"New password (min. 4 characters)\" autocomplete=\"new-password\">","<input type=\"password\" id=\"gate-confirm\" placeholder=\"Confirm the new password\" autocomplete=\"new-password\">","<button class=\"btn primary\" id=\"gate-submit\" style=\"width:100%;justify-content:center;\">Update password</button>","<p class=\"gate-switch\">Remembered your password? <button data-gate-tab=\"login\">Sign in</button></p>","<h1>Sign in</h1>","<p>Enter your account email and password to pick up where you left off.</p>","<input type=\"password\" id=\"gate-password\" placeholder=\"Password\" autocomplete=\"current-password\">","<button class=\"btn primary\" id=\"gate-submit\" style=\"width:100%;justify-content:center;\">Sign in</button>","<p class=\"gate-switch\">Don't have an account? <button data-gate-tab=\"signup\">Create user</button> · <button data-gate-tab=\"recover\">I forgot my password</button></p>","← Back to the site without an account","#AFDCF7","#1D6FA8","position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;","Creating…","Updating…","Signing in…","🗺️ Hide route map","🗺️ See route on the map","This is not an advertisement — it's just a reference so you can see real photos of this aircraft. You will be redirected to the external site JetPhotos.com, which has no connection with this project. Continue?","Are you sure you want to delete all your progress linked to this email?","Onboard system that warns pilots about nearby aircraft using their transponder signals, without relying on ground equipment. If a plane's transponder is off, it is invisible to other aircraft's TCAS.","Transponder","A device that automatically replies to radar signals. It is how air traffic control and other aircraft's TCAS \"see\" the aircraft.","MEL","Minimum Equipment List: defines which inoperative equipment an aircraft may still fly with, and under which conditions.","CFIT","Controlled flight into terrain: an airworthy aircraft, fully under the pilots' control, is unintentionally flown into terrain, water or an obstacle.","GPWS / EGPWS","Systems that warn pilots about hazardous terrain ahead, in time to avoid CFIT. EGPWS is the more advanced version.","Stall","A sudden loss of wing lift when the critical angle of attack is reached or exceeded. It is a wing phenomenon and does not mean the engine stopped.","Angle of attack","The angle at which the relative wind meets the wing. Above a limit (the critical angle), the wing stalls.","Thrust reverser","An engine mechanism that reverses the airflow to help the aircraft slow down on the runway after landing or during a rejected takeoff.","Pitot tube / static ports","Air-pressure sensors used to calculate airspeed, altitude and vertical speed. If they are blocked (ice on AF447, adhesive tape on Aeroperú 603), the instruments show wrong values.","A flight control law on the Boeing 737 MAX that reduces the nose's tendency to pitch up at high angles of attack, by moving the horizontal stabilizer automatically.","EICAS","A system that displays engine parameters in the cockpit and alerts the crew to faults or wrong configurations.","FDR and CVR","The \"black boxes\": the FDR records flight parameters and the CVR records the sound in the cockpit, for the investigation.","Hypoxia","A lack of oxygen in the body tissues. With the cabin depressurized at altitude, it can lead to loss of consciousness, as on Helios 522.","Situational awareness","Appreciating all you need to know about what is going on.","CRM (crew resource management)","The effective use of all available resources in the cockpit for a safe and efficient operation.","Flaps and slats","Movable surfaces on the wings that increase lift at low speed, during takeoff and landing.","Speedbrakes","Panels on the wings that, when deployed, reduce speed and also climb capability, as on American 965.","Flat spin","An uncontrolled rotation in which the aircraft descends in a vertical spiral after losing lift. This is what happened to Voepass 2283.","Engines stopping because the fuel has completely run out.","Grooving","Grooves cut into the runway surface that drain water and improve braking in the rain.","Overspeed","Speed above the aircraft's structural limit.","Cabin altitude","The \"altitude\" equivalent to the pressure inside the aircraft. If it rises too high, there is not enough oxygen on board.","Thrust lever","The lever that controls the engine's power.","Elevator","A movable surface on the tail that makes the nose go up or down.","Source: SKYbrary (EUROCONTROL / Flight Safety Foundation)","Source: this site's case files","General definition — no specific source verified yet","See on SKYbrary ↗","Appears in:","<h2>Glossary</h2>","Technical terms that appear in the case files, explained in simple words","Search a term (e.g. stall, TCAS, reverser)…","{n} terms","No term found.","Cadet","Ramp Observer","Investigation Assistant","Evidence Analyst","Junior Investigator","Investigator","Senior Investigator","Chief Investigator","Director of Investigations","Flight Safety Legend","Technical terms","Match each term to the right explanation — and vice versa.","Terms in the cases","Find out which case files each term appears in.","Timeline","Accident years and what came before or after.","Flights and airlines","Where it happened, who operated it and which aircraft it was.","Causes and factors","Cause summaries and contributing factors.","See achievements","What does {termo} mean?","Which term matches this explanation? {def}","In which of these cases does the term {termo} appear?","Which of these terms appears in the file of {caso}? loser to the real site, the more points.","Build the route","Click the cities in flight order: origin, stopovers and destination.","Order the timeline","Drag 5 accidents into the right chronological order.","Against the clock","60 seconds to answer as many mixed questions as you can.","Your record: {n}","No new XP — you didn't beat your record.","Round {i} of {n}","Where did {caso} crash?","World map to mark the crash site","You were {km} km from the real site · +{pts} points","approximate location, as in the case file","Next flight →","Click the point on the map where you think the aircraft crashed.","Build the route of {caso}","Pick {n} cities in flight order (origin → stopovers → destination). There are extra cities that are not part of the route.","Map with the cities to build the route","Perfect route! +100 points","Right origin and destination, but not the middle · +50 points","Not this time · 0 points","Correct route:","↶ Undo","Move up","Move down","Put them in order: from oldest (1) to most recent (5)","Drag the items or use the ↑ ↓ arrows.","{n} of 5 in the right position · +{pts} points","Next round →","Confirm order","You have {n} seconds.","Questions from every track, one after another. Each correct answer is worth 1 point; a wrong answer doesn't cost points, but it costs time.","Start ⏱️","{n} correct","{n} correct","Unlocks at {titulo} · {n} XP to go","Record: {r} · {x} of {m} XP","Play","⭐ Elite challenges","Unlocked as your title goes up. Crash sites and routes are approximate, as in the case files.","<span class=\"ai-fab-icon\" aria-hidden=\"true\">✦</span><span class=\"ai-fab-label\">Ask the AI</span>","<section class=\"ai-panel\" id=\"ai-panel\" role=\"dialog\" aria-label=\"AI assistant\" hidden>","<div><div class=\"ai-title\">✦ Investigator's assistant</div>","<div class=\"ai-sub\">Answers based on this site's case files · it can make mistakes, check the file</div></div>","<button class=\"ai-close\" id=\"ai-close\" aria-label=\"Close assistant\">✕</button>","<textarea id=\"ai-input\" rows=\"2\" maxlength=\"500\" placeholder=\"Type your question about the cases...\"></textarea>","<button class=\"btn primary ai-send\" id=\"ai-send\" type=\"submit\">Send</button>","<p class=\"ai-privacy\">Your questions are sent to OpenAI (ChatGPT) to generate the answer. Do not type personal data.</p>","Case in focus: ","No case in focus · ask about any of the cases in the catalog","Hi! I can explain a case, compare accidents or explain terms like TCAS, stall or thrust reverser. If you haven't revealed a case's official conclusion yet, I'll help you reason through it without giving away the answer.","Thinking…","Too many questions in a row. Wait a minute and try again.","The assistant is not available in this version of the site (it only works on the site published on Netlify).","I couldn't answer right now. Try again in a moment.","Create an account","👀 Guest mode","Nothing you do now is saved.","I already have an account · Sign in","The technical terms in the case files, explained in simple words, are available to account holders.","Question tracks, map challenges, XP and titles are available to account holders.","Achievements","Your titles and XP are available to account holders.","The investigator certificate is issued to account holders who close the cases.","Exclusive content","This content is available to account holders.","Creating an account takes less than a minute and is free. In guest mode you can still read every case file in the Catalog.","Investigation evidence","Investigator mode, quiz and route map","With an account you reveal the evidence one by one, record your hypothesis before seeing the conclusion, take the review quiz, see the route on the map and earn XP."],"es":["Vuelo TAM 3054","Brasil","Airbus A320-233","PR-MBK","TAM Linhas Aéreas","Porto Alegre (POA) → São Paulo–Congonhas (CGH)","Porto Alegre (POA)","São Paulo–Congonhas (CGH)","Lugar del accidente (patio de TAM Express, dentro del Aeropuerto de Congonhas)","17 de julio de 2007","6 tripulantes y 181 pasajeros a bordo","187 personas a bordo y 12 en tierra","Aterrizaje en pista mojada sin ranuras de frenado, con un reversor bloqueado","El Airbus A320 venía de Porto Alegre y no logró frenar a tiempo en la pista 35L del Aeropuerto de Congonhas, en São Paulo, en la tarde lluviosa del 17 de julio de 2007. La aeronave atravesó la pista, cruzó una avenida y chocó contra un edificio de la propia TAM, incendiándose. Fue el accidente aéreo más mortífero de la historia de Brasil.","La pista 35L estaba mojada y todavía no tenía el ranurado (grooving) que mejora el frenado en días de lluvia.","El reversor de empuje del motor derecho llevaba días bloqueado, una condición autorizada para operar de todos modos.","La palanca de potencia del motor derecho permaneció en posición de despegue durante el intento de aterrizaje, reduciendo el frenado.","Otros pilotos ya habían reportado dificultad para detenerse en Congonhas con la pista mojada.","CENIPA — Centro de Investigación y Prevención de Accidentes Aeronáuticos de Brasil","La pista estaba mojada y sin ranuras de frenado (grooving) en el momento del aterrizaje.","El reversor del motor 2 llevaba cuatro días bloqueado mecánicamente.","Los datos de vuelo muestran la palanca derecha en posición de despegue, no de reversa.","Reportes de otros pilotos señalaban un riesgo conocido de aquaplaning en la pista 35L.","El CENIPA no señaló una causa única, sino una combinación de factores: pista sin ranurado, reversor bloqueado y la palanca del motor derecho en posición incorrecta, que juntos impidieron frenar a tiempo.","El accidente aceleró la exigencia de ranurado (surcos de drenaje) en pistas de Brasil y llevó a la ANAC a revisar los criterios de longitud mínima de pista para el Airbus A320 en Congonhas.","Piloto / Tripulación","La palanca de potencia del motor derecho permaneció en posición de despegue durante el intento de aterrizaje, reduciendo el frenado — un punto de verificación de la configuración de la aeronave antes del toque.","Antes de este vuelo, otros pilotos ya habían reportado dificultad para detenerse en Congonhas con la pista mojada — una señal de riesgo conocida que circulaba de manera informal, sin convertirse en acción formal.","Si supieras, como en este caso, que otras tripulaciones ya reportaron dificultad de frenado en una pista específica en días de lluvia, ¿qué canal formal existe hoy en tu empresa para registrarlo — y realmente se usa?","Mantenimiento","El reversor de empuje del motor derecho llevaba cuatro días bloqueado mecánicamente — una condición que, aunque técnicamente autorizada para operar, redujo la capacidad de frenado justo cuando más se necesitaba.","El caso ilustra la diferencia entre \"autorizado a volar con la pendiente\" (MEL) y \"riesgo operacional aceptable en el día a día\" — dos juicios que no siempre están alineados.","Cuando un ítem entra en la lista de pendientes autorizados (MEL), ¿quién revisa si esa pendiente interactúa mal con otras condiciones del día (pista mojada, por ejemplo) — o cada pendiente se evalúa de forma aislada?","¿Cuál era el modelo de la aeronave del vuelo TAM 3054?","Boeing 737","Airbus A320","Fokker 100","Embraer 190","¿Desde dónde partió el vuelo antes de intentar aterrizar en Congonhas?","Curitiba","Porto Alegre","Recife","Belo Horizonte","¿En qué año ocurrió el accidente?","¿Cuántas personas murieron en total?","¿Qué condición de la pista contribuyó al accidente?","Pista congelada","Pista mojada y sin ranuras de frenado (grooving)","Pista demasiado corta","Pista sin iluminación","¿Qué estaba bloqueado en uno de los motores?","El tren de aterrizaje","El reversor de empuje","El flap","El timón de dirección","¿Qué organismo fue responsable de la investigación oficial?","NTSB","BEA","CENIPA","Aerocivil","¿En qué posición estaba la palanca del motor derecho durante el aterrizaje?","Reversa total","Despegue","Ralentí","Rodaje","Este accidente es considerado:","El primer accidente fatal de Brasil","El accidente aéreo más mortífero de la historia de Brasil","Un incidente sin víctimas","El único accidente de un Airbus en Brasil","Además de pasajeros y tripulantes, ¿cuántas personas murieron en tierra?","Ninguna","Vuelo Gol 1907","Boeing 737-8EH","PR-GTD","Gol Linhas Aéreas","Manaus (MAO) → Brasília (BSB) → Río de Janeiro–Galeão (GIG)","Manaos (MAO)","Brasilia (BSB)","Río de Janeiro–Galeão (GIG)","Lugar de caída de los restos (selva, Mato Grosso)","29 de septiembre de 2006","6 tripulantes y 148 pasajeros a bordo","las 154 personas a bordo del Boeing murieron","Colisión en el aire con un jet ejecutivo Legacy sobre la Amazonía","Un Boeing 737 de Gol y un jet ejecutivo Legacy 600 volaban en la misma aerovía, en sentidos opuestos y a la misma altitud, sobre Mato Grosso. La punta del ala del Legacy golpeó el ala izquierda del Boeing, que perdió el control y cayó en la selva amazónica. El Legacy, pese a los daños, logró aterrizar con seguridad en una base aérea.","El transpondedor y el sistema anticolisión (TCAS) del Legacy estaban apagados en el momento de la colisión.","Los controladores de tránsito aéreo no percibieron que las dos aeronaves estaban a la misma altitud y en la misma aerovía.","Las fallas de comunicación entre los controladores y la tripulación del Legacy no se detectaron a tiempo.","La tripulación del Legacy, con poca experiencia en ese avión, no notó que el transpondedor estaba apagado.","CENIPA (Brasil) y NTSB (Estados Unidos) — los organismos discreparon sobre el peso de cada causa","Las dos aeronaves cruzaban la misma aerovía, a la misma altitud, en sentidos opuestos.","El transpondedor del Legacy estaba apagado, lo que lo hacía invisible para el TCAS del Boeing.","Los controladores de tránsito no alertaron a ninguna de las aeronaves sobre el riesgo de colisión.","La tripulación del Legacy no percibió la alerta de falla del transpondedor en su pantalla.","El CENIPA responsabilizó principalmente a fallas de los controladores de tránsito aéreo y de la tripulación del Legacy; en cambio, la NTSB estadounidense concluyó que ambas tripulaciones actuaron correctamente con la información que tenían, señalando el control de tránsito aéreo como el origen central del problema.","El caso expuso fallas estructurales en el control de tránsito aéreo brasileño (el llamado \"apagón aéreo\") y aceleró la modernización del sistema, reforzando la exigencia de mantener el transpondedor siempre encendido durante el vuelo.","¿Con qué otra aeronave chocó el Boeing de Gol?","Un caza de la Fuerza Aérea Brasileña","Un jet ejecutivo Legacy 600","Otro Boeing 737","Un helicóptero","¿Sobre qué región ocurrió el accidente?","La costa de Bahía","La selva amazónica en Mato Grosso","Serra do Mar","El Pantanal de Mato Grosso del Sur","¿Qué sistema del Legacy estaba apagado en el momento de la colisión?","Piloto automático","Transpondedor/TCAS","Radio","Tren de aterrizaje","¿Cuántas personas murieron en el Boeing de Gol?","¿Qué pasó con el jet Legacy después de la colisión?","Cayó junto con el Boeing","Logró aterrizar con seguridad","Explotó en el aire","Regresó a su origen","¿Cuál era el destino final del vuelo de Gol?","Manaos","Brasilia","Río de Janeiro","Fortaleza","¿Qué señaló el CENIPA como principal responsable?","Solo la tripulación de Gol","Los controladores de tránsito aéreo y la tripulación del Legacy","Una falla estructural del Boeing","Las condiciones meteorológicas","¿A qué conclusión diferente llegó la NTSB (de EE. UU.)?","Idéntica a la del CENIPA","Priorizó las fallas del control de tránsito aéreo","No hubo ningún error humano","El Legacy cayó por falta de combustible","¿Cuántos sobrevivientes hubo en el avión de Gol?","Vuelo VASP 168","Boeing 727-200","PP-SRK","VASP","São Paulo → Fortaleza (FOR)","São Paulo","Fortaleza (FOR)","Lugar del accidente — Serra da Aratanha, cerca de Pacatuba (CE) (aproximado)","8 de junio de 1982","9 tripulantes y 128 pasajeros a bordo","los 137 ocupantes murieron","Choque contra la Serra da Aratanha durante la aproximación para aterrizar","En la aproximación al Aeropuerto Pinto Martins, en Fortaleza, el Boeing 727 de VASP chocó contra la Serra da Aratanha, en el municipio de Pacatuba (CE). Fue, en su época, el mayor accidente aéreo de la historia de Brasil.","Seis alarmas de proximidad al terreno sonaron en la cabina antes del impacto.","La tripulación no reaccionó a las alarmas a tiempo para evitar la colisión.","Los controladores de tránsito aéreo también cometieron fallas en la conducción de la aproximación.","La aeronave estaba por debajo de la altitud mínima segura para ese tramo de la aproximación.","La ruta final de aproximación pasaba cerca de una cadena de cerros conocida por los pilotos locales.","Las alarmas de proximidad al terreno sonaron seis veces en la cabina.","La aeronave mantenía una altitud inferior a la recomendada para ese punto de la aproximación.","Los registros también indican fallas en la orientación dada por el control de tránsito aéreo.","El CENIPA concluyó que el accidente fue causado por una combinación de errores de la tripulación, que no reaccionó a las alarmas de colisión, con fallas de los controladores de tránsito aéreo en la conducción de la aproximación.","En Brasil, el accidente reforzó la importancia de los sistemas de alerta de proximidad al terreno (GPWS) y llevó a revisar los procedimientos de aproximación nocturna en aeropuertos rodeados de sierras.","¿Contra qué chocó la aeronave?","Otro avión","La Serra da Aratanha","Un edificio","Una torre de control","¿Cuál era el destino del vuelo?","Salvador","Natal","¿Cuántas alarmas de colisión sonaron antes del impacto?","Ninguna","Dos","Seis","Doce","¿Cuántas personas murieron?","¿Cuál era el modelo de la aeronave?","ATR 72","¿Qué señaló la investigación sobre la altitud de la aeronave?","Estaba por encima de lo permitido","Estaba por debajo de la altitud mínima segura","Estaba a la altitud correcta","No fue posible determinarlo","Además de la tripulación, ¿a quién más se le señalaron fallas?","Pasajeros","Controladores de tránsito aéreo","El fabricante de la aeronave","Ningún otro agente","¿Hubo sobrevivientes?","Sí, todos","Sí, algunos","No, ninguno","No se sabe","¿Qué organismo investigó el caso?","JIAAC","Vuelo LaMia 2933 (Chapecoense)","Colombia / Bolivia","British Aerospace Avro RJ85","CP-2933","LaMia (Bolivia)","Santa Cruz de la Sierra (Bolivia) → Medellín (Colombia)","Santa Cruz de la Sierra (Viru Viru)","Medellín (José María Córdova)","Lugar del accidente — Cerro Gordo, La Unión (Antioquia)","28 de noviembre de 2016","9 tripulantes y 68 pasajeros a bordo (77 en total)","71 muertos y 6 sobrevivientes","Agotamiento de combustible poco antes del aterrizaje","El vuelo chárter llevaba a la delegación del Chapecoense a la final de la Copa Sudamericana, en Medellín. Minutos antes de aterrizar, la aeronave se quedó sin combustible y perdió la potencia de los motores, cayendo en una zona montañosa cerca de la ciudad. La tragedia conmovió a Brasil y al mundo del fútbol.","LaMia no hizo escala para reabastecer, manteniendo un plan de vuelo sin margen de seguridad de combustible.","El avión despegó con una autonomía al límite para la distancia a recorrer.","El piloto declaró emergencia por falta de combustible, pero demasiado tarde para evitar la caída.","Investigaciones posteriores señalaron el incumplimiento de protocolos básicos de seguridad por parte de la empresa.","Aerocivil — Autoridad de Aviación Civil de Colombia","El plan de vuelo no preveía escala para reabastecer, pese a la distancia entre las dos ciudades.","Minutos antes de la aproximación, la tripulación reportó una falla eléctrica.","El piloto pidió prioridad de aterrizaje por combustible cuando ya era tarde.","No se encontraron problemas mecánicos en la aeronave además de la falta de combustible.","La investigación de la Aerocivil concluyó que la causa fue el agotamiento total de combustible, derivado de una planificación de vuelo sin margen de seguridad y de la ausencia de escala para reabastecer.","El caso llevó a Bolivia a suspender el certificado de LaMia y reavivó, a nivel internacional, el debate sobre la fiscalización de vuelos chárter y el cumplimiento de las reservas mínimas de combustible exigidas por la OACI.","¿Qué equipo de fútbol estaba a bordo?","Palmeiras","Chapecoense","Atlético Nacional","Flamengo","¿Cuál fue la causa principal de la caída?","Una bomba a bordo","Falta de combustible","Colisión con otra aeronave","Una tormenta","¿Desde dónde despegó el avión?","Bogotá","Santa Cruz de la Sierra (Bolivia)","Lima","Quito","Medellín","Cali","Buenos Aires","¿Cuántas personas sobrevivieron?","¿Qué compañía operaba el vuelo chárter?","Avianca","LaMia","Aerolíneas Argentinas","LATAM","¿Para qué competición viajaba el equipo?","Copa Libertadores","Copa Sudamericana","La Copa del Mundo","Copa de Brasil","¿Qué identificó la investigación sobre el plan de vuelo?","Era correcto","No preveía escala para reabastecer","Preveía combustible extra","Fue alterado durante el vuelo","¿Qué organismo condujo la investigación oficial?","Aerocivil (Colombia)","Vuelo TAM 402","PT-MRK","Caxias do Sul → Recife, con escalas en Curitiba, São Paulo–Congonhas y Río–Santos Dumont","Caxias do Sul (CXJ)","Curitiba (Afonso Pena)","Río–Santos Dumont (SDU)","Recife (Guararapes)","Lugar del accidente — barrio de Jabaquara, São Paulo","31 de octubre de 1996","6 tripulantes y pasajeros a bordo","ocupantes de la aeronave y personas en tierra, en Jabaquara (SP)","Reversor de empuje accionado indebidamente durante el despegue","Poco después de despegar de Congonhas rumbo a Río de Janeiro, el reversor de empuje de uno de los motores del Fokker 100 se abrió solo, haciendo que la aeronave perdiera velocidad y sustentación. El avión cayó sobre casas del barrio de Jabaquara, en la zona sur de São Paulo, apenas 24 segundos después del despegue.","Las compuertas del reversor de empuje del motor derecho se abrieron durante el ascenso, sin comando de los pilotos.","Los pilotos mantuvieron el motor izquierdo con potencia inferior a la recomendada durante el intento de corrección.","La tripulación no retrajo el tren de aterrizaje, lo que habría ayudado a mantener la sustentación.","El reversor llegó a cerrarse y reabrirse tres veces durante los segundos finales del vuelo.","Los datos indican una apertura no comandada del reversor del motor derecho segundos después del despegue.","La velocidad de la aeronave cayó bruscamente a unos 126 nudos.","El tren de aterrizaje permaneció extendido durante todo el intento de recuperación.","El modelo ya había registrado incidentes menores anteriores con el mismo sistema de reversor.","El CENIPA concluyó que la caída fue causada por la apertura no comandada del reversor de empuje del motor derecho poco después del despegue, agravada por el manejo inadecuado de la potencia del motor izquierdo y por el tren de aterrizaje no retraído.","Se recomendó a Fokker modificar el sistema eléctrico de destrabado del reversor, y TAM pasó a registrar esas fallas con más rigor en el libro de a bordo — el caso también impulsó la creación de Abrapavaa, asociación de familiares de víctimas de accidentes aéreos en Brasil.","¿Qué causó la pérdida de sustentación de la aeronave?","Apertura indebida del reversor de empuje","Falta de combustible","Choque con aves","Falla en los flaps","¿Desde dónde había partido originalmente el vuelo?","Caxias do Sul","¿En qué barrio de São Paulo cayó el avión?","Jabaquara","Congonhas","Moema","Santo Amaro","¿Cerca de cuántos segundos después del despegue ocurrió la caída?","24 segundos","2 minutos","10 minutos","1 hora","¿Cuántas personas murieron en total?","¿Qué dejaron de hacer los pilotos, según el informe?","Retraer el tren de aterrizaje","Conectar el piloto automático","Avisar a la torre","Reducir la velocidad","¿Cuál era el destino final del vuelo?","¿Qué organismo investigó el accidente?","Vuelo Voepass 2283","ATR 72-500","PS-VPB","Voepass Linhas Aéreas","Cascavel (PR) → Guarulhos (SP)","Cascavel (PR)","Guarulhos (SP)","Lugar del accidente — Vinhedo (SP)","9 de agosto de 2024","4 tripulantes y 58 pasajeros a bordo","las 62 personas a bordo murieron","Pérdida de sustentación y \"barrena plana\" tras una falla en el sistema de deshielo","En aproximación a Guarulhos, el ATR 72 perdió sustentación a unos 17 mil pies de altitud y entró en una \"barrena plana\", cayendo en espiral sobre un condominio residencial en Vinhedo (SP). Fue el peor accidente aéreo de Brasil desde la tragedia de TAM en Congonhas, en 2007.","El informe final del CENIPA señaló fallas en el sistema de detección y deshielo de las alas en tres vuelos consecutivos.","La investigación identificó que la empresa operaba con \"seguridad degradada\" antes del accidente.","También se señalaron fallas de fiscalización por parte de la ANAC.","Había condiciones favorables a la formación de hielo en la ruta en el momento del accidente.","En los tres vuelos anteriores, los equipos de deshielo del ala derecha ya habían presentado problemas.","La aeronave volaba en condiciones favorables a la formación de hielo momentos antes de la caída.","Las imágenes muestran la aeronave descendiendo en espiral vertical, la llamada \"barrena plana\".","El informe final señala fallas de gestión de seguridad en el operador y de fiscalización regulatoria.","El CENIPA concluyó que la caída resultó de la combinación de fallas recurrentes en el sistema de deshielo del ala, condiciones de hielo en la ruta y una operación de la compañía con seguridad degradada, agravadas por una fiscalización insuficiente.","El accidente reavivó en Brasil el debate sobre la operación de aeronaves turbohélice en condiciones de formación de hielo y presionó por una fiscalización más rígida de la ANAC sobre las aerolíneas regionales.","¿En qué ciudad cayó la aeronave?","Vinhedo (SP)","Congonhas (SP)","Campinas (SP)","¿Desde dónde partió el vuelo?","Curitiba (PR)","Londrina (PR)","Foz do Iguaçu (PR)","¿Qué maniobra hizo la aeronave antes de caer?","Aterrizaje forzoso","\"Barrena plana\" (giro en espiral)","Despegue abortado","Colisión en pleno vuelo","¿Qué sistema presentó fallas en vuelos anteriores, según el CENIPA?","Sistema de deshielo de las alas","Sistema de combustible","¿El informe también señaló fallas de fiscalización de qué organismo?","ANAC","Policía Federal","Ministerio de Defensa","Receita Federal (Hacienda)","¿Cómo clasificó el informe la operación de la empresa?","Seguridad ejemplar","Seguridad degradada","Sin irregularidades","No evaluada","Este fue el peor accidente aéreo de Brasil desde:","VASP 168 (1982)","Gol 1907 (2006)","TAM 3054 (2007)","TAM 402 (1996)","Vuelo Air France 447","Atlántico (ruta Brasil–Francia)","Airbus A330-203","F-GZCP","Air France","Río de Janeiro–Galeão (GIG) → París–Charles de Gaulle (CDG)","París–Charles de Gaulle (CDG)","Lugar del accidente — Océano Atlántico, cerca del waypoint TASIL","1 de junio de 2009","12 tripulantes y 216 pasajeros a bordo","las 228 personas a bordo murieron","Pérdida de referencias de velocidad y reacción incorrecta de la tripulación","Sobrevolando el Océano Atlántico, el Airbus A330 atravesó una zona de tormentas y tuvo los tubos Pitot obstruidos por cristales de hielo, perdiendo temporalmente las lecturas de velocidad. El piloto automático se desconectó y la tripulación, ante información contradictoria, mantuvo la nariz del avión elevada hasta la pérdida total de sustentación, cayendo al océano.","Los tubos Pitot se congelaron, haciendo que el piloto automático se desconectara y desapareciera la información de velocidad.","Uno de los pilotos mantuvo la palanca tirada hacia atrás, elevando la nariz del avión incluso con las alarmas de pérdida sonando.","La tripulación no identificó correctamente que el avión estaba en pérdida (pérdida de sustentación).","La falta de entrenamiento específico para vuelo manual a gran altitud dificultó la recuperación.","BEA — Bureau d’Enquêtes et d’Analyses (Francia)","Los tubos Pitot se obstruyeron por hielo en pleno vuelo, un fenómeno ya conocido en esa región bajo ciertas condiciones.","El piloto automático se desconectó automáticamente al perder las lecturas de velocidad.","Las alarmas de pérdida sonaron repetidamente en los minutos finales del vuelo.","Los datos registrados muestran el minimanche lateral tirado hacia atrás durante prácticamente toda la caída.","El BEA concluyó que la obstrucción temporal de los tubos Pitot por hielo desencadenó una cadena de eventos en la que la tripulación no reconoció la situación de pérdida y mantuvo la nariz del avión elevada, impidiendo la recuperación hasta el impacto con el océano.","Air France sustituyó los tubos Pitot antiguos por un modelo más resistente al hielo en toda la flota A330/A340, y el entrenamiento de pilotos en todo el mundo pasó a dar más énfasis a la recuperación manual de la pérdida a gran altitud.","¿Sobre qué océano cayó la aeronave?","Pacífico","Atlántico","Índico","Ártico","¿Cuál era la ruta del vuelo?","Río de Janeiro–París","São Paulo–Lisboa","Río de Janeiro–Madrid","Brasilia–París","¿Qué quedó obstruido por hielo, desencadenando el accidente?","Los motores","Tubos Pitot (sensores de velocidad)","¿Qué pasó con el piloto automático?","Siguió funcionando normalmente","Se desconectó","Nunca se activó","Asumió el control total","¿Qué error cometió la tripulación, según el informe?","Mantuvo la nariz del avión elevada durante la pérdida","Descendió demasiado rápido","Ignoró el radar meteorológico","Aterrizó fuera de la pista","¿Qué organismo francés investigó el accidente?","¿Qué compañía operaba el vuelo?","TAM","Boeing 777","Airbus A330","Boeing 787","Vuelo American Airlines 965","Colombia","Boeing 757-223","N651AA","American Airlines","Miami (EE. UU.) → Cali (Colombia)","Miami (EE. UU.)","Cali (Colombia)","Lugar del accidente — cerca de Buga (Valle del Cauca)","20 de diciembre de 1995","8 tripulantes y 155 pasajeros a bordo","159 muertos y 4 sobrevivientes","Un error de navegación llevó a la aeronave a chocar contra una montaña (CFIT)","En la aproximación nocturna a Cali, la tripulación introdujo en el computador de navegación un identificador que, sin que se dieran cuenta, redirigió el avión hacia un punto equivocado, lejos de la ruta planeada. Intentando corregir el rumbo ya en medio de montañas, el Boeing 757 chocó contra una elevación cercana a la ciudad.","Un mismo código de identificación existía tanto para un punto cerca de Bogotá como para el de aproximación a Cali, y el piloto seleccionó el equivocado.","La tripulación no percibió el cambio brusco de ruta indicado por el computador de navegación.","Al intentar volver al rumbo, los pilotos abrieron los aerofrenos (speedbrakes) y olvidaron retraerlos al iniciar el ascenso de emergencia.","La aproximación se hizo de noche, sobre terreno montañoso, con poco margen de error.","Aerocivil (Colombia), con apoyo de la NTSB (Estados Unidos)","El piloto digitó un código de navegación que existía duplicado en la base de datos de la región.","La aeronave giró bruscamente en la dirección contraria a la esperada.","En los segundos finales, los aerofrenos (speedbrakes) estaban abiertos durante el intento de ascenso para escapar del terreno.","La alerta de proximidad al terreno (GPWS) sonó poco antes del impacto.","La investigación concluyó que la tripulación perdió la conciencia situacional al seleccionar un punto de navegación incorrecto, y que el olvido de los aerofrenos abiertos durante la maniobra de escape redujo la capacidad de ascenso del avión, resultando en un vuelo controlado contra el terreno (CFIT).","El accidente fue uno de los que impulsaron, en los años siguientes, la exigencia de sistemas de alerta de proximidad al terreno más avanzados (EGPWS) en aviones comerciales, además de revisiones en las bases de datos de navegación para evitar ambigüedad entre puntos de ruta con nombres parecidos.","¿Qué ciudad era el destino del vuelo?","Cartagena","¿Qué causó el desvío de ruta de la aeronave?","Falla de motor","Un código de navegación duplicado en el sistema","Un error del control de tránsito","Otra aeronave","Una montaña","Un edificio","El mar","¿Qué olvidaron retraer los pilotos durante el intento de ascenso?","Los aerofrenos (speedbrakes)","Los flaps","Las luces de aterrizaje","¿Cuántos sobrevivientes hubo?","Boeing 757","McDonnell Douglas MD-80","Nueva York","Miami","Houston","Los Ángeles","¿Cómo se llama técnicamente este tipo de accidente?","Pérdida en altitud","CFIT (vuelo controlado contra el terreno)","Descompresión explosiva","Agotamiento de combustible","¿En qué momento del día ocurrió la aproximación?","Mañana","Tarde","Noche","Madrugada","Vuelo Avianca 203","Boeing 727-21","HK-1803","Bogotá (BOG) → Cali (CLO)","Bogotá (BOG)","Cali (CLO)","Lugar del accidente — Soacha, cerca de Bogotá","27 de noviembre de 1989","8 tripulantes y 99 pasajeros a bordo","personas a bordo más víctimas en tierra","Explosión de una bomba a bordo, atribuida al Cartel de Medellín","Minutos después de despegar de Bogotá, una bomba explotó bajo uno de los asientos del Boeing 727, partiendo la aeronave en pleno vuelo. La investigación atribuyó el atentado al Cartel de Medellín, en medio de la guerra del narcotráfico contra el Estado colombiano a fines de los años 1980.","Una bomba fue colocada bajo uno de los asientos antes del despegue.","El atentado habría tenido como blanco al entonces candidato presidencial César Gaviria, que no abordó el vuelo.","La explosión ocurrió pocos minutos después del despegue, sin posibilidad de aterrizaje de emergencia.","El caso fue tratado como un acto de narcoterrorismo, no como una falla técnica o humana.","Investigación criminal colombiana / Flight Safety Foundation","Los peritos encontraron residuos de explosivos concentrados en una zona específica de la cabina.","La aeronave se partió en pleno vuelo pocos minutos después del despegue, sin señales de falla mecánica previa.","Información de inteligencia señalaba un plan del Cartel de Medellín contra autoridades colombianas en ese período.","El supuesto blanco del atentado no estaba a bordo del avión.","La investigación concluyó que el accidente fue, en realidad, un atentado con bomba: un artefacto explosivo fue detonado a bordo, en un ataque atribuido al Cartel de Medellín.","El atentado contribuyó al endurecimiento de la seguridad en los aeropuertos colombianos y reforzó, a nivel internacional, la adopción de rayos X obligatorios para el equipaje facturado.","¿Qué causó la caída de la aeronave?","Falla mecánica","Una bomba a bordo","Colisión con otro avión","¿A quién se señaló como responsable del atentado?","Un pasajero aislado","El Cartel de Medellín","Un grupo guerrillero","La propia aerolínea","Bogotá–Cali","Bogotá–Medellín","Cali–Cartagena","Bogotá–Cartagena","¿Quién sería el supuesto blanco del atentado?","Un periodista","Un candidato presidencial","Un policía","Un empresario","¿El supuesto blanco estaba a bordo del avión?","Sí","No","Abordó y luego bajó","¿En qué año ocurrió el atentado?","Boeing 727","Este caso se clasifica como:","Falla técnica","Error humano","Acto de narcoterrorismo","¿Cuánto tiempo después del despegue ocurrió la explosión?","Pocos minutos","Una hora","En la aproximación para aterrizar","Todavía en tierra","Vuelo LAPA 3142","Argentina","Boeing 737-204","LV-WRZ","LAPA (Líneas Aéreas Privadas Argentinas)","Buenos Aires–Aeroparque (AEP) → Córdoba (COR)","Buenos Aires–Aeroparque (AEP)","Córdoba (COR)","Lugar del accidente — cerca del Aeroparque Jorge Newbery","31 de agosto de 1999","pasajeros, tripulantes y personas alcanzadas en tierra","Despegue intentado con los flaps/slats fuera de posición","El Boeing 737 intentó despegar del Aeroparque Jorge Newbery, en el centro de Buenos Aires, sin lograr ganar altitud suficiente. La aeronave derribó la cerca del aeropuerto, atravesó una avenida golpeando vehículos y explotó al chocar contra un campo de golf vecino.","Los flaps y slats, que aumentan la sustentación en el despegue, no estaban correctamente configurados.","La lista de verificación previa al despegue no habría sido completada adecuadamente por la tripulación.","Las investigaciones plantearon la hipótesis de distracción de la tripulación en la cabina momentos antes del despegue.","El aeropuerto está rodeado de avenidas y construcciones, dejando poco margen para un despegue abortado.","JIAAC — Junta de Investigación de Accidentes de Aviación Civil (Argentina)","Los registradores de vuelo indican que los flaps no estaban extendidos en la posición de despegue.","La alarma de configuración incorrecta de la aeronave debía sonar en esas condiciones.","Testigos relataron una conversación entre los pilotos que no seguía el procedimiento estándar de la lista de verificación.","La pista utilizada tiene una longitud limitada, rodeada por avenidas urbanas con mucho tránsito.","La investigación concluyó que la aeronave intentó despegar sin los flaps y slats correctamente configurados, probablemente por no cumplir la lista de verificación previa al vuelo, lo que impidió una sustentación suficiente para despegar con seguridad.","El accidente reforzó, en Argentina y en otros países, la importancia de los sistemas de alerta de configuración incorrecta para el despegue y de una disciplina rígida en el cumplimiento de la lista de verificación previa al vuelo.","¿En qué ciudad está el Aeroparque desde donde el avión intentó despegar?","Córdoba","Santiago","Montevideo","Mendoza","Rosario","Bariloche","¿Qué estaba configurado incorrectamente en el despegue?","Los flaps y slats","El piloto automático","El reversor","¿Qué golpeó la aeronave al salir de la pista?","Un hangar","Una cerca y vehículos en una avenida","La torre de control","¿Contra qué chocó finalmente la aeronave?","Un campo de golf","Un río","¿Qué organismo argentino investigó el caso?","¿Qué sugirió la investigación sobre la lista de verificación previa al vuelo?","Se siguió correctamente","Puede no haberse completado correctamente","No existía","Se hizo dos veces","Vuelo Aeroperú 603","Perú","Boeing 757-23A","N52AW","AeroPerú","Miami (EE. UU.) → Lima (Perú) → Santiago (Chile), con escala en Lima","Lima (Jorge Chávez)","Santiago (Arturo Merino Benítez)","Lugar del accidente — Océano Pacífico, al noroeste de Lima","2 de octubre de 1996","9 tripulantes y 61 pasajeros a bordo","las 70 personas a bordo murieron","Cinta adhesiva olvidada sobre las tomas estáticas dio lecturas falsas de altitud y velocidad","Poco después de despegar de Lima rumbo a Santiago, de noche y sobre el Océano Pacífico, los instrumentos del Boeing 757 comenzaron a indicar información contradictoria de altitud y velocidad. Sin referencias visuales externas y con alarmas contradictorias sonando al mismo tiempo, la tripulación perdió la noción real de altitud hasta que la aeronave chocó contra el agua.","Durante una limpieza de la aeronave en Lima, se colocó cinta adhesiva sobre las tomas estáticas y no se retiró antes del despegue.","Sin información confiable de altitud y velocidad, la tripulación recibió alarmas de exceso de velocidad y de pérdida al mismo tiempo — una combinación técnicamente contradictoria.","El vuelo ocurría de noche, sobre el océano, sin ninguna referencia visual externa que ayudara a confirmar la altitud real.","Boeing fue criticada posteriormente por no haber entrenado adecuadamente a la tripulación de AeroPerú para este tipo específico de falla de instrumentos.","Comisión de Investigación de Accidentes (Dirección General de Aeronáutica Civil, Perú)","Las tomas estáticas, usadas para medir altitud y velocidad, estaban cubiertas con cinta adhesiva usada durante la limpieza de la aeronave.","Momentos después del despegue, el altímetro llegó a indicar 0 pies con el avión ya en el aire.","Las alarmas de exceso de velocidad y de pérdida (pérdida de sustentación) sonaron al mismo tiempo, algo técnicamente imposible de ocurrir juntos.","Volando sobre el mar, de noche y sin horizonte visible, los pilotos no tenían cómo confirmar la altitud real por medios visuales.","La investigación peruana concluyó que la obstrucción de las tomas estáticas con cinta adhesiva, no retirada después de un servicio de mantenimiento en Lima, generó lecturas falsas de altitud y velocidad. Sin instrumentos confiables y volando de noche sobre el océano, la tripulación perdió la noción real de altitud hasta el impacto contra el agua.","Boeing reforzó los procedimientos de inspección de las tomas de presión estática antes del despegue, y las aerolíneas pasaron a prestar más atención al entrenamiento de tripulaciones para enfrentar fallas simultáneas de múltiples instrumentos de vuelo.","¿Qué causó las lecturas falsas de los instrumentos?","Una tormenta eléctrica","Cinta adhesiva olvidada sobre las tomas estáticas","Falla de motor","Un error del piloto automático","¿Desde dónde despegó el vuelo poco antes de la caída?","¿Sobre qué océano ocurrió el accidente?","¿Qué le dificultó a la tripulación percibir la altitud real?","El vuelo era diurno y despejado","El vuelo era nocturno y sobre el mar, sin referencias visuales","Había otro avión cerca","La cabina estaba sin energía","¿Qué empresa fue criticada por falta de entrenamiento de la tripulación?","Airbus","Boeing","Embraer","Solo la propia AeroPerú","Comisión de Investigación de Accidentes de Perú","¿Qué alarmas contradictorias sonaron al mismo tiempo en la cabina?","Incendio y despresurización","Exceso de velocidad y pérdida","Falla de motor y tren de aterrizaje","Colisión con el terreno y con otra aeronave","Vuelo Ethiopian Airlines 302","Etiopía","Boeing 737 MAX 8","ET-AVJ","Ethiopian Airlines","Adís Abeba (Etiopía) → Nairobi (Kenia)","Adís Abeba (Bole)","Nairobi (Jomo Kenyatta)","Lugar del accidente — cerca de Bishoftu (Etiopía)","10 de marzo de 2019","8 tripulantes y 149 pasajeros a bordo","las 157 personas a bordo murieron, de 35 nacionalidades diferentes","Un sensor de ángulo de ataque defectuoso activó repetidamente el sistema MCAS, forzando la nariz de la aeronave hacia abajo","Poco después de despegar de Adís Abeba, un sensor de ángulo de ataque del Boeing 737 MAX comenzó a enviar datos incorrectos, activando repetidamente el MCAS — un sistema automático de control de vuelo poco conocido por los propios pilotos. El sistema empujó la nariz de la aeronave hacia abajo varias veces; aunque la tripulación siguió la lista de emergencia, el avión cayó unos 6 minutos después del despegue. Fue el segundo accidente del mismo modelo en menos de cinco meses, lo que llevó a la paralización mundial de la flota 737 MAX.","Un sensor de ángulo de ataque (AOA) comenzó a enviar datos incorrectos justo después del despegue.","El MCAS, un sistema de control de vuelo poco divulgado a los pilotos hasta entonces, movió repetidamente el estabilizador horizontal hacia abajo con base en ese dato incorrecto.","La tripulación siguió el procedimiento de emergencia de Boeing, pero no logró revertir los comandos automáticos a tiempo.","Cinco meses antes, otro Boeing 737 MAX (vuelo Lion Air 610, en Indonesia) ya había caído en circunstancias similares.","Aircraft Accident Investigation Bureau (Etiopía) — con comentarios divergentes de la NTSB (EE. UU.) y del BEA (Francia)","Los datos de vuelo muestran el sensor de ángulo de ataque con una lectura muy por encima de la realidad justo después del despegue.","El sistema MCAS se activó automáticamente varias veces, moviendo el estabilizador horizontal hacia abajo.","Los pilotos intentaron seguir la lista de emergencia de Boeing, pero el avión siguió perdiendo altitud.","Cinco meses antes, otro 737 MAX había caído en Indonesia (vuelo Lion Air 610) en circunstancias similares, con el mismo sistema involucrado.","La investigación etíope señaló como causa principal la activación repetida y no comandada del MCAS, disparada por un sensor de ángulo de ataque defectuoso, sin que la tripulación lograra recuperar el control. La NTSB (EE. UU.) y el BEA (Francia) publicaron comentarios oficiales discrepando de parte del informe, sosteniendo que los factores humanos y la gestión de recursos en cabina también debieron considerarse causas contribuyentes — una divergencia poco común entre organismos de investigación.","El accidente llevó a la paralización mundial de la flota 737 MAX por casi dos años, al rediseño del MCAS (que pasó a cruzar datos de dos sensores en lugar de uno) y a una revisión del proceso de certificación de la FAA, incluida una nueva legislación en EE. UU. sobre seguridad en la certificación de aeronaves.","¿Qué sistema automático empujó repetidamente la nariz del avión hacia abajo?","Piloto automático estándar","MCAS","TCAS","GPWS","¿Qué disparó la activación indebida de ese sistema?","Un sensor de ángulo de ataque defectuoso","Un error de digitación en la ruta","Una tormenta","Airbus A320neo","¿Desde dónde despegó el vuelo?","Nairobi","Adís Abeba","El Cairo","Lagos","¿Cerca de cuánto tiempo después del despegue ocurrió la caída?","30 segundos","6 minutos","40 minutos","2 horas","Este fue el segundo accidente del mismo modelo en pocos meses; ¿cuál fue el primero?","TAM 3054","Lion Air 610, en Indonesia","Avianca 203","Voepass 2283","Aircraft Accident Investigation Bureau de Etiopía","¿Qué pasó con la flota mundial de 737 MAX después de este accidente?","Nada cambió","Se redujo parcialmente","Fue paralizada en todo el mundo","Solo fue prohibida en Etiopía","Vuelo Helios Airways 522","Grecia (vuelo chipriota)","Boeing 737-300","5B-DBY","Helios Airways (Chipre)","Lárnaca (Chipre) → Atenas (Grecia) → Praga (República Checa), con escala en Atenas","Lárnaca (Chipre)","Atenas (Eleftherios Venizelos)","Praga (Václav Havel)","Lugar del accidente — cerca de Grammatiko (Grecia)","14 de agosto de 2005","6 tripulantes y 115 pasajeros a bordo","las 121 personas a bordo murieron","La válvula de presurización dejada en modo manual causó hipoxia e incapacitación de toda la tripulación","Tras una revisión en tierra en Lárnaca, la válvula de presurización de la cabina quedó en modo manual, y la tripulación no lo percibió durante los procedimientos previos al vuelo. A medida que el avión ascendía, la cabina perdió presión gradualmente; la alarma correspondiente sonó, pero los pilotos la confundieron con otro tipo de aviso. Todos a bordo, incluidos los pilotos, fueron perdiendo el conocimiento por hipoxia. La aeronave siguió en piloto automático por casi dos horas hasta quedarse sin combustible y caer en una zona montañosa cerca de Atenas.","Un mecánico había dejado la válvula de presurización en modo manual tras una prueba en tierra y no la devolvió al modo automático.","La lista de verificación previa al vuelo de la tripulación no identificó que la presurización estaba configurada incorrectamente.","La alarma sonora de altitud de cabina es parecida a la alarma de configuración incorrecta para el despegue, lo que confundió a los pilotos.","A medida que la cabina perdía presión, los ocupantes fueron perdiendo gradualmente el conocimiento por hipoxia, incluidos los dos pilotos.","Air Accident Investigation and Aviation Safety Board (Grecia)","El selector de presurización de la cabina fue encontrado en la posición \"manual\", y no en \"automático\".","La alarma de altitud de cabina sonó durante el ascenso, pero los pilotos la confundieron con otro tipo de alerta.","Cazas F-16 enviados para observar la aeronave, que ya no respondía por radio, vieron al piloto inconsciente en los mandos.","Un auxiliar de vuelo con licencia de piloto intentó tomar los mandos al final del vuelo, usando oxígeno portátil, pero el avión se quedó sin combustible antes de que pudiera reaccionar.","La investigación concluyó que la válvula de presurización quedó en modo manual después de una revisión en tierra, y que la tripulación no percibió esa configuración durante los procedimientos previos al vuelo. La pérdida gradual de presión causó una hipoxia incapacitante en todos a bordo; el avión siguió en piloto automático hasta quedarse sin combustible y caer.","El caso llevó a fabricantes y autoridades a revisar el sonido de las alarmas de altitud de cabina para diferenciarlas mejor de otras alertas de la cabina, además de reforzar los procedimientos de verificación de la presurización tras pruebas de mantenimiento en tierra.","¿Qué causó la pérdida del conocimiento de toda la tripulación?","Un incendio a bordo","Hipoxia por despresurización de la cabina","Envenenamiento por gas","Falta de oxígeno en los tanques","¿En qué posición se encontró la válvula de presurización?","Automática","Manual","Apagada","Esa válvula no existía","¿Por qué los pilotos no reaccionaron a la alarma de altitud de cabina?","La alarma no sonó","La confundieron con otro tipo de alerta","Estaban dormidos","La alarma estaba apagada","¿Quién intentó tomar los mandos en los minutos finales del vuelo?","Un pasajero médico","Un auxiliar de vuelo con licencia de piloto","Un controlador de tránsito por radio","Nadie lo intentó","¿Qué hizo finalmente caer a la aeronave?","Se quedó sin combustible tras volar en piloto automático","Fue derribada","Falla estructural","¿Cuál era la ruta original del vuelo?","Lárnaca–Atenas–Praga","Atenas–Roma","Lárnaca–Londres","Nicosia–París","Air Accident Investigation and Aviation Safety Board de Grecia","¿Qué tipo de aeronaves fueron enviadas para observar el avión que no respondía por radio?","Helicópteros de rescate","Cazas F-16","Drones","Otro avión comercial","Vuelo Lauda Air 004","Tailandia (vuelo austríaco)","Boeing 767-3Z9ER \"Mozart\"","OE-LAV","Lauda Air (Austria)","Hong Kong (Kai Tak) → Bangkok (Don Mueang) → Viena, con el accidente en el tramo Bangkok–Viena","Hong Kong (Kai Tak)","Bangkok (Don Mueang)","Viena (VIE)","Lugar del accidente — Parque Nacional Phu Toei (Tailandia)","26 de mayo de 1991","10 tripulantes y 213 pasajeros a bordo","las 223 personas a bordo murieron, sin sobrevivientes","El reversor de empuje del motor izquierdo se abrió solo en pleno vuelo, a alta velocidad y altitud","Poco después de despegar de Bangkok rumbo a Viena, el Boeing 767 de la aerolínea austríaca Lauda Air ascendía pasando los 7.500 metros de altitud cuando el reversor de empuje del motor 1 (izquierdo) se abrió solo, sin ningún comando de la tripulación. El flujo de aire invertido destruyó la sustentación del ala izquierda, y el avión entró en un picado que superó los límites estructurales de la aeronave: las alas se rompieron todavía en el aire y los restos cayeron en una zona de selva montañosa en la provincia de Suphan Buri, en Tailandia. Las 223 personas a bordo murieron; no hubo sobrevivientes.","El reversor de empuje del motor izquierdo se abrió solo durante el ascenso, a casi 7.500 metros de altitud y unos 400 nudos de velocidad — muy por encima de las condiciones probadas en la certificación original del Boeing 767.","Nueve minutos antes, un aviso del sistema EICAS ya indicaba una posible falla en el reversor, pero la tripulación lo trató como una alerta menor, sin acción correctiva inmediata.","La pérdida de sustentación en el ala izquierda fue demasiado repentina y violenta para cualquier maniobra de recuperación en esa fase del vuelo.","El registrador de datos de vuelo (FDR) fue destruido en el impacto, lo que dificultó identificar con total certeza la falla eléctrica que accionó el reversor.","Aircraft Accident Investigation Committee (Tailandia), con apoyo de la NTSB (EE. UU.) y de investigadores austríacos","Nueve minutos antes de la caída, apareció en el panel un aviso del sistema EICAS señalando una posible falla en el reversor del motor izquierdo — la tripulación lo trató como una alerta menor.","El registrador de datos de vuelo (FDR) fue destruido en el impacto; solo el registrador de voces de cabina (CVR) resistió y pudo usarse en la investigación.","En los segundos finales grabados por el CVR, se oye a uno de los pilotos percibiendo que el reversor se había abierto, poco antes de que la aeronave entrara en picado descontrolado.","Pruebas posteriores en simulador, pedidas por el propio fundador de Lauda Air, mostraron que la apertura del reversor a esa velocidad y altitud era irrecuperable en prácticamente todos los intentos.","La comisión de investigación de Tailandia concluyó que la caída fue causada por la apertura no comandada del reversor de empuje del motor izquierdo en pleno vuelo, que destruyó la sustentación del ala y volvió incontrolable la aeronave. La causa eléctrica exacta del accionamiento no pudo determinarse con total certeza, pero pruebas realizadas después por Boeing señalaron posibles fallas en las válvulas del sistema hidráulico del reversor.","El accidente llevó a Boeing a instalar un tercer sistema de bloqueo (\"sync lock\") en los reversores de empuje de miles de aviones 737, 747, 757 y 767 en todo el mundo, además de directivas de aeronavegabilidad de la FAA que exigieron inspecciones y válvulas adicionales de aislamiento hidráulico en esos sistemas.","¿Cuál era el modelo de la aeronave del vuelo Lauda Air 004?","Airbus A310","Boeing 767-300ER","McDonnell Douglas MD-11","Boeing 747-200","¿Qué causó la pérdida de control de la aeronave?","Apertura no comandada del reversor de empuje en pleno vuelo","Agotamiento de combustible","Una tormenta severa","¿En qué país ocurrió la caída?","Austria","Tailandia","Hong Kong","India","¿De qué aerolínea era el vuelo?","Austrian Airlines","Lauda Air","Thai Airways","Cathay Pacific","¿Cuántas personas murieron en el accidente?","¿Cuál era la ruta del vuelo hasta el momento del accidente?","Viena → Bangkok","Hong Kong → Bangkok → Viena","Bangkok → Hong Kong","Singapur → Viena","¿Qué pasó minutos antes de la caída?","Apareció en el panel un aviso del EICAS sobre una posible falla en el reversor","La tripulación declaró una emergencia médica","Un motor se incendió","La cabina perdió presurización","¿Quién presionó a Boeing para que admitiera públicamente que el accidente no podía ser evitado por la tripulación?","La ANAC","Niki Lauda, fundador de la aerolínea","El piloto sobreviviente","La OACI","¿Qué señaló la investigación como posible origen de la falla del reversor?","Sabotaje","Fallas eléctricas en válvulas del sistema hidráulico del reversor","Un error de mantenimiento comprobado","Aves golpeando el motor","¿Qué cambió en la flota mundial de Boeing después del accidente?","Instalación de un tercer sistema de bloqueo (sync lock) en los reversores","Prohibición definitiva del modelo 767","Reducción de la velocidad máxima de crucero","Accidente del Learjet 60 en Palm Beach","Estados Unidos","Learjet 60","N722BD","Aurora Aviation (operando como \"Upper Jets\")","Austin–Bergstrom (Texas) → North Eleuthera (Bahamas)","Austin–Bergstrom (Texas)","North Eleuthera (Bahamas)","Lugar del accidente — cerca de Greenacres, Palm Beach County (aproximado)","1 de noviembre de 2026","2 tripulantes y 7 pasajeros a bordo","las 9 personas a bordo murieron; una persona más en tierra resultó herida","Investigación en curso — la aeronave parece haberse desintegrado en vuelo antes de caer en una zona residencial de Florida","Poco después de despegar de Austin, en Texas, rumbo a las Bahamas, el Learjet 60 ascendía a unos 10.600 metros (35.000 pies) cuando la tripulación reportó turbulencia, hielo y variaciones de altitud. Minutos después, la aeronave entró en un descenso extremadamente rápido y se partió todavía en el aire, cayendo en una zona residencial de Palm Beach County, cerca de Greenacres/Cresthaven, en Florida. Las 9 personas a bordo murieron; una persona en tierra resultó herida. Hasta la publicación de esta ficha, la National Transportation Safety Board (NTSB) de Estados Unidos todavía no ha divulgado un informe preliminar ni final — por eso este caso aparece aquí como investigación en curso, sin causa oficial determinada.","La tripulación reportó turbulencia, hielo y oscilaciones de altitud de unos 210 metros (700 pies) poco antes del accidente, volando cerca de los 10.600 metros (35.000 pies).","La aeronave había recibido autorización para subir a 11.300 metros (37.000 pies) poco antes de entrar en un descenso descontrolado.","La NTSB confirmó que el timón de profundidad (elevator) izquierdo se separó de la aeronave antes del impacto, y fue encontrado en tres pedazos a algunos kilómetros del lugar de la caída.","Los pilotos reportaron una condición de \"overspeed\" (velocidad por encima del límite estructural) en los instantes finales; había tormentas en la región, pero todavía no se sabe si el clima influyó.","National Transportation Safety Board (NTSB, EE. UU.)","La aeronave ascendía a unos 10.600 metros (35.000 pies) cuando la tripulación reportó turbulencia, hielo y oscilaciones de altitud de aproximadamente 210 metros (700 pies).","En cerca de un minuto, la aeronave cayó de aproximadamente 10.700 metros (35.250 pies) a 2.700 metros (8.750 pies), poco antes del impacto.","El campo de restos se extendió por unos 800 metros, lo que indica que partes de la aeronave ya se habían soltado antes de tocar el suelo.","La NTSB confirmó que el timón de profundidad izquierdo de la aeronave se separó en vuelo y fue encontrado en tres pedazos, hasta a algunos kilómetros del lugar principal de la caída.","La investigación (identificada por la NTSB como ERA27MA026) todavía está en curso. Hasta la publicación de esta ficha, el organismo no había divulgado un informe preliminar ni final — solo conferencias de prensa en los días posteriores al accidente. Lo que se sabe hasta ahora: el timón de profundidad izquierdo de la aeronave se separó en vuelo antes del impacto, los pilotos reportaron una condición de overspeed, y había tormentas en la región (sin confirmación de que el clima haya contribuido). Las investigaciones de la NTSB suelen tardar de 12 a 24 meses hasta la publicación de un informe final con causa probable determinada — esta ficha se actualizará cuando eso ocurra.","Como la causa raíz todavía no se ha establecido, hasta ahora no hay ningún cambio regulatorio o de certificación deri
