ogotá, uma bomba explodiu sob um dos bancos do Boeing 727, partindo a aeronave em pleno voo. A investigação atribuiu o atentado ao Cartel de Medellín, em meio à guerra do narcotráfico contra o Estado colombiano no fim dos anos 1980.","Uma bomba foi colocada sob um dos assentos antes da decolagem.","O atentado teria como alvo o então candidato presidencial César Gaviria, que não embarcou no voo.","A explosão ocorreu poucos minutos após a decolagem, sem chance de pouso de emergência.","O caso foi tratado como ato de narcoterrorismo, não como falha técnica ou humana.","Investigação criminal colombiana / Flight Safety Foundation","Peritos encontraram resíduos de explosivos concentrados em uma região específica da cabine.","A aeronave se partiu em pleno ar poucos minutos após a decolagem, sem sinal de falha mecânica prévia.","Informações de inteligência apontavam um plano do Cartel de Medellín contra autoridades colombianas naquele período.","O suposto alvo do atentado não estava a bordo do avião.","A investigação concluiu que o acidente foi, na verdade, um atentado a bomba: um artefato explosivo foi detonado a bordo, em um ataque atribuído ao Cartel de Medellín.","O atentado contribuiu para o endurecimento da segurança em aeroportos colombianos e reforçou, internacionalmente, a adoção de raio-x obrigatório para bagagem despachada.","O que causou a queda da aeronave?","Falha mecânica","Uma bomba a bordo","Colisão com outro avião","Quem foi apontado como responsável pelo atentado?","Um passageiro isolado","O Cartel de Medellín","Um grupo guerrilheiro","A própria companhia aérea","Bogotá–Cali","Bogotá–Medellín","Cali–Cartagena","Bogotá–Cartagena","Quem seria o suposto alvo do atentado?","Um jornalista","Um candidato presidencial","Um policial","Um empresário","O suposto alvo estava a bordo do avião?","Sim","Não","Embarcou e depois desceu","Em que ano ocorreu o atentado?","Boeing 727","Este caso é classificado como:","Falha técnica","Erro humano","Ato de narcoterrorismo","Quanto tempo após a decolagem ocorreu a explosão?","Poucos minutos","Uma hora","Na aproximação para pouso","Ainda no solo","Voo LAPA 3142","Argentina","Boeing 737-204","LV-WRZ","LAPA (Líneas Aéreas Privadas Argentinas)","Buenos Aires–Aeroparque (AEP) → Córdoba (COR)","Buenos Aires–Aeroparque (AEP)","Córdoba (COR)","Local da queda — perto do Aeroparque Jorge Newbery","31 de agosto de 1999","passageiros, tripulantes e pessoas atingidas em solo","Decolagem tentada com os flaps/slats fora de posição","O Boeing 737 tentou decolar do Aeroparque Jorge Newbery, no centro de Buenos Aires, sem conseguir ganhar altitude suficiente. A aeronave derrubou a cerca do aeroporto, atravessou uma via atingindo veículos e explodiu ao colidir contra um campo de golfe vizinho.","Os flaps e slats, que aumentam a sustentação na decolagem, não estavam corretamente configurados.","A checklist pré-decolagem não teria sido completada de forma adequada pela tripulação.","Investigações levantaram a hipótese de distração da tripulação na cabine momentos antes da decolagem.","O aeroporto fica cercado por avenidas e construções, deixando pouca margem para uma decolagem abortada.","JIAAC — Junta de Investigação de Acidentes de Aviação Civil (Argentina)","Os registradores de voo indicam que os flaps não estavam estendidos na posição de decolagem.","O alarme de configuração incorreta da aeronave deveria soar nessas condições.","Testemunhas relataram uma conversa entre os pilotos que não seguia o procedimento padrão da checklist.","A pista utilizada tem extensão limitada, cercada por avenidas urbanas movimentadas.","A investigação concluiu que a aeronave tentou decolar sem os flaps e slats corretamente configurados, provavelmente por falha no cumprimento da checklist pré-voo, o que impediu sustentação suficiente para decolar em segurança.","O acidente reforçou, na Argentina e em outros países, a importância de sistemas de alerta de configuração incorreta para decolagem e de disciplina rígida no cumprimento da checklist pré-voo.","Em qual cidade fica o Aeroparque de onde o avião tentou decolar?","Córdoba","Santiago","Montevidéu","Mendoza","Rosario","Bariloche","O que estava incorretamente configurado na decolagem?","Os flaps e slats","O piloto automático","O reversor","O que a aeronave atingiu ao sair da pista?","Um hangar","Uma cerca e veículos em uma via","A torre de controle","Contra o que a aeronave finalmente colidiu?","Um campo de golfe","Um rio","Qual órgão argentino investigou o caso?","O que a investigação sugeriu sobre a checklist pré-voo?","Foi seguida corretamente","Pode não ter sido completada corretamente","Não existia","Foi feita em dobro","Aeroperú Voo 603","Peru","Boeing 757-23A","N52AW","AeroPerú","Miami (EUA) → Lima (Peru) → Santiago (Chile), com escala em Lima","Lima (Jorge Chávez)","Santiago (Arturo Merino Benítez)","Local da queda — Oceano Pacífico, a noroeste de Lima","2 de outubro de 1996","9 tripulantes e 61 passageiros a bordo","todas as 70 pessoas a bordo morreram","Fita adesiva esquecida sobre os tubos estáticos deu leituras falsas de altitude e velocidade","Pouco depois de decolar de Lima rumo a Santiago, à noite e sobre o Oceano Pacífico, os instrumentos do Boeing 757 começaram a indicar informações contraditórias de altitude e velocidade. Sem referências visuais externas e com alarmes conflitantes soando ao mesmo tempo, a tripulação perdeu a real noção de altitude até a aeronave se chocar contra a água.","Durante uma limpeza da aeronave em Lima, fita adesiva foi colocada sobre os tubos estáticos e não foi removida antes da decolagem.","Sem informações confiáveis de altitude e velocidade, a tripulação recebeu alarmes de excesso de velocidade e de perda de sustentação ao mesmo tempo — uma combinação tecnicamente contraditória.","O voo ocorria à noite, sobre o oceano, sem nenhuma referência visual externa que ajudasse a confirmar a altitude real.","A Boeing foi criticada posteriormente por não ter treinado adequadamente a tripulação da AeroPerú para esse tipo específico de falha de instrumentos.","Comisión de Investigación de Accidentes (Dirección General de Aeronáutica Civil, Peru)","Os tubos estáticos, usados para medir altitude e velocidade, estavam cobertos por fita adesiva usada durante a limpeza da aeronave.","Momentos após a decolagem, o altímetro chegou a indicar 0 pés mesmo com o avião já no ar.","Alarmes de velocidade excessiva e de estol (perda de sustentação) soaram ao mesmo tempo, algo tecnicamente impossível de ocorrer junto.","Voando sobre o mar, à noite e sem horizonte visível, os pilotos não tinham como confirmar a altitude real por meios visuais.","A investigação peruana concluiu que a obstrução dos tubos estáticos por fita adesiva, não removida após um serviço de manutenção em Lima, gerou leituras falsas de altitude e velocidade. Sem instrumentos confiáveis e voando à noite sobre o oceano, a tripulação perdeu a noção real de altitude até o choque contra a água.","A Boeing reforçou os procedimentos de inspeção dos tubos de pressão estática antes da decolagem, e companhias aéreas passaram a dar mais atenção ao treinamento de tripulações para lidar com falhas simultâneas de múltiplos instrumentos de voo.","O que causou as leituras falsas dos instrumentos?","Uma tempestade elétrica","Fita adesiva esquecida sobre os tubos estáticos","Pane no motor","Erro do piloto automático","De onde o voo decolou pouco antes da queda?","Sobre qual oceano ocorreu o acidente?","O que dificultou a tripulação perceber a altitude real?","O voo era diurno e claro","O voo era noturno e sobre o mar, sem referências visuais","Havia outro avião por perto","A cabine estava sem energia","Qual empresa foi criticada por falta de treinamento da tripulação?","Airbus","Boeing","Embraer","A própria AeroPerú, apenas","Comisión de Investigación de Accidentes do Peru","Que tipo de alarmes contraditórios soaram ao mesmo tempo na cabine?","Incêndio e despressurização","Excesso de velocidade e estol","Falha de motor e trem de pouso","Colisão com o solo e com outra aeronave","Ethiopian Airlines Voo 302","Etiópia","Boeing 737 MAX 8","ET-AVJ","Ethiopian Airlines","Adis Abeba (Etiópia) → Nairóbi (Quênia)","Adis Abeba (Bole)","Nairóbi (Jomo Kenyatta)","Local da queda — perto de Bishoftu (Etiópia)","10 de março de 2019","8 tripulantes e 149 passageiros a bordo","todas as 157 pessoas a bordo morreram, de 35 nacionalidades diferentes","Sensor de ângulo de ataque com defeito ativou repetidamente o sistema MCAS, forçando o nariz da aeronave para baixo","Pouco depois de decolar de Adis Abeba, um sensor de ângulo de ataque do Boeing 737 MAX começou a enviar dados incorretos, ativando repetidamente o MCAS — um sistema automático de controle de voo pouco conhecido pelos próprios pilotos. O sistema empurrou o nariz da aeronave para baixo diversas vezes; apesar de a tripulação seguir o checklist de emergência, o avião caiu cerca de 6 minutos após a decolagem. Foi o segundo acidente do mesmo modelo em menos de cinco meses, levando à paralisação mundial da frota 737 MAX.","Um sensor de ângulo de ataque (AOA) começou a enviar dados incorretos logo após a decolagem.","O MCAS, sistema de controle de voo pouco divulgado aos pilotos até então, moveu repetidamente o estabilizador horizontal para baixo com base nesse dado incorreto.","A tripulação seguiu o procedimento de emergência da Boeing, mas não conseguiu reverter os comandos automáticos a tempo.","Cinco meses antes, outro Boeing 737 MAX (voo Lion Air 610, na Indonésia) já havia caído em circunstâncias semelhantes.","Aircraft Accident Investigation Bureau (Etiópia) — com comentários divergentes do NTSB (EUA) e do BEA (França)","Os dados de voo mostram o sensor de ângulo de ataque com leitura muito acima da realidade logo após a decolagem.","O sistema MCAS ativou-se automaticamente diversas vezes, movendo o estabilizador horizontal para baixo.","Os pilotos tentaram seguir o checklist de emergência da Boeing, mas o avião continuou perdendo altitude.","Cinco meses antes, outro 737 MAX havia caído na Indonésia (voo Lion Air 610) em circunstâncias semelhantes, envolvendo o mesmo sistema.","A investigação etíope apontou como causa principal a ativação repetida e não comandada do MCAS, disparada por um sensor de ângulo de ataque defeituoso, sem que a tripulação conseguisse recuperar o controle. O NTSB (EUA) e o BEA (França) publicaram comentários oficiais discordando de parte do relatório, defendendo que fatores humanos e de gestão de recursos na cabine também deveriam ter sido considerados como causa contribuinte — uma divergência pouco comum entre órgãos de investigação.","O acidente levou à paralisação mundial da frota 737 MAX por quase dois anos, ao redesenho do MCAS (que passou a cruzar dados de dois sensores em vez de um) e a uma revisão do processo de certificação da FAA, incluindo nova legislação nos EUA sobre segurança na certificação de aeronaves.","Qual sistema automático empurrou repetidamente o nariz do avião para baixo?","Piloto automático padrão","MCAS","TCAS","GPWS","O que disparou a ativação indevida desse sistema?","Um sensor de ângulo de ataque com defeito","Erro de digitação na rota","Uma tempestade","Airbus A320neo","De onde o voo decolou?","Nairóbi","Adis Abeba","Cairo","Lagos","Cerca de quanto tempo após a decolagem ocorreu a queda?","30 segundos","6 minutos","40 minutos","2 horas","Este foi o segundo acidente do mesmo modelo em poucos meses; qual foi o primeiro?","TAM 3054","Lion Air 610, na Indonésia","Avianca 203","Voepass 2283","Aircraft Accident Investigation Bureau da Etiópia","O que aconteceu com a frota mundial de 737 MAX após este acidente?","Nada mudou","Foi parcialmente reduzida","Foi paralisada em todo o mundo","Só foi proibida na Etiópia","Helios Airways Voo 522","Grécia (voo cipriota)","Boeing 737-300","5B-DBY","Helios Airways (Chipre)","Larnaca (Chipre) → Atenas (Grécia) → Praga (República Tcheca), com escala em Atenas","Larnaca (Chipre)","Atenas (Eleftherios Venizelos)","Praga (Václav Havel)","Local da queda — perto de Grammatiko (Grécia)","14 de agosto de 2005","6 tripulantes e 115 passageiros a bordo","todas as 121 pessoas a bordo morreram","Válvula de pressurização deixada no modo manual causou hipóxia e incapacitação de toda a tripulação","Após uma checagem em solo em Larnaca, a válvula de pressurização da cabine foi deixada no modo manual, e a tripulação não percebeu isso durante os procedimentos pré-voo. À medida que o avião subia, a cabine perdeu pressão gradualmente; o alarme correspondente soou, mas foi confundido pelos pilotos com outro tipo de aviso. Todos a bordo, incluindo os pilotos, foram perdendo a consciência por hipóxia. A aeronave seguiu em piloto automático por quase duas horas até ficar sem combustível e cair em uma região montanhosa perto de Atenas.","Um mecânico havia deixado a válvula de pressurização em modo manual após um teste em solo e não a devolveu ao modo automático.","A checklist pré-voo da tripulação não identificou que a pressurização estava configurada incorretamente.","O alarme sonoro de altitude de cabine é parecido com o alarme de configuração incorreta para decolagem, o que confundiu os pilotos.","À medida que a cabine perdia pressão, os ocupantes foram gradualmente perdendo a consciência por hipóxia, incluindo os dois pilotos.","Air Accident Investigation and Aviation Safety Board (Grécia)","O seletor de pressurização da cabine foi encontrado na posição \"manual\", e não em \"automático\".","O alarme de altitude de cabine soou durante a subida, mas foi confundido pelos pilotos com outro tipo de alerta.","Caças F-16 enviados para observar a aeronave, já sem resposta no rádio, avistaram o piloto desacordado nos comandos.","Um comissário de bordo com licença de piloto tentou assumir os controles no fim do voo, usando oxigênio portátil, mas o avião ficou sem combustível antes que ele conseguisse reagir.","A investigação concluiu que a válvula de pressurização foi deixada no modo manual após uma checagem em solo, e que a tripulação não percebeu essa configuração durante os procedimentos pré-voo. A perda gradual de pressão causou hipóxia incapacitante em todos a bordo; o avião seguiu em piloto automático até ficar sem combustível e cair.","O caso levou fabricantes e autoridades a revisar o som dos alarmes de altitude de cabine para diferenciá-los melhor de outros alertas da cabine, além de reforçar os procedimentos de checagem da pressurização após testes de manutenção em solo.","O que causou a perda de consciência de toda a tripulação?","Incêndio a bordo","Hipóxia por despressurização da cabine","Envenenamento por gás","Falta de oxigênio nos tanques","Em que posição foi encontrada a válvula de pressurização?","Automática","Manual","Desligada","Não existia essa válvula","Por que os pilotos não reagiram ao alarme de altitude de cabine?","O alarme não tocou","Confundiram-no com outro tipo de alerta","Estavam dormindo","O alarme estava desligado","Quem tentou assumir os controles nos minutos finais do voo?","Um passageiro médico","Um comissário de bordo com licença de piloto","Um controlador de tráfego por rádio","Ninguém tentou","O que fez a aeronave finalmente cair?","Ficou sem combustível após voar em piloto automático","Foi abatida","Falha estrutural","Qual era a rota original do voo?","Larnaca–Atenas–Praga","Atenas–Roma","Larnaca–Londres","Nicósia–Paris","Air Accident Investigation and Aviation Safety Board da Grécia","Que tipo de aeronaves foram enviadas para observar o avião sem resposta no rádio?","Helicópteros de resgate","Caças F-16","Drones","Outro avião comercial","Lauda Air Voo 004","Tailândia (voo austríaco)","Boeing 767-3Z9ER \"Mozart\"","OE-LAV","Lauda Air (Áustria)","Hong Kong (Kai Tak) → Bangkok (Don Mueang) → Viena, com o acidente no trecho Bangkok–Viena","Hong Kong (Kai Tak)","Bangkok (Don Mueang)","Viena (VIE)","Local da queda — Parque Nacional Phu Toei (Tailândia)","26 de maio de 1991","10 tripulantes e 213 passageiros a bordo","todas as 223 pessoas a bordo morreram, sem sobreviventes","Reversor de empuxo do motor esquerdo abriu sozinho em pleno voo, em alta velocidade e altitude","Pouco depois de decolar de Bangkok rumo a Viena, o Boeing 767 da companhia austríaca Lauda Air subia passando de 7.500 metros de altitude quando o reversor de empuxo do motor 1 (esquerdo) se abriu sozinho, sem qualquer comando da tripulação. O fluxo de ar invertido destruiu a sustentação da asa esquerda, e o avião entrou em um mergulho que ultrapassou os limites estruturais da aeronave: as asas se romperam ainda no ar e os destroços caíram em uma área de selva montanhosa na província de Suphan Buri, na Tailândia. As 223 pessoas a bordo morreram; não houve sobreviventes.","O reversor de empuxo do motor esquerdo abriu sozinho durante a subida, a quase 7.500 metros de altitude e cerca de 400 nós de velocidade — bem além das condições testadas na certificação original do Boeing 767.","Nove minutos antes, um aviso no sistema EICAS já indicava possível falha no reversor, mas foi tratado pela tripulação como um alerta menor, sem ação corretiva imediata.","A perda de sustentação na asa esquerda foi repentina e violenta demais para qualquer manobra de recuperação naquela fase de voo.","O gravador de dados de voo (FDR) foi destruído no impacto, o que dificultou identificar com certeza total a falha elétrica que acionou o reversor.","Aircraft Accident Investigation Committee (Tailândia), com apoio do NTSB (EUA) e de investigadores austríacos","Nove minutos antes da queda, surgiu no painel um aviso do sistema EICAS sinalizando possível falha no reversor do motor esquerdo — a tripulação tratou como um alerta menor.","O gravador de dados de voo (FDR) foi destruído no impacto; apenas o gravador de voz da cabine (CVR) resistiu e pôde ser usado na investigação.","Nos segundos finais gravados pelo CVR, um dos pilotos é ouvido percebendo que o reversor havia se aberto, pouco antes de a aeronave entrar em mergulho descontrolado.","Testes posteriores em simulador, pedidos pelo próprio fundador da Lauda Air, mostraram que a abertura do reversor naquela velocidade e altitude era irrecuperável em praticamente todas as tentativas.","A comissão de investigação da Tailândia concluiu que a queda foi causada pela abertura não comandada do reversor de empuxo do motor esquerdo em pleno voo, que destruiu a sustentação da asa e tornou a aeronave incontrolável. A causa elétrica exata do acionamento não pôde ser determinada com certeza total, mas testes conduzidos depois pela Boeing apontaram possíveis falhas nas válvulas do sistema hidráulico do reversor.","O acidente levou a Boeing a instalar um terceiro sistema de travamento (\"sync lock\") nos reversores de empuxo de milhares de aviões 737, 747, 757 e 767 em todo o mundo, além de diretrizes de aeronavegabilidade da FAA que exigiram inspeções e válvulas adicionais de isolamento hidráulico nesses sistemas.","Qual era o modelo da aeronave do voo Lauda Air 004?","Airbus A310","Boeing 767-300ER","McDonnell Douglas MD-11","Boeing 747-200","O que causou a perda de controle da aeronave?","Abertura não comandada do reversor de empuxo em pleno voo","Pane seca de combustível","Tempestade severa","Em que país ocorreu a queda?","Áustria","Tailândia","Hong Kong","Índia","De qual companhia aérea era o voo?","Austrian Airlines","Lauda Air","Thai Airways","Cathay Pacific","Quantas pessoas morreram no acidente?","Qual era a rota do voo até o momento do acidente?","Viena → Bangkok","Hong Kong → Bangkok → Viena","Bangkok → Hong Kong","Singapura → Viena","O que aconteceu minutos antes da queda?","Um aviso no EICAS sobre possível falha no reversor apareceu no painel","A tripulação declarou emergência médica","Um motor pegou fogo","A cabine perdeu pressurização","Quem pressionou a Boeing a admitir publicamente que o acidente não tinha como ser evitado pela tripulação?","A ANAC","Niki Lauda, fundador da companhia aérea","O piloto sobrevivente","A OACI","O que a investigação apontou como possível origem da falha do reversor?","Sabotagem","Falhas elétricas em válvulas do sistema hidráulico do reversor","Erro de manutenção comprovado","Pássaros atingindo o motor","O que mudou na frota mundial de Boeing depois do acidente?","Instalação de um terceiro sistema de travamento (sync lock) nos reversores","Proibição definitiva do modelo 767","Redução da velocidade máxima de cruzeiro","Acidente do Learjet 60 em Palm Beach","Estados Unidos","Learjet 60","N722BD","Aurora Aviation (operando como \"Upper Jets\")","Austin–Bergstrom (Texas) → North Eleuthera (Bahamas)","Austin–Bergstrom (Texas)","North Eleuthera (Bahamas)","Local da queda — perto de Greenacres, Palm Beach County (aproximado)","1º de novembro de 2026","2 tripulantes e 7 passageiros a bordo","todas as 9 pessoas a bordo morreram; mais uma pessoa em solo ficou ferida","Investigação em andamento — a aeronave parece ter se desintegrado em voo antes de cair em área residencial da Flórida","Pouco depois de decolar de Austin, no Texas, rumo às Bahamas, o Learjet 60 subia a cerca de 10.600 metros (35.000 pés) quando a tripulação relatou turbulência, gelo e variações de altitude. Minutos depois, a aeronave entrou em uma descida extremamente rápida e se partiu ainda no ar, caindo em uma área residencial de Palm Beach County, perto de Greenacres/Cresthaven, na Flórida. As 9 pessoas a bordo morreram; uma pessoa no solo ficou ferida. Até a publicação desta ficha, o National Transportation Safety Board (NTSB) dos Estados Unidos ainda não divulgou um relatório preliminar ou final — por isso este caso aparece aqui como investigação em andamento, sem causa oficial determinada.","A tripulação relatou turbulência, gelo e oscilações de altitude de cerca de 210 metros (700 pés) pouco antes do acidente, voando perto de 10.600 metros (35.000 pés).","A aeronave havia recebido autorização para subir a 11.300 metros (37.000 pés) pouco antes de entrar em uma descida descontrolada.","O NTSB confirmou que o profundor (elevator) esquerdo se separou da aeronave antes do impacto, encontrado em três pedaços a alguns quilômetros do local da queda.","Os pilotos relataram uma condição de \"overspeed\" (velocidade acima do limite estrutural) nos instantes finais; havia tempestades na região, mas ainda não se sabe se o clima teve participação.","National Transportation Safety Board (NTSB, EUA)","A aeronave subia a cerca de 10.600 metros (35.000 pés) quando a tripulação relatou turbulência, gelo e oscilações de altitude de aproximadamente 210 metros (700 pés).","Em cerca de um minuto, a aeronave caiu de aproximadamente 10.700 metros (35.250 pés) para 2.700 metros (8.750 pés), pouco antes do impacto.","O campo de destroços se espalhou por cerca de 800 metros, indicando que partes da aeronave já haviam se soltado antes de atingir o solo.","O NTSB confirmou que o profundor esquerdo da aeronave se separou em voo e foi encontrado em três pedaços, a até alguns quilômetros do local principal da queda.","A investigação (identificada pelo NTSB como ERA27MA026) ainda está em andamento. Até a publicação desta ficha, o órgão não havia divulgado um relatório preliminar nem final — apenas coletivas de imprensa nos dias seguintes ao acidente. O que se sabe até agora: o profundor esquerdo da aeronave se separou em voo antes do impacto, os pilotos relataram uma condição de overspeed, e havia tempestades na região (sem confirmação se o clima contribuiu). Investigações do NTSB costumam levar de 12 a 24 meses até a publicação de um relatório final com causa provável determinada — esta ficha será atualizada quando isso acontecer.","Como a causa raiz ainda não foi estabelecida, não há, até agora, nenhuma mudança regulatória ou de certificação decorrente deste acidente. Esta seção será atualizada assim que o NTSB publicar seu relatório preliminar ou final.","Cessna Citation","Gulfstream G450","Embraer Phenom 300","Em que data ocorreu o acidente?","1º de outubro de 2026","15 de novembro de 2026","1º de dezembro de 2026","Em que estado ucionados</div><div class=\"v\">","<div class=\"field\"><div class=\"k\">Taxa de acerto nos quizzes</div><div class=\"v\">","<div class=\"field\"><div class=\"k\">Data de emissão</div><div class=\"v\">","<div class=\"field\"><div class=\"k\">Período investigado</div><div class=\"v\">","<p class=\"cert-footnote\">Este certificado é uma credencial fictícia, gerada apenas para fins educativos dentro deste projeto — não é um documento oficial de nenhum órgão de investigação de acidentes.</p>","<button class=\"btn primary\" data-print-cert>Imprimir / salvar como PDF</button>","<p><strong>Aviso importante:</strong> este certificado não tem validade em nenhum lugar — não é reconhecido por nenhuma instituição, órgão regulador, empresa ou processo seletivo. É apenas uma credencial simbólica, criada exclusivamente para fins educativos dentro deste projeto (Investigador Aéreo).</p>","<div class=\"cert-eyebrow\">Investigador Aéreo · credencial pendente</div>","<h1 class=\"cert-title\">Certificado de Investigador</h1>","<p class=\"cert-sub\" style=\"margin:0 0 10px;\">investigações encerradas · faltam "," para emitir sua credencial</p>","<p class=\"cert-sub cert-pending-title\">Casos que ainda faltam encerrar</p>","<h2>Sobre o projeto</h2>","<p class=\"sub\">Metodologia e transparência de fontes</p>","Nenhum dado inventado. Toda ficha tem fonte.","<p style=\"max-width:680px;color:var(--text-1);\">Este é um projeto educativo sobre investigação de acidentes aeronáuticos, com foco em casos brasileiros e latino-americanos. Nenhum dado de vítimas, aeronaves ou causas foi inventado: cada ficha foi construída cruzando relatórios de órgãos oficiais de investigação com reportagens de veículos de imprensa estabelecidos.</p>","<p style=\"max-width:680px;color:var(--text-1);\">Alguns casos são muito recentes e ainda estão sob investigação — nesses, a ficha é marcada como <b>\"investigação em andamento\"</b> e mostra só os fatos e achados preliminares já confirmados publicamente, sem apontar uma causa oficial que ainda não existe. Assim que o órgão responsável publicar seu relatório final, a ficha é atualizada.</p>","<div class=\"block-title\" style=\"margin-top:28px;\">Órgãos oficiais consultados</div>","<li><b>CENIPA</b> — Centro de Investigação e Prevenção de Acidentes Aeronáuticos (Brasil)</li>","<li><b>NTSB</b> — National Transportation Safety Board (Estados Unidos)</li>","<li><b>Aerocivil</b> — Unidad Administrativa Especial de Aeronáutica Civil (Colômbia)</li>","<li><b>JIAAC</b> — Junta de Investigación de Accidentes de Aviación Civil (Argentina)</li>","<li><b>BEA</b> — Bureau d’Enquêtes et d’Analyses (França)</li>","<li><b>DGAC/Peru</b> — Comisión de Investigación de Accidentes, Dirección General de Aeronáutica Civil (Peru)</li>","<li><b>AIB</b> — Aircraft Accident Investigation Bureau (Etiópia)</li>","<li><b>AAIASB</b> — Air Accident Investigation and Aviation Safety Board (Grécia)</li>","<li><b>AAIC</b> — Aircraft Accident Investigation Committee (Tailândia), com apoio do NTSB e de investigadores austríacos</li>","<div class=\"block-title\" style=\"margin-top:28px;\">Imprensa e apuração complementar</div>","<p style=\"color:var(--text-1);max-width:680px;\">Dados complementares (datas, rotas, números de vítimas) foram cruzados com reportagens de G1, CNN Brasil, Folha de Londrina/Folha Vitória, O Tempo, InfoMoney, Metrópoles, Aventuras na História e outros veículos, além de verbetes consolidados da Wikipédia — sempre usados como ponto de partida e não como fonte final.</p>","<div class=\"block-title\" style=\"margin-top:28px;\">Sobre o login</div>","<p style=\"color:var(--text-1);max-width:680px;\">O acesso tem 3 telas: <b>criar conta</b> (e-mail, nome e senha), <b>entrar</b> (para quem já tem conta) e <b>recuperar senha</b> (troca a senha direto pelo e-mail cadastrado, já que este projeto não envia e-mail de verdade). <b>Isto não é um login com segurança de nível profissional</b>: como o site não tem um servidor próprio, a senha não usa criptografia de verdade e fica guardada em um espaço que, tecnicamente, qualquer pessoa com acesso a este site poderia consultar. Por isso, nunca use aqui uma senha que você usa em outro lugar — crie uma senha nova, só para este projeto.</p>","<div class=\"block-title\" style=\"margin-top:28px;\">Sobre o progresso salvo</div>","<p style=\"color:var(--text-1);max-width:680px;\">Suas evidências reveladas, hipóteses, quizzes e casos encerrados ficam salvos automaticamente, associados ao e-mail que você digitou. Se quiser recomeçar do zero (mantendo o mesmo e-mail), use o botão abaixo. Para usar outro e-mail, use \"Trocar e-mail\" no topo da página.</p>","<button class=\"reset-link\" id=\"reset-progress\">Apagar meu progresso e recomeçar</button>","Agradecimentos","Este projeto foi idealizado e desenvolvido por <b>Benjamin</b>, com o propósito de tornar a segurança de voo compreensível para qualquer pessoa, e não só para quem é da aviação.","Agradeço aos órgãos de investigação, como CENIPA, NTSB, BEA, JIAAC, Aerocivil e os demais citados nas fichas, cujo trabalho público torna possível aprender com cada caso.","<p class=\"gate-note\" style=\"color:var(--danger) !important;\">⚠️ Este ambiente não está conseguindo salvar dados agora. Você pode continuar, mas o progresso não será lembrado da próxima vez.</p>","<p class=\"gate-note\" style=\"color:var(--blue) !important;\">ℹ️ Você abriu o arquivo diretamente (fora do Claude): o progresso vai ficar salvo só neste navegador/computador, sem sincronizar com outros dispositivos.</p>","\" data-gate-tab=\"signup\">Criar conta</button>","\" data-gate-tab=\"login\">Entrar</button>","\" data-gate-tab=\"recover\">Recuperar senha</button>","<h1>Crie seu usuário</h1>","<p>Cadastre um e-mail e uma senha para salvar as evidências que você já revelou, suas hipóteses e os casos encerrados.</p>","<input type=\"text\" id=\"gate-nome\" placeholder=\"Seu nome\" autocomplete=\"name\">","<input type=\"email\" id=\"gate-email\" placeholder=\"seuemail@exemplo.com\" autocomplete=\"email\">","<input type=\"password\" id=\"gate-password\" placeholder=\"Crie uma senha (mín. 4 caracteres)\" autocomplete=\"new-password\">","<input type=\"password\" id=\"gate-confirm\" placeholder=\"Confirme a senha\" autocomplete=\"new-password\">","<button class=\"btn primary\" id=\"gate-submit\" style=\"width:100%;justify-content:center;\">Criar usuário</button>","<p class=\"gate-switch\">Já tem uma conta? <button data-gate-tab=\"login\">Entrar</button></p>","<p class=\"gate-note\">⚠️ Este cadastro existe só para este projeto: a senha não usa criptografia de verdade e fica guardada em um espaço que qualquer pessoa com acesso a este site poderia, em tese, consultar. <b>Nunca use aqui uma senha que você usa em outro lugar</b> — crie uma senha nova só para isso.</p>","<h1>Recuperar senha</h1>","<p>Digite o e-mail da sua conta e escolha uma nova senha. (Como este projeto não tem servidor de e-mail, a troca é feita direto aqui, sem link de confirmação.)</p>","<input type=\"email\" id=\"gate-email\" placeholder=\"seuemail@exemplo.com\" autocomplete=\"email\" value=\"","<input type=\"password\" id=\"gate-password\" placeholder=\"Nova senha (mín. 4 caracteres)\" autocomplete=\"new-password\">","<input type=\"password\" id=\"gate-confirm\" placeholder=\"Confirme a nova senha\" autocomplete=\"new-password\">","<button class=\"btn primary\" id=\"gate-submit\" style=\"width:100%;justify-content:center;\">Atualizar senha</button>","<p class=\"gate-switch\">Lembrou a senha? <button data-gate-tab=\"login\">Entrar</button></p>","<h1>Entrar</h1>","<p>Digite o e-mail e a senha da sua conta para continuar de onde parou.</p>","<input type=\"password\" id=\"gate-password\" placeholder=\"Senha\" autocomplete=\"current-password\">","<button class=\"btn primary\" id=\"gate-submit\" style=\"width:100%;justify-content:center;\">Entrar</button>","<p class=\"gate-switch\">Não tem conta? <button data-gate-tab=\"signup\">Criar usuário</button> · <button data-gate-tab=\"recover\">Esqueci minha senha</button></p>","← Voltar ao site sem conta","#AFDCF7","#1D6FA8","position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;","Criando…","Atualizando…","Entrando…","🗺️ Ocultar mapa da rota","🗺️ Ver rota no mapa","Isso não é propaganda — é só uma referência para você ver fotos reais dessa aeronave. Você vai ser redirecionado(a) para o site externo JetPhotos.com, que não tem relação com este projeto. Continuar?","Tem certeza que quer apagar todo o seu progresso associado a este e-mail?","Sistema a bordo que avisa os pilotos sobre aeronaves próximas, usando o sinal do transponder delas, sem depender do solo. Se o transponder de um avião está desligado, ele fica invisível para o TCAS dos outros.","Transponder","Aparelho que responde automaticamente aos sinais do radar. É por ele que o controle de tráfego e o TCAS de outros aviões \"enxergam\" a aeronave.","MEL","Lista de Equipamentos Mínimos: define com quais equipamentos inoperantes o avião ainda pode voar, e sob quais condições.","CFIT","\"Voo controlado contra o terreno\": um avião em condições de voo e sob controle dos pilotos é levado sem querer contra o terreno, a água ou um obstáculo.","GPWS / EGPWS","Sistemas que alertam os pilotos sobre terreno perigoso à frente, a tempo de evitar um CFIT. O EGPWS é a versão mais avançada.","Estol (perda de sustentação)","Queda repentina da sustentação da asa quando o ângulo de ataque crítico é atingido ou ultrapassado. É um fenômeno da asa e não significa que o motor parou.","Ângulo de ataque","Ângulo em que o vento relativo encontra a asa. Acima de um limite (o ângulo crítico), a asa entra em estol.","Reversor de empuxo","Mecanismo do motor que inverte o fluxo de ar para ajudar o avião a frear na pista após o pouso ou numa decolagem abortada.","Tubo de Pitot / tomadas estáticas","Sensores de pressão do ar usados para calcular velocidade, altitude e velocidade vertical. Se forem bloqueados (gelo no AF447, fita adesiva no Aeroperú 603), os instrumentos mostram valores errados.","Lei de controle de voo do Boeing 737 MAX que reduz a tendência de o nariz subir em ângulos de ataque altos, movendo o estabilizador horizontal automaticamente.","EICAS","Sistema que mostra na cabine os parâmetros dos motores e alerta a tripulação sobre falhas ou configurações erradas.","FDR e CVR","As \"caixas-pretas\": o FDR grava parâmetros de voo e o CVR grava o som da cabine dos pilotos, para a investigação.","Hipóxia","Falta de oxigênio nos tecidos do corpo. Com a cabine despressurizada em altitude, pode levar à perda de consciência, como no Helios 522.","Consciência situacional","Ter noção de tudo o que é preciso saber sobre o que está acontecendo.","CRM (gestão de recursos da tripulação)","Uso eficaz de todos os recursos disponíveis na cabine para uma operação segura e eficiente.","Flaps e slats","Superfícies móveis nas asas que aumentam a sustentação em baixa velocidade, na decolagem e no pouso.","Aerofreios (speedbrakes)","Painéis nas asas que, abertos, reduzem a velocidade e também a capacidade de subida, como no American 965.","Parafuso chato","Giro descontrolado em que o avião desce em espiral vertical após perder sustentação. Foi o que ocorreu no Voepass 2283.","Parada dos motores por falta total de combustível.","Grooving","Ranhuras no asfalto da pista que escoam a água e melhoram a frenagem com chuva.","Overspeed","Velocidade acima do limite estrutural do avião.","Altitude de cabine","A \"altitude\" equivalente à pressão dentro do avião. Se ela sobe demais, falta oxigênio a bordo.","Manete","A alavanca que controla a potência do motor.","Profundor (elevator)","Superfície móvel na cauda que faz o nariz subir ou descer.","Fonte: SKYbrary (EUROCONTROL / Flight Safety Foundation)","Fonte: fichas dos casos deste site","Definição geral — ainda sem fonte específica conferida","Ver no SKYbrary ↗","Aparece em:","<h2>Glossário</h2>","Termos técnicos que aparecem nas fichas dos casos, explicados de um jei ra. Cada acerto vale 1 ponto; errar não tira ponto, mas gasta tempo.","Começar ⏱️","{n} acerto","{n} acertos","Libera em {titulo} · faltam {n} XP","Recorde: {r} · {x} de {m} XP","Jogar","⭐ Desafios de elite","Liberados conforme o seu título sobe. Locais de queda e rotas são aproximados, como nas fichas.","<span class=\"ai-fab-icon\" aria-hidden=\"true\">✦</span><span class=\"ai-fab-label\">Pergunte à IA</span>","<section class=\"ai-panel\" id=\"ai-panel\" role=\"dialog\" aria-label=\"Assistente de IA\" hidden>","<div><div class=\"ai-title\">✦ Assistente do investigador</div>","<div class=\"ai-sub\">Responde com base nas fichas deste site · pode errar, confira na ficha</div></div>","<button class=\"ai-close\" id=\"ai-close\" aria-label=\"Fechar assistente\">✕</button>","<textarea id=\"ai-input\" rows=\"2\" maxlength=\"500\" placeholder=\"Escreva sua pergunta sobre os casos...\"></textarea>","<button class=\"btn primary ai-send\" id=\"ai-send\" type=\"submit\">Enviar</button>","<p class=\"ai-privacy\">Suas perguntas são enviadas à OpenAI (ChatGPT) para gerar a resposta. Não escreva dados pessoais.</p>","Caso em foco: ","Sem caso em foco · pergunte sobre qualquer um dos casos do catálogo","Olá! Posso explicar um caso, comparar acidentes ou explicar termos como TCAS, estol ou reversor. Se você ainda não revelou a conclusão oficial de um caso, eu te ajudo a raciocinar sem entregar a resposta.","Pensando…","Muitas perguntas seguidas. Espere um minuto e tente de novo.","O assistente não está disponível nesta versão do site (ele só funciona no site publicado no Netlify).","Não consegui responder agora. Tente de novo em instantes.","Crie uma conta","👀 Modo visitante","Nada do que você faz agora fica salvo.","Já tenho conta · Entrar","Os termos técnicos das fichas, explicados de um jeito simples, ficam disponíveis para quem tem conta.","Trilhas de perguntas, desafios no mapa, XP e títulos ficam disponíveis para quem tem conta.","Conquistas","Seus títulos e o seu XP ficam disponíveis para quem tem conta.","O certificado de investigador é emitido para quem tem conta e encerra os casos.","Conteúdo exclusivo","Este conteúdo fica disponível para quem tem conta.","Criar uma conta leva menos de um minuto e é gratuito. No modo visitante você continua podendo ler todas as fichas no Catálogo.","Evidências da investigação","Modo investigador, quiz e mapa da rota","Com uma conta você revela as evidências uma a uma, registra sua hipótese antes de ver a conclusão, faz o quiz de revisão, vê a rota no mapa e ganha XP."],"en":["TAM Flight 3054","Brazil","Airbus A320-233","PR-MBK","TAM Linhas Aéreas","Porto Alegre (POA) → São Paulo–Congonhas (CGH)","Porto Alegre (POA)","São Paulo–Congonhas (CGH)","Crash site (TAM Express yard, inside Congonhas Airport)","July 17, 2007","6 crew and 181 passengers on board","187 people on board and 12 on the ground","Landing on a wet runway without braking grooves, with one thrust reverser locked out","The Airbus A320 was arriving from Porto Alegre and could not stop in time on runway 35L at Congonhas Airport, in São Paulo, on the rainy afternoon of July 17, 2007. The aircraft overran the runway, crossed an avenue and crashed into a building belonging to TAM itself, bursting into flames. It was the deadliest air accident in Brazil's history.","Runway 35L was wet and had not yet received the grooving that improves braking on rainy days.","The right engine's thrust reverser had been locked out for days, a condition that was nonetheless authorized for operation.","The right engine's thrust lever remained in the takeoff position during the landing attempt, reducing braking.","Other pilots had already reported difficulty stopping at Congonhas when the runway was wet.","CENIPA — Brazil's Aeronautical Accident Investigation and Prevention Center","The runway was wet and had no braking grooves at the time of landing.","Engine 2's thrust reverser had been mechanically locked out for four days.","Flight data show the right thrust lever in the takeoff position, not in reverse.","Reports from other pilots pointed to a known risk of aquaplaning on runway 35L.","CENIPA did not point to a single cause but to a combination of factors: an ungrooved runway, a locked-out reverser and the right engine's thrust lever in the wrong position, which together prevented the aircraft from stopping in time.","The accident sped up the requirement for grooving (drainage grooves) on runways in Brazil and led ANAC to revise the minimum runway-length criteria for the Airbus A320 at Congonhas.","Pilot / Crew","The right engine's thrust lever remained in the takeoff position during the landing attempt, reducing braking — an aircraft configuration checkpoint before touchdown.","Before this flight, other pilots had already reported difficulty stopping at Congonhas on a wet runway — a known risk signal that circulated informally without ever becoming formal action.","If you knew, as in this case, that other crews had already reported braking difficulty on a specific runway on rainy days, what formal channel exists in your company today to record that — and is it actually used?","Maintenance","The right engine's thrust reverser had been mechanically locked out for four days — a condition that, although technically authorized for operation, reduced braking capacity at the moment it was needed most.","The case illustrates the difference between \"cleared to fly with the open item\" (MEL) and \"acceptable day-to-day operational risk\" — two judgments that are not always aligned.","When an item goes onto the list of authorized open items (MEL), who checks whether it interacts badly with other conditions of the day (a wet runway, for example) — or is each item assessed in isolation?","What aircraft model was TAM flight 3054?","Boeing 737","Airbus A320","Fokker 100","Embraer 190","Where did the flight depart from before trying to land at Congonhas?","Curitiba","Porto Alegre","Recife","Belo Horizonte","In what year did the accident happen?","How many people died in total?","Which runway condition contributed to the accident?","Icy runway","Wet runway without braking grooves","Runway too short","Unlit runway","What was locked out on one of the engines?","The landing gear","The thrust reverser","The flap","The rudder","Which agency was responsible for the official investigation?","NTSB","BEA","CENIPA","Aerocivil","What position was the right engine's thrust lever in during landing?","Full reverse","Takeoff","Idle","Taxi","This accident is considered:","Brazil's first fatal accident","The deadliest air accident in Brazil's history","An incident with no victims","The only Airbus accident in Brazil","Besides passengers and crew, how many people died on the ground?","None","Gol Flight 1907","Boeing 737-8EH","PR-GTD","Gol Linhas Aéreas","Manaus (MAO) → Brasília (BSB) → Rio de Janeiro–Galeão (GIG)","Manaus (MAO)","Brasília (BSB)","Rio de Janeiro–Galeão (GIG)","Wreckage crash site (jungle, Mato Grosso)","September 29, 2006","6 crew and 148 passengers on board","all 154 people on board the Boeing died","Mid-air collision with a Legacy business jet over the Amazon","A Gol Boeing 737 and a Legacy 600 business jet were flying on the same airway, in opposite directions and at the same altitude, over Mato Grosso. The Legacy's wingtip struck the Boeing's left wing; the Boeing lost control and crashed into the Amazon rainforest. Despite the damage, the Legacy managed to land safely at an air base.","The Legacy's transponder and collision-avoidance system (TCAS) were off at the time of the collision.","Air traffic controllers did not notice that the two aircraft were at the same altitude on the same airway.","Communication failures between the controllers and the Legacy crew were not noticed in time.","The Legacy crew, with little experience on that aircraft, did not notice the transponder had been switched off.","CENIPA (Brazil) and NTSB (United States) — the agencies disagreed on the weight of each cause","Both aircraft were crossing the same airway, at the same altitude, in opposite directions.","The Legacy's transponder was off, making it invisible to the Boeing's TCAS.","Air traffic controllers did not warn either aircraft about the collision risk.","The Legacy crew did not notice the transponder failure alert on their display.","CENIPA mainly blamed failures by the air traffic controllers and the Legacy crew; the US NTSB, on the other hand, concluded that both crews acted correctly given the information they had, pointing to air traffic control as the central source of the problem.","The case exposed structural failures in Brazilian air traffic control (the so-called \"air traffic blackout\") and sped up the modernization of the system, with a stronger requirement to keep the transponder on throughout the flight.","Which other aircraft did the Gol Boeing collide with?","A Brazilian Air Force fighter jet","A Legacy 600 business jet","Another Boeing 737","A helicopter","Over which region did the accident happen?","The coast of Bahia","The Amazon rainforest in Mato Grosso","Serra do Mar","The Pantanal in Mato Grosso do Sul","Which Legacy system was off at the time of the collision?","Autopilot","Transponder/TCAS","Radio","Landing gear","How many people died on the Gol Boeing?","What happened to the Legacy jet after the collision?","It crashed along with the Boeing","It managed to land safely","It exploded in mid-air","It returned to its origin","What was the Gol flight's final destination?","Manaus","Brasília","Rio de Janeiro","Fortaleza","What did CENIPA identify as mainly responsible?","Only the Gol crew","Air traffic controllers and the Legacy crew","A structural failure of the Boeing","Weather conditions","What different conclusion did the (US) NTSB reach?","The same as CENIPA's","It emphasized air traffic control failures","There was no human error at all","The Legacy crashed from fuel exhaustion","How many survivors were there on the Gol aircraft?","VASP Fligh ned three times during the final seconds of the flight.","The data indicate an uncommanded opening of the right engine's reverser seconds after takeoff.","The aircraft's speed dropped sharply to about 126 knots.","The landing gear remained extended throughout the recovery attempt.","The model had already recorded earlier minor incidents with the same reverser system.","CENIPA concluded that the crash was caused by the uncommanded opening of the right engine's thrust reverser shortly after takeoff, made worse by inadequate handling of the left engine's power and by the landing gear not being retracted.","Fokker was advised to modify the reverser's electrical unlocking system, and TAM began recording these failures more rigorously in the technical logbook — the case also prompted the creation of Abrapavaa, an association of relatives of air-accident victims in Brazil.","What caused the aircraft to lose lift?","Uncommanded opening of the thrust reverser","Lack of fuel","Bird strike","Flap failure","Where had the flight originally departed from?","Caxias do Sul","In which São Paulo neighborhood did the airplane crash?","Jabaquara","Congonhas","Moema","Santo Amaro","About how many seconds after takeoff did the crash happen?","24 seconds","2 minutes","10 minutes","1 hour","How many people died in total?","What did the pilots fail to do, according to the report?","Retract the landing gear","Engage the autopilot","Notify the tower","Reduce speed","What was the flight's final destination?","Which agency investigated the accident?","Voepass Flight 2283","ATR 72-500","PS-VPB","Voepass Linhas Aéreas","Cascavel (PR) → Guarulhos (SP)","Cascavel (PR)","Guarulhos (SP)","Crash site — Vinhedo (SP)","August 9, 2024","4 crew and 58 passengers on board","all 62 people on board died","Loss of lift and \"flat spin\" after a failure in the de-icing system","On approach to Guarulhos, the ATR 72 lost lift at around 17,000 feet and entered a \"flat spin\", spiraling down onto a residential co  hour","On the landing approach","Still on the ground","LAPA Flight 3142","Argentina","Boeing 737-204","LV-WRZ","LAPA (Líneas Aéreas Privadas Argentinas)","Buenos Aires–Aeroparque (AEP) → Córdoba (COR)","Buenos Aires–Aeroparque (AEP)","Córdoba (COR)","Crash site — near Aeroparque Jorge Newbery","August 31, 1999","passengers, crew and people struck on the ground","Takeoff attempted with the flaps/slats out of position","The Boeing 737 tried to take off from Aeroparque Jorge Newbery, in central Buenos Aires, without being able to gain enough altitude. The aircraft broke through the airport fence, crossed a road hitting vehicles and exploded when it struck a neighboring golf course.","The flaps and slats, which increase lift on takeoff, were not correctly configured.","The pre-takeoff checklist reportedly was not properly completed by the crew.","Investigations raised the hypothesis of crew distraction in the cockpit moments before takeoff.","The airport is surrounded by avenues and buildings, leaving little margin for a rejected takeoff.","JIAAC — Civil Aviation Accident Investigation Board (Argentina)","The flight recorders indicate that the flaps were not extended to the takeoff position.","The aircraft's incorrect-configuration alarm should have sounded in these conditions.","Witnesses reported a conversation between the pilots that did not follow the standard checklist procedure.","The runway used has a limited length and is surrounded by busy urban avenues.","The investigation concluded that the aircraft tried to take off without the flaps and slats correctly configured, probably due to a failure to complete the pre-flight checklist, which prevented enough lift to take off safely.","In Argentina and other countries, the accident reinforced the importance of takeoff configuration warning systems and strict discipline in completing the pre-flight checklist.","In which city is the Aeroparque from which the airplane tried to take off?","Córdoba","Santiago","Montevideo","Mendoza","Rosario","Bariloche","What was incorrectly configured on takeoff?","The flaps and slats","The autopilot","The reverser","What did the aircraft hit when it left the runway?","A hangar","A fence and vehicles on a road","The control tower","What did the aircraft finally crash into?","A golf course","A river","Which Argentine agency investigated the case?","What did the investigation suggest about the pre-flight checklist?","It was followed correctly","It may not have been completed correctly","It did not exist","It was done twice","Aeroperú Flight 603","Peru","Boeing 757-23A","N52AW","AeroPerú","Miami (USA) → Lima (Peru) → Santiago (Chile), with a stop in Lima","Lima (Jorge Chávez)","Santiago (Arturo Merino Benítez)","Crash site — Pacific Ocean, northwest of Lima","October 2, 1996","9 crew and 61 passengers on board","all 70 people on board died","Adhesive tape left over the static ports gave false altitude and airspeed readings","Shortly after taking off from Lima bound for Santiago, at night and over the Pacific Ocean, the Boeing 757's instruments began showing contradictory altitude and airspeed information. With no outside visual references and conflicting alarms sounding at the same time, the crew lost a real sense of altitude until the aircraft hit the water.","During a cleaning of the aircraft in Lima, adhesive tape was placed over the static ports and was not removed before takeoff.","Without reliable altitude and airspeed information, the crew received overspeed and stall warnings at the same time — a technically contradictory combination.","The flight took place at night, over the ocean, with no outside visual reference to help confirm the real altitude.","Boeing was later criticized for not having adequately trained the AeroPerú crew for this specific type of instrument failure.","Comisión de Investigación de Accidentes (Dirección General de Aeronáutica Civil, Peru)","The static ports, used to measure altitude and airspeed, were covered with adhesive tape used during the aircraft's cleaning.","Moments after takeoff, the altimeter even showed 0 feet with the airplane already in the air.","Overspeed and stall (loss of lift) warnings sounded at the same time, something technically impossible to happen together.","Flying over the sea, at night and with no visible horizon, the pilots had no way of confirming the real altitude visually.","The Peruvian investigation concluded that the static ports, blocked by adhesive tape that was not removed after maintenance work in Lima, generated false altitude and airspeed readings. With no reliable instruments and flying at night over the ocean, the crew lost a real sense of altitude until the impact with the water.","Boeing strengthened the procedures for inspecting the static pressure ports before takeoff, and airlines began paying more attention to training crews to deal with simultaneous failures of multiple flight instruments.","What caused the false instrument readings?","An electrical storm","Adhesive tape left over the static ports","Engine failure","An autopilot error","Where did the flight take off from shortly before the crash?","Over which ocean did the accident happen?","What made it hard for the crew to perceive the real altitude?","The flight was in daylight and clear weather","The flight was at night and over the sea, with no visual references","There was another airplane nearby","The cockpit had no power","Which company was criticized for a lack of crew training?","Airbus","Boeing","Embraer","AeroPerú itself, only","Peru's Comisión de Investigación de Accidentes","What contradictory alarms sounded at the same time in the cockpit?","Fire and depressurization","Overspeed and stall","Engine failure and landing gear","Ground collision and collision with another aircraft","Ethiopian Airlines Flight 302","Ethiopia","Boeing 737 MAX 8","ET-AVJ","Ethiopian Airlines","Addis Ababa (Ethiopia) → Nairobi (Kenya)","Addis Ababa (Bole)","Nairobi (Jomo Kenyatta)","Crash site — near Bishoftu (Ethiopia)","March 10, 2019","8 crew and 149 passengers on board","all 157 people on board died, from 35 different nationalities","A faulty angle-of-attack sensor repeatedly activated the MCAS system, forcing the aircraft's nose down","Shortly after taking off from Addis Ababa, an angle-of-attack sensor on the Boeing 737 MAX began sending incorrect data, repeatedly activating MCAS — an automatic flight control system that the pilots themselves knew little about. The system pushed the aircraft's nose down several times; although the crew followed the emergency checklist, the airplane crashed about 6 minutes after takeoff. It was the second accident of the same model in less than five months, leading to the worldwide grounding of the 737 MAX fleet.","An angle-of-attack (AOA) sensor began sending incorrect data right after takeoff.","MCAS, a flight control system that had been little disclosed to pilots until then, repeatedly moved the horizontal stabilizer nose-down based on that incorrect data.","The crew followed Boeing's emergency procedure but could not reverse the automatic commands in time.","Five months earlier, another Boeing 737 MAX (Lion Air flight 610, in Indonesia) had crashed in similar circumstances.","Aircraft Accident Investigation Bureau (Ethiopia) — with dissenting comments from the NTSB (USA) and the BEA (France)","The flight data show the angle-of-attack sensor reading far above reality right after takeoff.","The MCAS system activated automatically several times, moving the horizontal stabilizer nose-down.","The pilots tried to follow Boeing's emergency checklist, but the airplane kept losing altitude.","Five months earlier, another 737 MAX had crashed in Indonesia (Lion Air flight 610) in similar circumstances, involving the same system.","The Ethiopian investigation identified as the main cause the repeated, uncommanded activation of MCAS, triggered by a faulty angle-of-attack sensor, without the crew being able to regain control. The NTSB (USA) and the BEA (France) published official comments disagreeing with part of the report, arguing that human factors and cockpit resource management should also have been considered contributing causes — an unusual disagreement between investigation agencies.","The accident led to the worldwide grounding of the 737 MAX fleet for almost two years, the redesign of MCAS (which began cross-checking data from two sensors instead of one) and a review of the FAA certification process, including new US legislation on aircraft certification safety.","Which automatic system repeatedly pushed the airplane's nose down?","Standard autopilot","MCAS","TCAS","GPWS","What triggered the improper activation of that system?","A faulty angle-of-attack sensor","A typo in the route","A storm","Airbus A320neo","Where did the flight take off from?","Nairobi","Addis Ababa","Cairo","Lagos","About how long after takeoff did the crash happen?","30 seconds","6 minutes","40 minutes","2 hours","This was the second accident of the same model in a few months; which was the first?","TAM 3054","Lion Air 610, in Indonesia","Avianca 203","Voepass 2283","Ethiopia's Aircraft Accident Investigation Bureau","What happened to the worldwide 737 MAX fleet after this accident?","Nothing changed","It was partially reduced","It was grounded worldwide","It was only banned in Ethiopia","Helios Airways Flight 522","Greece (Cypriot flight)","Boeing 737-300","5B-DBY","Helios Airways (Cyprus)","Larnaca (Cyprus) → Athens (Greece) → Prague (Czech Republic), with a stop in Athens","Larnaca (Cyprus)","Athens (Eleftherios Venizelos)","Prague (Václav Havel)","Crash site — near Grammatiko (Greece)","August 14, 2005","6 crew and 115 passengers on board","all 121 people on board died","Pressurization valve left in manual mode caused hypoxia and incapacitation of the entire crew","After a ground check in Larnaca, the cabin pressurization valve was left in manual mode, and the crew did not notice this during the pre-flight procedures. As the airplane climbed, the cabin gradually lost pressure; the corresponding alarm sounded, but the pilots mistook it for another kind of warning. Everyone on board, including the pilots, gradually lost consciousness from hypoxia. The aircraft continued on autopilot for almost two hours until it ran out of fuel and crashed in a mountainous area near Athens.","A mechanic had left the pressurization valve in manual mode after a ground test and did not return it to automatic mode.","The crew's pre-flight checklist did not identify that the pressurization was set incorrectly.","The cabin altitude warning horn sounds similar to the takeoff configuration warning, which confused the pilots.","As the cabin lost pressure, the occupants gradually lost consciousness from hypoxia, including both pilots.","Air Accident Investigation and Aviation Safety Board (Greece)","The cabin pressurization selector was found in the \"manual\" position, not \"automatic\".","The cabin altitude warning sounded during the climb, but the pilots mistook it for another kind of alert.","F-16 fighter jets sent to observe the aircraft, which was no longer responding on the radio, saw the pilot unconscious at the controls.","A flight attendant with a pilot's license tried to take the controls at the end of the flight, using portable oxygen, but the airplane ran out of fuel before he could react.","The investigation concluded that the pressurization valve was left in manual mode after a ground check, and that the crew did not notice this setting during the pre-flight procedures. The gradual loss of pressure caused incapacitating hypoxia in everyone on board; the airplane continued on autopilot until it ran out of fuel and crashed.","The case led manufacturers and authorities to revise the sound of cabin altitude warnings to better distinguish them from other cockpit alerts, and to strengthen pressurization check procedures after ground maintenance tests.","What caused the entire crew to lose consciousness?","A fire on board","Hypoxia from cabin depressurization","Gas poisoning","Lack of oxygen in the tanks","In what position was the pressurization valve found?","Automatic","Manual","Off","That valve did not exist","Why didn't the pilots react to the cabin altitude warning?","The alarm did not sound","They mistook it for another kind of alert","They were asleep","The alarm was switched off","Who tried to take the controls in the final minutes of the flight?","A passenger who was a doctor","A flight attendant with a pilot's license","An air traffic controller over the radio","No one tried","What finally made the aircraft crash?","It ran out of fuel after flying on autopilot","It was shot down","Structural failure","What was the flight's original route?","Larnaca–Athens–Prague","Athens–Rome","Larnaca–London","Nicosia–Paris","Greece's Air Accident Investigation and Aviation Safety Board","What type of aircraft were sent to observe the airplane that was not responding on the radio?","Rescue helicopters","F-16 fighter jets","Drones","Another commercial airplane","Lauda Air Flight 004","Thailand (Austrian flight)","Boeing 767-3Z9ER \"Mozart\"","OE-LAV","Lauda Air (Austria)","Hong Kong (Kai Tak) → Bangkok (Don Mueang) → Vienna, with the accident on the Bangkok–Vienna leg","Hong Kong (Kai Tak)","Bangkok (Don Mueang)","Vienna (VIE)","Crash site — Phu Toei National Park (Thailand)","May 26, 1991","10 crew and 213 passengers on board","all 223 people on board died, with no survivors","The left engine's thrust reverser opened by itself in flight, at high speed and altitude","Shortly after taking off from Bangkok bound for Vienna, the Austrian carrier Lauda Air's Boeing 767 was climbing through 7,500 meters of altitude when the thrust reverser on engine 1 (left) opened by itself, without any command from the crew. The reversed airflow destroyed the lift of the left wing, and the airplane entered a dive that exceeded the aircraft's structural limits: the wings broke off while still in the air and the wreckage fell into an area of mountainous jungle in Suphan Buri province, Thailand. All 223 people on board died; there were no survivors.","The left engine's thrust reverser opened by itself during the climb, at almost 7,500 meters of altitude and about 400 knots — well beyond the conditions tested in the Boeing 767's original certification.","Nine minutes earlier, an EICAS warning had already indicated a possible reverser fault, but the crew treated it as a minor alert, with no immediate corrective action.","The loss of lift on the left wing was too sudden and violent for any recovery maneuver in that phase of flight.","The flight data recorder (FDR) was destroyed on impact, which made it harder to identify with complete certainty the electrical fault that deployed the reverser.","Aircraft Accident Investigation Committee (Thailand), with support from the NTSB (USA) and Austrian investigators","Nine minutes before the crash, an EICAS warning appeared on the panel signaling a possible fault in the left engine's reverser — the crew treated it as a minor alert.","The flight data recorder (FDR) was destroyed on impact; only the cockpit voice recorder (CVR) survived and could be used in the investigation.","In the final seconds recorded by the CVR, one of the pilots can be heard realizing that the reverser had deployed, shortly before the aircraft entered an uncontrolled dive.","Later simulator tests, requested by Lauda Air's founder himself, showed that a reverser deployment at that speed and altitude was unrecoverable in practically every attempt.","Thailand's investigation committee concluded that the crash was caused by the uncommanded in-flight deployment of the left engine's thrust reverser, which destroyed the wing's lift and made the aircraft uncontrollable. The exact electrical cause of the deployment could not be determined with complete certainty, but tests later conducted by Boeing pointed to possible faults in the valves of the reverser's hydraulic system.","The accident led Boeing to install a third locking system (\"sync lock\") on the thrust reversers of thousands of 737, 747, 757 and 767 airplanes around the world, along with FAA airworthiness directives requiring inspections and additional hydraulic isolation valves in these systems.","What aircraft model was Lauda Air flight 004?","Airbus A310","Boeing 767-300ER","McDonnell Douglas MD-11","Boeing 747-200","What caused the loss of control of the aircraft?","Uncommanded in-flight deployment of the thrust reverser","Fuel exhaustion","A severe storm","In what country did the crash happen?","Austria","Thailand","Hong Kong","India","Which airline operated the flight?","Austrian Airlines","Lauda Air","Thai Airways","Cathay Pacific","How many people died in the accident?","What was the flight's route up to the moment of the accident?","Vienna → Bangkok","Hong Kong → Bangkok → Vienna","Bangkok → Hong Kong","Singapore → Vienna","What happened minutes before the crash?","An EICAS warning about a possible reverser fault appeared on the panel","The crew declared a medical emergency","An engine caught fire","The cabin lost pressurization","Who pressured Boeing to publicly admit that the accident could not have been avoided by the crew?","ANAC","Niki Lauda, the airline's founder","The surviving pilot","ICAO","What did the investigation point to as the possible origin of the reverser failure?","Sabotage","Electrical faults in valves of the reverser's hydraulic system","A proven maintenance error","Birds striking the engine","What changed in the worldwide Boeing fleet after the accident?","Installation of a third locking system (sync lock) on the reversers","A permanent ban on the 767 model","A reduction in maximum cruise speed","Learjet 60 accident in Palm Beach","United States","Learjet 60","N722BD","Aurora Aviation (operating as \"Upper Jets\")","Austin–Bergstrom (Texas) → North Eleuthera (Bahamas)","Austin–Bergstrom (Texas)","North Eleuthera (Bahamas)","Crash site — near Greenacres, Palm Beach County (approximate)","November 1, 2026","2 crew and 7 passengers on board","all 9 people on board died; one more person on the ground was injured","Investigation ongoing — the aircraft appears to have broken up in flight before crashing in a residential area of Florida","Shortly after taking off from Austin, Texas, bound for the Bahamas, the Learjet 60 was climbing at about 10,600 meters (35,000 feet) when the crew reported turbulence, ice and altitude variations. Minutes later, the aircraft entered an extremely rapid descent and broke apart while still in the air, crashing into a residential area of Palm Beach County, near Greenacres/Cresthaven, Florida. All 9 people on board died; one person on the ground was injured. As of the publication of this file, the US National Transportation Safety Board (NTSB) has not yet released a preliminary or final report — which is why this case appears here as an ongoing investigation, with no official cause determined.","The crew reported turbulence, ice and altitude oscillations of about 210 meters (700 feet) shortly before the accident, flying near 10,600 meters (35,000 feet).","The aircraft had been cleared to climb to 11,300 meters (37,000 feet) shortly before entering an uncontrolled descent.","The NTSB confirmed that the left elevator separated from the aircraft before impact; it was found in three pieces a few kilometers from the crash site.","The pilots reported an \"overspeed\" condition (speed above the structural limit) in the final moments; there were storms in the area, but it is not yet known whether the weather played a part.","National Transportation Safety Board (NTSB, USA)","The aircraft was climbing at about 10,600 meters (35,000 feet) when the crew reported turbulence, ice and altitude oscillations of approximately 210 meters (700 feet).","In about one minute, the aircraft dropped from approximately 10,700 meters (35,250 feet) to 2,700 meters (8,750 feet), shortly before impact.","The debris field spread over about 800 meters, indicating that parts of the aircraft had already come off before it hit the ground.","The NTSB confirmed that the aircraft's left elevator separated in flight and was found in three pieces, up to a few kilometers from the main crash site.","The investigation (identified by the NTSB as ERA27MA026) is still ongoing. As of the publication of this file, the agency had not released a preliminary or final report — only press briefings in the days after the accident. What is known so far: the aircraft's left elevator separated in flight before impact, the pilots reported an overspeed condition, and there were storms in the area (with no confirmation of whether the weather contributed). NTSB investigations usually take 12 to 24 months until a final report with a determined probable cause is published — this file will be updated when that happens.","Since the root cause has not yet been established, there has been, so far, no regulatory or certification change resulting from this accident. This section will be updated as soon as the NTSB publishes its preliminary or final report.","Cessna Citation","Gulfstream G450","Embraer Phenom 300","On what date did the accident happen?","October 1, 2026","November 15, 2026","December 1, 2026","In which US state did the aircraft crash?","Texas","Florida","Georgia","South Carolina","Nassau, Bahamas","North Eleuthera, Bahamas","Havana, Cuba","San Juan, Puerto Rico","How many people were on board?","What did the NTSB confirm had separated from the aircraft before impact?","The right engine","The left elevator","The wingtip","What condition did the pilots report shortly before the crash?","Engine fire","An overspeed condition (excessive speed)","Cabin depressurization","Total loss of fuel","Which agency is investigating the accident?","NTSB (USA)","BEA (France)","AAIB (United Kingdom)","What is the status of the investigation as of this file?","An official
