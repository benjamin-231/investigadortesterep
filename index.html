<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investigador Aéreo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>

  :root{
    --bg-0:#ffffff;
    --bg-1:#eef3fb;
    --bg-2:#e1ebf9;
    --line:#c7d6ec;
    --line-soft:#dbe6f5;
    --text-0:#0a1830;
    --text-1:#43536c;
    --text-2:#8093ac;
    --blue:#0b3d91;
    --blue-deep:#04204f;
    --gold:#c9720a;
    --success:#1f7a52;
    --danger:#b23a24;
    --font-display: 'Space Grotesk', 'Arial Narrow', sans-serif;
    --font-body: 'Source Serif 4', Georgia, serif;
    /* era IBM Plex Mono (caía em Courier New, com cara de máquina de escrever);
       agora uma sem serifa limpa — o nome da variável ficou por compatibilidade */
    --font-mono: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    --window-clip: polygon(16% 0%, 84% 0%, 100% 16%, 100% 84%, 84% 100%, 16% 100%, 0% 84%, 0% 16%);
  }
  :root[data-theme="dark"]{
    --bg-0:#0b1420;
    --bg-1:#111d2e;
    --bg-2:#182739;
    --line:#2a3d54;
    --line-soft:#243447;
    --text-0:#eef3fb;
    --text-1:#b3c1d6;
    --text-2:#7c8ba3;
    --blue:#5b93f5;
    --blue-deep:#0f2a5c;
    --gold:#e0901f;
    --success:#3fb37f;
    --danger:#e0654a;
  }
  html{transition:background-color .2s ease;}
  body,.gate-card,.gate-wrap,.topnav,.fuselage-band,.window-frame,.window-glass{transition:background-color .2s ease, border-color .2s ease, background .2s ease;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-0);
    color:var(--text-0);
    font-family:var(--font-body);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--blue);color:var(--ink,var(--text-0));}

  :focus-visible{outline:2px solid var(--blue-deep); outline-offset:3px;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  /* ---------- layout shell ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px;width:100%;}

  /* ---------- nav ---------- */
  .topnav{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  :root[data-theme="dark"] .topnav{background:rgba(11,20,32,0.90);}
  .theme-toggle{
    font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);background:none;
    border:1px solid var(--line);padding:5px 9px;border-radius:3px;cursor:pointer;white-space:nowrap;
  }
  .theme-toggle:hover{border-color:var(--blue);color:var(--blue);}
  /* seletor de idioma PT · EN · ES */
  .lang-switch{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;}
  .lang-btn{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;color:var(--text-2);background:none;border:none;padding:5px 8px;cursor:pointer;}
  .lang-btn + .lang-btn{border-left:1px solid var(--line);}
  .lang-btn:hover{color:var(--blue);}
  .lang-btn.active{background:var(--blue);color:var(--bg-0);}
  /* tela inicial de escolha de idioma (antes do cadastro) */
  .lang-pick-title{font-family:var(--font-display);font-size:22px;line-height:1.3;margin:0 0 6px;color:var(--text-0);}
  .lang-pick-sub{font-family:var(--font-mono);font-size:11.5px;color:var(--text-2);margin:0 0 22px;line-height:1.6;}
  .lang-pick-list{display:flex;flex-direction:column;gap:10px;}
  .lang-pick-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;background:var(--bg-0);border:1px solid var(--line);border-radius:4px;cursor:pointer;color:var(--text-0);font-family:var(--font-display);font-size:17px;transition:border-color .15s, background .15s;}
  .lang-pick-btn:hover,.lang-pick-btn:focus-visible{border-color:var(--blue);background:var(--bg-1);outline:none;}
  .lang-pick-flag{font-size:26px;line-height:1;}
  .lang-pick-name{display:flex;flex-direction:column;}
  .lang-pick-name small{font-family:var(--font-mono);font-size:11px;color:var(--text-2);margin-top:2px;}
  .topnav-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 24px;max-width:1040px;margin:0 auto;}
  @media (max-width:640px){
    .topnav-inner{justify-content:center;text-align:center;}
    .nav-identity{width:100%;justify-content:center;flex-wrap:wrap;}
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;letter-spacing:0.06em;text-transform:uppercase;font-size:15px;cursor:pointer;background:none;border:none;color:var(--text-0);}
  .brand-mark{width:22px;height:14px;flex-shrink:0;color:var(--blue);}
  .navlinks{display:flex;align-items:center;gap:4px;}
  .navlinks button{
    background:none;border:none;color:var(--text-1);
    font-family:var(--font-mono);font-size:12px;letter-spacing:0.05em;text-transform:uppercase;
    padding:8px 12px;border-radius:3px;cursor:pointer;transition:color .15s, background .15s;
  }
  .navlinks button:hover{color:var(--text-0);background:var(--bg-2);}
  .navlinks button.active{color:var(--blue);}
  .progress-badge{
    font-family:var(--font-mono);font-size:11px;color:var(--text-2);
    border:1px solid var(--line);padding:5px 9px;border-radius:3px;letter-spacing:.03em;white-space:nowrap;
  }

  /* ---------- hero ---------- */
  .hero{position:relative;padding:64px 0 40px;border-bottom:1px solid var(--line);overflow:hidden;}
  .eyebrow{font-family:var(--font-mono);font-size:12px;color:var(--blue);letter-spacing:.12em;text-transform:uppercase;margin:0 0 14px;}
  .hero h1{
    font-family:var(--font-display);font-weight:900;text-transform:uppercase;
    font-size:clamp(32px,6vw,58px);line-height:1.02;letter-spacing:.01em;margin:0 0 18px;max-width:820px;
  }
  .hero h1 span{color:var(--blue);}
  .hero p.lede{font-size:17px;color:var(--text-1);max-width:560px;margin:0 0 30px;}
  .cta-row{display:flex;gap:14px;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--font-mono);font-size:13px;letter-spacing:.04em;text-transform:uppercase;
    padding:12px 20px;border-radius:3px;border:1px solid var(--line);cursor:pointer;
    background:var(--bg-1);color:var(--text-0);transition:transform .15s, border-color .15s;
  }
  .btn:hover{border-color:var(--text-2);transform:translateY(-1px);}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#ffffff;font-weight:700;}
  .btn.primary:hover{background:var(--blue-deep);border-color:var(--blue-deep);}

  .intake-card{position:relative;margin-top:40px;}
  .intake-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:var(--line);gap:1px;}
  @media (max-width:760px){.intake-grid{grid-template-columns:repeat(2,1fr);}}
  .intake-field{background:var(--bg-1);padding:16px 18px;}
  .intake-field .k{font-family:var(--font-mono);font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
  .intake-field .v{font-family:var(--font-mono);font-size:20px;color:var(--gold);}
  .intake-stamp{position:absolute;top:-14px;right:18px;background:var(--bg-0);}

  .section{padding:56px 0;border-bottom:1px solid var(--line);}
  .section h2{
    font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;
    font-size:22px;margin:0 0 8px;
  }
  .section .sub{color:var(--text-2);font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 28px;}

  .process-docket{position:relative;padding-left:28px;margin-top:8px;}
  .process-docket::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--line);}
  .docket-step{position:relative;padding-bottom:30px;}
  .docket-step:last-child{padding-bottom:0;}
  .docket-marker{position:absolute;left:-28px;top:3px;width:14px;height:14px;border-radius:50%;border:2px solid var(--blue);background:var(--bg-0);}
  .docket-official{display:inline-block;font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);padding:2px 7px;border-radius:2px;margin-bottom:9px;}
  .docket-step h3{font-family:var(--font-display);text-transform:uppercase;font-size:16px;margin:0 0 6px;letter-spacing:.01em;}
  .docket-step p{color:var(--text-1);font-size:14px;margin:0;max-width:540px;}

  /* ---------- fuselage strip (home) — vídeo de fundo em loop ---------- */
  .fuselage-band{
    position:relative;overflow:hidden;border:1px solid var(--line);border-radius:3px;
    margin:0 0 36px;min-height:300px;background:#0b1420;
  }
  .fuselage-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .fuselage-band::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg, rgba(4,20,45,.20) 0%, rgba(4,20,45,.55) 65%, rgba(4,20,45,.80) 100%);
  }
  .fuselage-caption{
    position:relative;z-index:2;text-align:center;padding:230px 20px 24px;
    font-family:var(--font-mono);font-size:12px;color:#f2f6fc;letter-spacing:.08em;text-transform:uppercase;
  }
  @media (max-width:640px){
    .fuselage-band{min-height:220px;}
    .fuselage-caption{padding-top:150px;}
  }

  /* ---------- catalog: janelas de avião ---------- */
  .catalog-group{margin-bottom:44px;}
  .catalog-group-head{display:flex;align-items:baseline;gap:12px;margin-bottom:20px;}
  .catalog-group-head h3{font-family:var(--font-display);text-transform:uppercase;font-size:18px;color:var(--text-0);margin:0;letter-spacing:.02em;}
  .catalog-group-head span{font-family:var(--font-mono);font-size:11px;color:var(--text-2);}
  .catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px 22px;align-items:stretch;}
  .filter-chips{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 24px;}
  .filter-chip{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:7px 14px;border:1px solid var(--line);background:var(--bg-0);color:var(--text-1);border-radius:999px;cursor:pointer;}
  .filter-chip:hover{border-color:var(--blue-deep);color:var(--blue-deep);}
  .filter-chip.active{background:var(--blue);border-color:var(--blue);color:var(--ink,var(--text-0));}

  /* ---------- catalog: cards modernos ---------- */
  .case-card{
    position:relative;display:flex;flex-direction:column;height:100%;
    background:var(--bg-0);border:1px solid var(--line);border-left:4px solid var(--line);
    border-radius:6px;padding:0;margin:0;text-align:left;color:inherit;font:inherit;
    cursor:pointer;overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    box-shadow:0 1px 3px rgba(10,24,48,.07);
  }
  .case-card.completo{border-left-color:var(--blue);}
  .case-card:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(10,24,48,.14);border-color:var(--blue-deep);}
  :root[data-theme="dark"] .case-card{box-shadow:0 1px 3px rgba(0,0,0,.3);}
  :root[data-theme="dark"] .case-card:hover{box-shadow:0 14px 28px rgba(0,0,0,.5);}

  .case-card-top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0;gap:8px;}
  .case-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .case-tag{font-family:var(--font-mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .case-tag.completo{background:rgba(11,61,145,.10);color:var(--blue);border:1px solid rgba(11,61,145,.28);}
  .case-tag.resumida{background:var(--bg-2);color:var(--text-2);border:1px solid var(--line);}
  .case-tag.done{background:rgba(31,122,82,.12);color:var(--success);border:1px solid rgba(31,122,82,.32);}
  .case-tag.open{background:rgba(201,114,10,.12);color:var(--gold);border:1px solid rgba(201,114,10,.32);}

  .case-card-body{padding:12px 18px 16px;display:flex;flex-direction:column;gap:8px;flex-grow:1;}
  .case-card-body h3{font-family:var(--font-display);font-weight:700;font-size:17px;margin:0;color:var(--text-0);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.28;}
  .case-card .case-meta{font-family:var(--font-mono);font-size:11px;color:var(--text-2);display:flex;gap:8px;flex-wrap:wrap;}
  .case-card .case-cause{font-size:13px;color:var(--text-1);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex-grow:1;}

  .case-card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-top:1px solid var(--line-soft);background:var(--bg-1);}
  .case-card .case-death{font-family:var(--font-mono);font-size:11px;color:var(--danger);}
  .case-card .case-cta{font-family:var(--font-mono);font-size:10px;color:var(--blue);white-space:nowrap;}

  .window-card{position:relative;border:none;background:none;padding:0;margin:0;cursor:pointer;text-align:left;color:inherit;font:inherit;transition:transform .18s ease;}
  .window-card:hover{transform:translateY(-5px);}
  .window-frame{
    background:linear-gradient(155deg,#eef2f6,#d9e1e8 55%,#c7d2da);
    border-radius:0;clip-path:var(--window-clip);
    padding:9px;position:relative;
    box-shadow:0 6px 16px rgba(22,40,63,.14), inset 0 0 0 1px rgba(255,255,255,.6);
    transition:box-shadow .18s ease;
  }
  :root[data-theme="dark"] .window-frame{background:linear-gradient(155deg,#233450,#182739 55%,#111d2e);box-shadow:0 6px 16px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08);}
  :root[data-theme="dark"] .window-card:hover .window-frame{box-shadow:0 12px 24px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.12);}
  .window-card:hover .window-frame{box-shadow:0 12px 24px rgba(22,40,63,.20), inset 0 0 0 1px rgba(255,255,255,.75);}
  .window-frame::before,.window-frame::after{content:'';position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(22,40,63,.28);box-shadow:0 0 0 1px rgba(255,255,255,.5) inset;}
  .window-frame::before{top:12px;left:18px;}
  .window-frame::after{top:12px;right:18px;}
  .window-glass{
    background:linear-gradient(180deg,#d9ecf9 0%, #f2f9ff 55%, #ffffff 100%);
    border-radius:0;clip-path:var(--window-clip);
    padding:24px 18px 18px;height:252px;
    display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden;
    box-shadow:inset 0 3px 14px rgba(22,40,63,.10);
  }
  :root[data-theme="dark"] .window-glass{background:linear-gradient(180deg,#1b2d45 0%, #14202f 55%, #0e1826 100%);box-shadow:inset 0 3px 14px rgba(0,0,0,.35);}
  .window-glass::before{content:'';position:absolute;top:-25%;left:8%;width:24%;height:150%;background:rgba(255,255,255,.5);transform:rotate(13deg);pointer-events:none;}
  :root[data-theme="dark"] .window-glass::before{background:rgba(255,255,255,.05);}
  .window-glass.foggy{background:linear-gradient(180deg,#e6eaee 0%, #f2f4f6 55%, #ffffff 100%);}
  :root[data-theme="dark"] .window-glass.foggy{background:linear-gradient(180deg,#202e3f 0%, #182535 55%, #111d2e 100%);}
  .window-glass.foggy::after{content:'';position:absolute;left:-10%;right:-10%;bottom:10%;height:46%;background:radial-gradient(ellipse at center, rgba(255,255,255,.85), transparent 70%);pointer-events:none;}
  :root[data-theme="dark"] .window-glass.foggy::after{background:radial-gradient(ellipse at center, rgba(255,255,255,.10), transparent 70%);}

  .top-row{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2;}
  .case-num{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);}
  .tag{font-family:var(--font-mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:2px;}
  .tag.completo{background:rgba(29,78,137,.10);color:var(--blue-deep);border:1px solid rgba(29,78,137,.30);}
  .tag.catalogo{background:var(--bg-2);color:var(--text-2);border:1px solid var(--line);}
  .window-glass h3{font-family:var(--font-display);text-transform:uppercase;font-size:16px;margin:0;letter-spacing:.01em;position:relative;z-index:2;color:var(--text-0);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.2;}
  .case-meta{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:2;}
  .case-cause{font-size:12.5px;color:var(--text-1);margin:0;position:relative;z-index:2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .case-death{font-family:var(--font-mono);font-size:11.5px;color:var(--danger);position:relative;z-index:2;margin-top:auto;}
  .investigated-check{position:absolute;top:2px;right:22px;font-family:var(--font-mono);font-size:8.5px;color:var(--success);z-index:3;background:rgba(255,255,255,.85);padding:2px 5px;border-radius:2px;}
  :root[data-theme="dark"] .investigated-check{background:rgba(11,20,32,.88);}
  .catalog-accordion{grid-column:1/-1;border:1px dashed var(--line);background:var(--bg-2);padding:16px 18px;font-size:14px;color:var(--text-1);margin-top:-10px;border-radius:6px;}


  /* ---------- case detail ---------- */
  .breadcrumb{margin-bottom:20px;}
  .breadcrumb-back{
    -webkit-appearance:none;appearance:none;cursor:pointer;padding:0;
    display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:44px;border-radius:999px;
    border:1.5px solid var(--line);background:var(--bg-0);color:var(--text-1);
    transition:border-color .15s ease, color .15s ease, background .15s ease, transform .15s ease;
  }
  .breadcrumb-back:hover{border-color:var(--blue-deep);color:var(--blue-deep);background:var(--bg-1);transform:translateX(-2px);}
  .breadcrumb-arrow{width:20px;height:20px;flex-shrink:0;}
  .dossier-head{border:1px solid var(--line);background:var(--bg-1);padding:26px 24px;margin-bottom:28px;position:relative;overflow:hidden;}
  .stamp{
    position:absolute;top:20px;right:20px;
    font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--blue);
    border:1.5px solid var(--blue);padding:5px 9px;transform:rotate(6deg);border-radius:2px;
    text-transform:uppercase;opacity:.85;
  }
  .stamp-open{border-color:var(--gold);color:var(--gold);}
  .dossier-head .case-num{font-size:13px;}
  .dossier-head h1{font-family:var(--font-display);text-transform:uppercase;font-size:clamp(24px,4vw,36px);margin:8px 0 6px;}
  .dossier-head .subline{font-family:var(--font-mono);font-size:12px;color:var(--text-2);}

  .field-grid{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--line);margin-bottom:28px;}
  @media (max-width:640px){.field-grid{grid-template-columns:1fr;}}
  .field{padding:14px 18px;border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);}
  .field:nth-child(2n){border-right:none;}
  .field .k{font-family:var(--font-mono);font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
  .field .v{font-size:14.5px;color:var(--text-0);}
  .field .v.death{color:var(--danger);font-family:var(--font-mono);}
  .jetphotos-link{display:inline-block;font-family:var(--font-mono);font-size:11px;color:var(--blue-deep);text-decoration:none;margin-left:8px;border-bottom:1px dotted var(--blue-deep);}
  .jetphotos-link:hover{border-bottom-style:solid;}

  .block-title{font-family:var(--font-mono);font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .block-title::before{content:'';width:16px;height:1px;background:var(--gold);}
  .narrative{font-size:16px;color:var(--text-0);margin-bottom:32px;}
  .factors{list-style:none;padding:0;margin:0 0 32px;}
  .factors li{padding:10px 0 10px 22px;border-bottom:1px solid var(--line-soft);position:relative;font-size:14.5px;color:var(--text-1);}
  .factors li::before{content:'▸';position:absolute;left:0;color:var(--blue-deep);}
  .source-line{font-family:var(--font-mono);font-size:11.5px;color:var(--text-2);margin-bottom:44px;padding-top:12px;border-top:1px solid var(--line);}

  /* ---------- investigator mode ---------- */
  .investigator{border:1px solid var(--blue-deep);background:linear-gradient(180deg, rgba(29,78,137,.05), transparent 60%);padding:24px;margin-bottom:20px;}
  .investigator-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .investigator-head h2{font-family:var(--font-display);text-transform:uppercase;font-size:18px;margin:0;}
  .ev-list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
  .ev-item{border:1px solid var(--line);background:var(--bg-1);padding:12px 14px;font-size:14px;display:flex;gap:12px;align-items:flex-start;}
  .ev-item .ev-tag{font-family:var(--font-mono);font-size:10px;color:var(--text-2);flex-shrink:0;padding-top:2px;}
  .ev-item.locked{color:var(--text-2);font-family:var(--font-mono);font-size:12px;border-style:dashed;}

  /* ---------- mapa de rotas (catálogo + ficha de caso) ---------- */
  .case-map-toggle-row{margin:0 0 28px;}
  .case-map-btn{width:100%;justify-content:center;padding:16px 20px;font-size:15px;letter-spacing:.02em;border-radius:8px;box-shadow:0 2px 10px rgba(11,61,145,.18);}
  .case-map-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(11,61,145,.26);}
  :root[data-theme="dark"] .case-map-btn{box-shadow:0 2px 10px rgba(0,0,0,.4);}
  :root[data-theme="dark"] .case-map-btn:hover{box-shadow:0 4px 14px rgba(0,0,0,.5);}
  .route-map-controls{margin-bottom:14px;}
  .route-map-select{font-family:var(--font-mono);font-size:13px;letter-spacing:.01em;padding:10px 14px;border:1px solid var(--line);background:var(--bg-0);color:var(--text-0);border-radius:6px;width:100%;max-width:520px;cursor:pointer;}
  .route-map-select:hover{border-color:var(--blue-deep);}
  .route-map-wrap{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg-1);margin-bottom:12px;}
  #route-map-canvas{display:block;width:100%;height:auto;aspect-ratio:960/480;}
  .route-map-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-family:var(--font-mono);font-size:12px;color:var(--text-2);background:rgba(0,0,0,0);pointer-events:none;}
  .route-map-caption{font-family:var(--font-mono);font-size:11px;color:var(--text-2);margin:0;line-height:1.5;}

  /* ---------- mapa-múndi com todos os casos (Catálogo) ---------- */
  .world-map-back{margin-bottom:14px;}
  .route-map-controls .world-map-back{margin-bottom:0;}
  .world-map-wrap{cursor:pointer;}
  /* barra de resumo ao clicar num ponto do mapa (estilo cartão: ícone, nome,
     resumo curto e botão "Ir ao caso" embaixo) */
  .world-map-bar{
    position:relative;margin:12px;box-sizing:border-box;
    background:var(--bg-0);border:1px solid var(--line);border-radius:16px;
    padding:16px 18px;box-shadow:0 6px 18px rgba(10,24,48,.10);cursor:default;
    animation:worldMapBarIn .18s ease-out;
  }
  .world-map-bar[hidden]{display:none;}
  :root[data-theme="dark"] .world-map-bar{box-shadow:0 8px 24px rgba(0,0,0,.5);}
  @keyframes worldMapBarIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .world-map-bar-main{display:flex;gap:14px;align-items:flex-start;padding-right:28px;}
  .world-map-bar-icon{
    flex:0 0 auto;width:52px;height:52px;border-radius:12px;background:var(--bg-1);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;
  }
  .world-map-bar-text{min-width:0;}
  .world-map-bar-title{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--text-0);line-height:1.25;}
  .world-map-bar-meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;color:var(--text-2);margin-top:3px;}
  .world-map-bar-sum{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--text-1);}
  .world-map-bar-go{display:flex;justify-content:center;margin:14px 0 0 auto;min-width:220px;}
  .world-map-bar-close{
    position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:999px;
    border:1px solid var(--line);background:none;color:var(--text-1);font-size:11px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .world-map-bar-close:hover{border-color:var(--gold);color:var(--gold);}
  @media (max-width:560px){
    .world-map-bar{margin:10px;}
    .world-map-bar-go{width:100%;min-width:0;}
  }
  #world-cases-map-canvas{display:block;width:100%;height:auto;aspect-ratio:960/480;}

  /* ---------- quadro de evidências (arrastar e conectar) ---------- */
  .board-hint{font-family:var(--font-mono);font-size:11px;color:var(--text-2);margin:0 0 12px;}
  .evidence-board{position:relative;background:var(--bg-1);border:1px solid var(--line);border-radius:6px;margin-bottom:18px;overflow:hidden;}
  .evidence-board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .board-card{position:absolute;width:min(260px,46%);background:var(--bg-0);border:1.5px solid var(--line);border-radius:6px;box-shadow:0 2px 8px rgba(10,24,48,.08);z-index:2;}
  :root[data-theme="dark"] .board-card{box-shadow:0 2px 8px rgba(0,0,0,.35);}
  .board-card.selected{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,114,10,.30);}
  .board-card.dragging{z-index:20;box-shadow:0 12px 26px rgba(10,24,48,.24);}
  :root[data-theme="dark"] .board-card.dragging{box-shadow:0 12px 26px rgba(0,0,0,.55);}
  .board-card.locked{opacity:.55;}
  .board-card-handle{
    display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line-soft);
    cursor:grab;font-family:var(--font-mono);font-size:10px;color:var(--text-2);
    text-transform:uppercase;letter-spacing:.04em;touch-action:none;user-select:none;
  }
  .board-card-handle:active{cursor:grabbing;}
  .board-card-text{font-size:12.5px;color:var(--text-1);margin:0;padding:9px 10px;}
  .board-card-text.muted{color:var(--text-2);font-style:italic;}
  .board-card.hyp-card{border-color:var(--gold);}
  .board-card.hyp-card .board-card-handle{border-bottom-color:rgba(201,114,10,.3);color:var(--gold);}
  .board-card textarea{
    width:100%;border:none;background:none;padding:9px 10px;min-height:76px;
    font-family:var(--font-body);font-size:13px;color:var(--text-0);resize:vertical;display:block;
  }
  .board-card textarea:focus{outline:none;background:var(--bg-1);}

  .reveal-btn{width:100%;}
  textarea.hypothesis{
    width:100%;min-height:80px;background:var(--bg-1);border:1px solid var(--line);color:var(--text-0);
    padding:12px;font-family:var(--font-body);font-size:14px;border-radius:2px;resize:vertical;margin-bottom:12px;
  }
  .official-cause{border:1px solid var(--success);background:rgba(47,125,92,.07);padding:18px;margin-top:16px;}
  .official-cause .k{font-family:var(--font-mono);font-size:10px;color:var(--success);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
  .radar-wrap{max-width:560px;margin:8px 0 28px;text-align:left;}
  .radar-chart{width:100%;height:auto;display:block;}
  .radar-caption{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);margin:10px 0 0;}
  .radar-open-note{max-width:560px;margin:8px 0 28px;padding:14px 16px;border:1px solid var(--gold);background:rgba(201,114,10,.06);border-radius:4px;font-size:13px;line-height:1.5;color:var(--text-1);text-align:left;}

  .factors-bars{display:flex;flex-direction:column;gap:14px;}
  .factor-bar-row{display:grid;grid-template-columns:104px 1fr 22px;align-items:center;gap:12px;}
  .factor-bar-label{font-family:var(--font-mono);font-size:12px;color:var(--text-2);}
  .factor-bar-track{height:10px;border-radius:999px;background:var(--bg-2);overflow:hidden;}
  .factor-bar-fill{height:100%;border-radius:999px;background:var(--line);}
  .factor-bar-value{font-family:var(--font-mono);font-size:12px;color:var(--text-2);text-align:right;}
  .factor-bar-row.is-max .factor-bar-label{color:var(--text-0);font-weight:600;}
  .factor-bar-row.is-max .factor-bar-value{color:var(--blue-deep);font-weight:700;}
  .legacy-box{border:1px solid var(--gold);background:rgba(201,114,10,.06);padding:18px;margin-top:16px;}
  .legacy-box .k{font-family:var(--font-mono);font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
  .legacy-box p{color:var(--text-1);font-size:14px;}
  .notebook-box{border:1px dashed var(--line);padding:20px;margin-bottom:20px;}
  .notebook-note{font-size:12.5px;color:var(--text-2);margin:0 0 10px;}

  /* ---------- certificado de investigador ---------- */
  .cert-wrap{max-width:640px;margin:0 auto;}
  .cert-card{border:1px solid var(--line);background:var(--bg-0);padding:36px 32px;position:relative;overflow:hidden;text-align:center;}
  .cert-card.cert-locked{text-align:left;}
  .cert-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin:0 0 14px;}
  .cert-title{font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:26px;margin:0 0 18px;}
  .cert-sub{font-size:14px;color:var(--text-1);margin:0 0 6px;}
  .cert-name{font-family:var(--font-mono);font-size:16px;color:var(--gold);margin:0 0 24px;word-break:break-all;}
  .cert-footnote{font-size:11.5px;color:var(--text-2);margin:20px 0;}
  .cert-progress-bar{height:8px;background:var(--bg-2);border-radius:999px;overflow:hidden;margin-top:10px;}
  .cert-progress-fill{height:100%;background:var(--blue-deep);}
  .cert-pending-list{list-style:none;padding:0;margin:10px 0 0;}
  .cert-pending-list li{margin-bottom:8px;}
  .cert-pending-link{background:none;border:1px solid var(--line);padding:8px 12px;border-radius:2px;cursor:pointer;color:var(--text-0);font-family:var(--font-body);font-size:13.5px;}
  .cert-pending-link:hover{border-color:var(--blue-deep);color:var(--blue-deep);}
  .cert-disclaimer{display:flex;align-items:flex-start;gap:12px;max-width:640px;margin:20px auto 0;padding:16px 18px;background:#fdecea;border:1px solid #f3c6bd;color:#8a3324;text-align:left;font-size:13.5px;line-height:1.55;}
  .cert-disclaimer-icon{flex-shrink:0;font-size:18px;line-height:1.2;}
  .cert-disclaimer p{margin:0;}
  .cert-disclaimer strong{font-weight:700;}
  :root[data-theme="dark"] .cert-disclaimer{background:#3a1f1a;border-color:#5a2e26;color:#f0a08f;}
  .your-hyp{font-family:var(--font-mono);font-size:12px;color:var(--text-2);margin-bottom:14px;padding:10px 12px;border-left:2px solid var(--line);}

  /* ---------- about ---------- */
  .about-list{list-style:none;padding:0;margin:0;}
  .about-list li{padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:14.5px;color:var(--text-1);}
  .about-list b{color:var(--text-0);}
  .reset-link{font-family:var(--font-mono);font-size:12px;color:var(--text-2);background:none;border:1px solid var(--line);padding:8px 14px;cursor:pointer;margin-top:24px;}
  .reset-link:hover{border-color:var(--danger);color:var(--danger);}

  /* ---------- identidade (e-mail, sem senha) ---------- */
  .nav-identity{display:flex;align-items:center;gap:10px;}
  .logout-link{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);background:none;border:1px solid var(--line);padding:5px 9px;border-radius:3px;cursor:pointer;white-space:nowrap;}
  .logout-link:hover{border-color:var(--blue-deep);color:var(--blue-deep);}
  .gate-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg-1);}
  .gate-card{max-width:440px;width:100%;background:var(--bg-0);border:1px solid var(--line);border-top:4px solid var(--blue-deep);border-radius:2px;padding:32px 32px 30px;box-shadow:0 12px 30px rgba(4,32,79,.10);}
  .gate-card .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--text-0);}
  .gate-card h1{font-family:var(--font-display);text-transform:uppercase;font-size:22px;margin:0 0 10px;color:var(--text-0);font-weight:700;}
  .gate-card > p{font-size:14px;color:var(--text-1);margin:0 0 20px;}
  .gate-card input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:2px;font-size:14px;margin-bottom:14px;font-family:var(--font-body);color:var(--text-0);background:var(--bg-0);}
  .gate-card input::placeholder{color:var(--text-2);opacity:1;}
  .gate-card input:focus{border-color:var(--blue-deep);}
  .gate-note{font-size:12px !important;color:var(--text-2) !important;line-height:1.5;margin-top:16px !important;}
  .gate-error{color:var(--danger);font-size:12.5px;font-family:var(--font-mono);min-height:16px;margin:-4px 0 12px;}
  .gate-success{color:var(--success);font-size:12.5px;font-family:var(--font-mono);margin:-4px 0 12px;}
  .storage-warning{background:#fdecea;color:#8a3324;border-bottom:1px solid #f3c6bd;font-family:var(--font-mono);font-size:12px;text-align:center;padding:9px 16px;}
  .storage-warning.info{background:var(--bg-2);color:var(--blue-deep);border-bottom:1px solid var(--line);}
  :root[data-theme="dark"] .storage-warning{background:#3a1f1a;color:#f0a08f;border-bottom:1px solid #5a2e26;}

  .gate-tabs{display:flex;gap:20px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .gate-tab{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:0 0 10px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-2);cursor:pointer;}
  .gate-tab.active{color:var(--blue-deep);border-bottom-color:var(--blue-deep);}
  .gate-switch{font-size:12.5px;color:var(--text-2);margin-top:16px;text-align:center;}
  .gate-switch button{background:none;border:none;color:var(--blue-deep);text-decoration:underline;cursor:pointer;font:inherit;font-size:inherit;padding:0;}

  /* ---------- quiz ---------- */
  .quiz-progress{font-family:var(--font-mono);font-size:11px;color:var(--text-2);margin-bottom:10px;}
  .quiz-question{font-size:16px;color:var(--text-0);margin:0 0 16px;font-weight:700;}
  .quiz-opts{display:flex;flex-direction:column;gap:10px;}
  .quiz-opt{text-align:left;padding:13px 16px;border:1.5px solid var(--line);background:var(--bg-0);border-radius:2px;cursor:pointer;font-size:14px;color:var(--text-0);font-family:var(--font-body);transition:border-color .15s, background .15s;}
  .quiz-opt:hover{border-color:var(--blue-deep);background:var(--bg-1);}
  .quiz-score{font-family:var(--font-display);text-transform:uppercase;font-size:21px;color:var(--blue-deep);margin-bottom:18px;}
  .quiz-review{display:flex;flex-direction:column;}
  .quiz-review-item{border-bottom:1px solid var(--line-soft);padding:12px 0;}
  .qr-q{font-size:13.5px;color:var(--text-0);margin:0 0 4px;font-weight:700;}
  .qr-a{font-size:13px;margin:0;font-family:var(--font-mono);}
  .quiz-review-item.correct .qr-a{color:var(--success);}
  .quiz-review-item.wrong .qr-a{color:var(--danger);}
  .qr-correct{font-size:12.5px;color:var(--text-2);margin:3px 0 0;}

  footer{padding:28px 0;text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--text-2);}

  .loading-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-mono);color:var(--text-2);font-size:13px;letter-spacing:.05em;}
/* ============================================================
   Camada visual moderna — tipografia grande, blocos cheios,
   vídeo em loop e cards de alto contraste.
   Sobrepõe base.css sem alterar nenhum recurso do app.
   ============================================================ */
:root{
  --bg-0:#ffffff;
  --bg-1:#f4f4f1;
  --bg-2:#eaeae5;
  --line:#dcdcd4;
  --line-soft:#e8e8e2;
  --text-0:#0d0d12;
  --text-1:#4c4c56;
  --text-2:#8b8b95;
  --blue:#AFDCF7;
  --blue-deep:#1D6FA8;
  --gold:#0f6be0;
  --success:#0f8a5f;
  --danger:#d63a1e;
  --font-display:'Archivo',system-ui,sans-serif;
  --ink:#0d0d12;
}
:root[data-theme="dark"]{
  --bg-0:#0b0b0f;
  --bg-1:#14141a;
  --bg-2:#1d1d25;
  --line:#2b2b35;
  --line-soft:#232330;
  --text-0:#f5f5f2;
  --text-1:#b6b6c0;
  --text-2:#82828e;
  --blue:#8FCBF2;
  --blue-deep:#2A82C2;
  --gold:#4d9bff;
  --ink:#0b0b0f;
}

body{font-size:16.5px;}
.wrap{max-width:1240px;padding:0 40px;}
@media (max-width:720px){.wrap{padding:0 20px;}}

/* ---------- nav ---------- */
.topnav{background:var(--ink);border-bottom:none;backdrop-filter:none;}
:root[data-theme="dark"] .topnav{background:#000;}
.topnav-inner{max-width:1240px;padding:18px 40px;}
@media (max-width:720px){.topnav-inner{padding:16px 20px;}}
.brand{color:#fff;font-family:var(--font-display);font-weight:800;font-size:16px;letter-spacing:.02em;}
.brand-mark{color:var(--blue);width:26px;height:16px;}
.navlinks button{color:rgba(255,255,255,.72);font-size:12.5px;border-radius:999px;padding:9px 16px;}
.navlinks button:hover{color:#fff;background:rgba(255,255,255,.10);}
.navlinks button.active{color:var(--ink);background:#fff;}
.progress-badge{border-color:rgba(255,255,255,.22);color:rgba(255,255,255,.72);border-radius:999px;padding:6px 12px;}
.theme-toggle,.logout-link{border-color:rgba(255,255,255,.22);color:rgba(255,255,255,.72);border-radius:999px;}
.theme-toggle:hover,.logout-link:hover{border-color:var(--blue);color:var(--ink);background:var(--blue);}

/* ---------- hero com vídeo ---------- */
.hero{
  background:var(--ink);color:#fff;border-bottom:none;
  padding:132px 0 96px;isolation:isolate;
}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;}
.hero-veil{
  position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(100deg,rgba(8,8,12,.94) 0%,rgba(8,8,12,.80) 45%,rgba(8,8,12,.34) 100%);
}
.hero .eyebrow{color:var(--blue);font-size:12.5px;letter-spacing:.18em;}
.hero h1{
  font-family:var(--font-display);font-weight:800;letter-spacing:-.02em;
  font-size:clamp(46px,9vw,116px);line-height:.92;max-width:15ch;margin-bottom:26px;
}
.hero h1 span{color:var(--blue);}
.hero p.lede{color:rgba(255,255,255,.78);font-size:19px;max-width:52ch;}
.hero .cta-row{margin-top:6px;}

.btn{
  border-radius:999px;padding:15px 26px;font-size:12.5px;letter-spacing:.08em;font-weight:600;
  background:transparent;border:1.5px solid rgba(255,255,255,.35);color:#fff;
}
.btn:hover{background:rgba(255,255,255,.12);border-color:#fff;transform:none;}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--ink);}
.btn.primary:hover{background:#fff;border-color:#fff;color:var(--ink);}
.section .btn,.investigator .btn,.cert-card .btn,.gate-card .btn{border-color:var(--line);color:var(--text-0);}
.section .btn:hover,.investigator .btn:hover{background:var(--bg-2);border-color:var(--text-2);}
.section .btn.primary,.investigator .btn.primary,.cert-card .btn.primary,.gate-card .btn.primary{background:var(--blue);border-color:var(--blue);color:var(--ink);}
.section .btn.primary:hover,.investigator .btn.primary:hover,.gate-card .btn.primary:hover{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff;}

/* números do hero */
.intake-card{margin-top:64px;}
.intake-grid{border:none;background:transparent;gap:0;border-top:1px solid rgba(255,255,255,.18);}
.intake-field{background:transparent;border-right:1px solid rgba(255,255,255,.18);padding:22px 24px 6px 0;}
.intake-field:last-child{border-right:none;}
.intake-field .k{color:rgba(255,255,255,.55);font-size:10.5px;}
.intake-field .v{color:#fff;font-family:var(--font-display);font-weight:700;font-size:38px;letter-spacing:-.02em;}
.intake-stamp{background:var(--ink);color:var(--blue);border-color:var(--blue);}

/* ---------- faixas de vídeo ---------- */
.fuselage-band{border:none;border-radius:20px;min-height:360px;margin:0 0 44px;}
.fuselage-band.strip{min-height:260px;margin:8px 0 40px;}
.fuselage-band.fuselage-frosted{
  background:linear-gradient(160deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
  -webkit-backdrop-filter:blur(14px) saturate(130%);
  backdrop-filter:blur(14px) saturate(130%);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 18px 40px rgba(0,0,0,.14);
}
.fuselage-band.fuselage-frosted::after{
  background:linear-gradient(180deg, rgba(255,255,255,.01) 0%, rgba(8,8,12,.05) 60%, rgba(8,8,12,.15) 100%);
}
.fuselage-caption{
  font-family:var(--font-display);font-weight:700;text-transform:none;letter-spacing:-.01em;
  font-size:clamp(20px,3vw,34px);text-align:left;padding:0 34px 30px;
  position:absolute;bottom:0;left:0;right:0;max-width:22ch;line-height:1.12;
}
.fuselage-band.strip .fuselage-caption{font-size:clamp(18px,2.4vw,26px);}

/* ---------- seções ---------- */
.section{padding:96px 0;border-bottom:1px solid var(--line);}
.section h2{
  font-family:var(--font-display);font-weight:800;text-transform:none;letter-spacing:-.025em;
  font-size:clamp(30px,4.4vw,54px);line-height:1.02;margin-bottom:12px;max-width:22ch;
}
.section .sub{font-size:12.5px;letter-spacing:.1em;margin-bottom:44px;}
.docket-step h3{font-family:var(--font-display);text-transform:none;letter-spacing:-.01em;font-size:22px;}
.docket-step p{font-size:16px;}
.docket-marker{border-color:var(--blue);background:var(--bg-0);}
.docket-official{color:var(--gold);border-color:var(--gold);border-radius:999px;}

/* ---------- catálogo ---------- */
.catalog-group-head h3{font-family:var(--font-display);text-transform:none;letter-spacing:-.02em;font-size:26px;}
.catalog-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;}
.filter-chip{border-radius:999px;padding:9px 18px;font-size:11.5px;}
.case-card{
  border-radius:18px;border-left-width:1px;background:var(--bg-1);
  box-shadow:none;border-color:transparent;
}
.case-card.completo{border-left-color:transparent;}
.case-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue);
  opacity:0;transition:opacity .18s ease;
}
.case-card.completo::before{opacity:1;}
.case-card:hover{transform:translateY(-6px);border-color:transparent;box-shadow:0 22px 44px rgba(13,13,18,.14);}
:root[data-theme="dark"] .case-card:hover{box-shadow:0 22px 44px rgba(0,0,0,.6);}
.case-card-top{padding:20px 22px 0;}
.case-card-body{padding:14px 22px 20px;}
.case-card-body h3{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1.14;}
.case-card .case-cause{font-size:14.5px;}
.case-card-foot{background:transparent;border-top:1px solid var(--line);padding:14px 22px;}
.case-tag.completo{background:var(--blue);border-color:var(--blue);color:var(--ink);}
.case-card .case-cta{color:var(--blue-deep);font-weight:600;}
.catalog-accordion{border-radius:16px;border-style:solid;background:var(--bg-1);}

/* ---------- dossiê ---------- */
.dossier-head{
  border:none;border-radius:22px;padding:200px 34px 34px;background:var(--ink);color:#fff;margin-bottom:36px;
}
.dossier-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
.dossier-veil{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,8,12,.35),rgba(8,8,12,.92));}
.dossier-head > *{position:relative;z-index:2;}
/* a regra acima também pegava o vídeo e o véu (mesma especificidade, vem depois),
   tirando o vídeo do fundo e jogando ele no meio do conteúdo — aqui eles voltam
   a ser camada de fundo */
.dossier-head > .dossier-video{position:absolute;inset:0;z-index:0;}
.dossier-head > .dossier-veil{position:absolute;inset:0;z-index:1;}
.dossier-head .case-num{color:rgba(255,255,255,.66);}
.dossier-head h1{
  font-family:var(--font-display);font-weight:800;text-transform:none;letter-spacing:-.03em;
  font-size:clamp(34px,6vw,74px);line-height:.96;color:#fff;
}
.dossier-head .subline{color:rgba(255,255,255,.74);font-size:13.5px;}
.dossier-head .stamp{
  color:#fff;border-color:rgba(255,255,255,.5);
  /* .dossier-head > *{position:relative} acima existe só pra ficar acima do vídeo/veil,
     mas também reescrevia o position:absolute do selo (base.css), fazendo ele ocupar
     a largura toda da caixa em vez de ficar como uma etiqueta pequena no canto.
     Aqui reafirmamos absolute (e tiramos a rotação, a pedido) só para este selo. */
  position:absolute;top:20px;right:20px;left:auto;bottom:auto;
  width:auto;transform:none;
}
.field-grid{border:none;border-top:1px solid var(--line);border-radius:0;}
.field{border-right:none;padding:16px 20px 16px 0;}
.narrative{font-size:19px;line-height:1.62;max-width:62ch;}
.block-title{color:var(--gold);letter-spacing:.14em;}
.factors li{font-size:15.5px;}
.investigator{border:1px solid var(--line);border-radius:22px;background:var(--bg-1);padding:30px;}
.investigator-head h2{font-family:var(--font-display);text-transform:none;letter-spacing:-.02em;font-size:24px;}
.evidence-board{border-radius:18px;background:var(--bg-2);border-color:transparent;}
.board-card{border-radius:14px;border-width:1px;}
.notebook-box{border-radius:22px;border-style:solid;padding:26px;}
textarea.hypothesis,.board-card textarea{border-radius:12px;}
.quiz-opt{border-radius:999px;border-width:1px;padding:14px 20px;}
.quiz-score{font-family:var(--font-display);text-transform:none;letter-spacing:-.02em;font-size:30px;}
.official-cause,.legacy-box,.radar-open-note{border-radius:18px;}
.radar-wrap{margin-top:24px;}
.factor-bar-row.is-max .factor-bar-fill{background:var(--blue-deep);}

/* ---------- certificado ---------- */
.cert-wrap{max-width:760px;}
.cert-card{border:none;border-radius:24px;background:var(--bg-1);padding:52px 44px;}
.cert-title{font-family:var(--font-display);text-transform:none;letter-spacing:-.03em;font-size:clamp(30px,5vw,52px);line-height:1;}
.cert-name{font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--blue-deep);}
.cert-progress-bar{height:10px;}
.cert-pending-link{border-radius:999px;}

/* ---------- acesso ---------- */
.gate-wrap{position:relative;background:var(--ink);overflow:hidden;}
.gate-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
.gate-veil{position:absolute;inset:0;z-index:1;background:linear-gradient(160deg,rgba(8,8,12,.92),rgba(8,8,12,.72));}
.gate-card{
  position:relative;z-index:2;border:none;border-top:none;border-radius:22px;
  padding:38px 36px 34px;box-shadow:0 34px 80px rgba(0,0,0,.45);max-width:470px;
}
.gate-card h1{font-family:var(--font-display);text-transform:none;letter-spacing:-.025em;font-size:32px;line-height:1.04;}
.gate-card input{border-radius:12px;border-width:1px;padding:15px 16px;}
.gate-tab{letter-spacing:.08em;}
.storage-warning{font-size:12px;}

footer{padding:56px 0;background:var(--ink);color:rgba(255,255,255,.55);font-size:11.5px;letter-spacing:.06em;}
a:hover{color:var(--blue-deep);}

/* ---------- certificado (refino) ---------- */
.cert-wrap{max-width:820px;}
.cert-card{overflow:hidden;padding:0;}
.cert-issued{background:var(--bg-1);text-align:left;}
.cert-top{background:var(--ink);color:#fff;padding:40px 44px 44px;position:relative;}
.cert-top-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.cert-top .cert-eyebrow{margin:0;color:rgba(255,255,255,.6);letter-spacing:.16em;}
.cert-cred{font-family:var(--font-mono);font-size:11.5px;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px;letter-spacing:.06em;}
.cert-top .cert-title{color:#fff;margin:26px 0 0;font-size:clamp(32px,5.4vw,60px);}
.cert-seal{
  position:absolute;right:44px;bottom:-22px;background:var(--blue);color:var(--ink);
  font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:12px 18px;border-radius:999px;box-shadow:0 12px 28px rgba(29,111,168,.35);
}
@media (max-width:640px){.cert-seal{right:20px;}.cert-top,.cert-issued .cert-sub,.cert-issued .cert-name,.cert-issued .field-grid,.cert-issued .cert-footnote,.cert-issued .btn{padding-left:22px;padding-right:22px;}}
.cert-perf{height:0;border-top:2px dashed var(--line);margin:0;}
.cert-issued .cert-sub{padding:32px 44px 0;margin:0;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);}
.cert-issued .cert-name{padding:8px 44px 0;margin:0 0 28px;font-size:clamp(22px,3.4vw,34px);letter-spacing:-.02em;word-break:break-word;}
.cert-issued .field-grid{margin:0 44px 8px;border-top:1px solid var(--line);}
.cert-issued .field{padding:18px 20px 18px 0;}
.cert-issued .cert-footnote{padding:0 44px;margin:12px 0 24px;max-width:62ch;}
.cert-issued .btn{margin:0 44px 44px;}
.cert-issued .stamp{display:none;}

.cert-locked{padding:44px 40px;text-align:left;}
.cert-locked .cert-eyebrow{color:var(--blue-deep);}
.cert-locked .cert-title{margin-bottom:30px;}
.cert-meter{display:flex;align-items:center;gap:26px;flex-wrap:wrap;padding-bottom:30px;border-bottom:1px solid var(--line);}
.cert-meter-num{font-family:var(--font-display);font-weight:800;font-size:clamp(48px,8vw,86px);line-height:.9;letter-spacing:-.04em;color:var(--blue-deep);}
.cert-meter-num span{color:var(--text-2);font-size:.42em;letter-spacing:0;}
.cert-meter-body{flex:1 1 240px;min-width:220px;}
.cert-progress-bar{background:var(--bg-2);}
.cert-pending-title{margin-top:28px !important;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);}
.cert-pending-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.cert-pending-list li{margin:0;}
.cert-pending-link{background:var(--bg-0);border-color:var(--line);padding:10px 16px;font-size:13.5px;}
.cert-pending-link:hover{background:var(--blue);border-color:var(--blue);color:var(--ink);}

.cert-disclaimer{max-width:820px;border-radius:16px;padding:18px 24px;font-size:14px;box-shadow:0 14px 30px rgba(0,0,0,.08);}
.cert-disclaimer-icon{font-size:20px;}

/* ---------- modo treinamento corporativo (rascunho de conceito) ---------- */
.training-block{border:1px dashed var(--gold);border-radius:22px;background:var(--bg-1);padding:30px;margin-bottom:32px;}
.training-block-empty{padding:24px 30px;}
.training-draft-tag{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:3px 9px;margin-left:10px;vertical-align:middle;
}
.training-intro{font-size:14px;color:var(--text-1);margin:0 0 22px;}
.training-empty-note{font-size:14px;color:var(--text-2);margin:8px 0 0;}

.role-tabs{display:flex;gap:10px;margin:0 0 22px;flex-wrap:wrap;}
.role-tab{
  border:1.5px solid var(--line);background:var(--bg-0);color:var(--text-1);
  border-radius:999px;padding:11px 20px;font-family:var(--font-mono);font-size:12px;
  letter-spacing:.06em;cursor:pointer;
}
.role-tab.active{background:var(--blue);border-color:var(--blue);color:var(--ink);}
.role-tab:hover:not(.active){border-color:var(--blue-deep);color:var(--blue-deep);}

.role-panel{display:none;}
.role-panel.active{display:block;}

.role-block{border:1px solid var(--line);border-radius:16px;background:var(--bg-0);padding:22px 24px;margin-bottom:18px;}
.role-block h3{font-family:var(--font-display);font-size:17px;letter-spacing:-.01em;margin-bottom:12px;}
.role-block ul{margin:0;padding-left:20px;}
.role-block li{font-size:14.5px;line-height:1.6;color:var(--text-1);margin-bottom:8px;}

.reflect-box{
  border-left:3px solid var(--gold);background:var(--bg-2);border-radius:0 12px 12px 0;
  padding:14px 16px;font-size:14px;color:var(--text-0);margin-bottom:18px;
}
.reflect-box .label{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;display:block;margin-bottom:6px;}

.procedure-link{border:1px dashed var(--line);border-radius:12px;padding:14px 16px;background:var(--bg-0);}
.procedure-link .label{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--text-2);text-transform:uppercase;display:block;margin-bottom:10px;}
.procedure-link select, .procedure-link input{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13.5px;
  background:var(--bg-0);color:var(--text-0);margin-bottom:8px;font-family:var(--font-body);
}
.procedure-link .hint{font-size:12px;color:var(--text-2);margin:0;}


/* ---------- assistente de IA (botão flutuante + painel) ---------- */
.ai-root[hidden]{display:none;}
.ai-fab{
  position:fixed;right:20px;bottom:20px;z-index:60;display:flex;align-items:center;gap:8px;
  padding:12px 18px;border-radius:999px;border:1px solid var(--line);cursor:pointer;
  background:var(--blue);color:var(--ink, #0a1830);font-family:var(--font-mono);font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;box-shadow:0 8px 24px rgba(10,24,48,.22);
}
.ai-fab:hover{filter:brightness(1.05);}
.ai-fab.is-open{opacity:.0;pointer-events:none;}
.ai-fab-icon{font-size:15px;}
.ai-panel{
  position:fixed;right:20px;bottom:20px;z-index:61;width:min(400px, calc(100vw - 32px));
  height:min(580px, calc(100vh - 40px));display:flex;flex-direction:column;
  background:var(--bg-0);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 14px 40px rgba(10,24,48,.28);overflow:hidden;
}
.ai-panel[hidden]{display:none;}
:root[data-theme="dark"] .ai-panel{box-shadow:0 14px 40px rgba(0,0,0,.6);}
.ai-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);}
.ai-title{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--text-0);}
.ai-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);margin-top:3px;line-height:1.45;}
.ai-close{flex:0 0 auto;width:28px;height:28px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--text-1);cursor:pointer;font-size:11px;}
.ai-close:hover{border-color:var(--blue);color:var(--blue);}
.ai-context{font-family:var(--font-mono);font-size:11px;color:var(--text-2);padding:8px 16px;background:var(--bg-1);border-bottom:1px solid var(--line);}
.ai-context b{color:var(--text-0);font-weight:600;}
.ai-log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.ai-msg{max-width:88%;padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.5;color:var(--text-0);}
.ai-msg p{margin:0;}
.ai-msg p + p{margin-top:8px;}
.ai-user{align-self:flex-end;background:var(--blue);color:var(--ink, #0a1830);border-bottom-right-radius:4px;}
.ai-bot{align-self:flex-start;background:var(--bg-1);border:1px solid var(--line);border-bottom-left-radius:4px;}
.ai-err{border-color:var(--danger);color:var(--text-1);}
.ai-typing{color:var(--text-2);font-family:var(--font-mono);font-size:12px;}
.ai-form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-end;}
.ai-form textarea{flex:1;resize:none;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg-0);color:var(--text-0);}
.ai-form textarea:focus{outline:none;border-color:var(--blue);}
.ai-send{padding:10px 14px;font-size:12px;}
.ai-send:disabled{opacity:.5;cursor:default;}
.ai-privacy{margin:0;padding:0 14px 10px;font-family:var(--font-mono);font-size:10px;color:var(--text-2);line-height:1.4;}
@media (max-width:560px){
  .ai-fab{right:12px;bottom:12px;}
  .ai-panel{right:8px;bottom:8px;width:calc(100vw - 16px);height:calc(100vh - 16px);}
}
@media print{ .ai-root{display:none !important;} }

/* ---------- glossário (aba própria) ---------- */
.gloss-search-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:18px 0 22px;}
.gloss-search{flex:1;min-width:220px;max-width:460px;font:inherit;font-size:15px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg-0);color:var(--text-0);}
.gloss-search:focus{outline:none;border-color:var(--blue);}
.gloss-count{font-family:var(--font-mono);font-size:11px;color:var(--text-2);letter-spacing:.04em;}
.gloss-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.gloss-card{background:var(--bg-0);border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;}
.gloss-card[hidden]{display:none;}
.gloss-card-term{font-family:var(--font-display);font-size:17px;margin:0;color:var(--text-0);}
.gloss-card-def{margin:0;font-size:14.5px;line-height:1.55;color:var(--text-1);}
.gloss-card-src{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);line-height:1.5;}
.gloss-card-src a{color:var(--blue-deep, var(--blue));}
:root[data-theme="dark"] .gloss-card-src a{color:var(--blue);}
.gloss-card-cases{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px;}
.gloss-card-cases-label{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;margin-right:2px;}
.gloss-case-chip{font-family:var(--font-mono);font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg-1);color:var(--text-1);cursor:pointer;}
.gloss-case-chip:hover{border-color:var(--blue);color:var(--text-0);}
.gloss-empty{font-family:var(--font-mono);font-size:12px;color:var(--text-2);}

/* menu com 5 abas: no celular as abas quebram em linhas em vez de vazar da tela */
@media (max-width:640px){
  .navlinks{flex-wrap:wrap;justify-content:center;gap:2px;}
  .navlinks button{padding:7px 10px;font-size:11px;}
}
.gloss-case-chip{max-width:100%;text-align:left;white-space:normal;}

/* ---------- XP, títulos e desafios ---------- */
.xp-chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 8px;cursor:pointer;white-space:nowrap;}
.xp-chip:hover{border-color:var(--blue);color:var(--blue);}
.xp-chip-icon{font-size:13px;line-height:1;}
.xp-chip-bar{display:inline-block;width:40px;height:4px;border-radius:99px;background:rgba(127,127,127,.3);overflow:hidden;}
.xp-chip-bar i{display:block;height:100%;background:var(--blue);}
.xp-summary{display:flex;gap:16px;align-items:center;background:var(--bg-1);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:20px 0 14px;max-width:640px;}
.xp-summary-icon{font-size:38px;line-height:1;}
.xp-summary-body{flex:1;min-width:0;}
.xp-summary-label{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);}
.xp-summary-title{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text-0);margin:2px 0 8px;}
.xp-summary-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;}
.xp-summary-bar i{display:block;height:100%;background:var(--blue);border-radius:99px;}
.xp-summary-meta{font-family:var(--font-mono);font-size:11px;color:var(--text-2);margin-top:6px;}
.ch-hint{font-family:var(--font-mono);font-size:11px;color:var(--text-2);margin-bottom:20px;line-height:1.6;}
.ch-link{background:none;border:none;padding:0;font:inherit;color:var(--blue-deep, var(--blue));cursor:pointer;text-decoration:underline;}
:root[data-theme="dark"] .ch-link{color:var(--blue);}
.ch-tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.ch-track{background:var(--bg-0);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;}
.ch-track-head{display:flex;gap:12px;align-items:flex-start;}
.ch-track-icon{font-size:26px;line-height:1;}

window.__IAA_STR = {"pt":["TAM Voo 3054","Brasil","Airbus A320-233","PR-MBK","TAM Linhas Aéreas","Porto Alegre (POA) → São Paulo–Congonhas (CGH)","Porto Alegre (POA)","São Paulo–Congonhas (CGH)","Local da queda (pátio da TAM Express, dentro do Aeroporto de Congonhas)","17 de julho de 2007","6 tripulantes e 181 passageiros a bordo","187 pessoas a bordo e 12 em solo","Pouso em pista molhada sem ranhuras de frenagem, com um reversor travado","O Airbus A320 vinha de Porto Alegre e não conseguiu frear a tempo na pista 35L do Aeroporto de Congonhas, em São Paulo, na tarde chuvosa de 17 de julho de 2007. A aeronave atravessou a pista, cruzou uma avenida e colidiu contra um prédio da própria TAM, explodindo em chamas. Foi o acidente aéreo mais mortal da história do Brasil.","A pista 35L estava molhada e ainda não havia recebido o rebaixamento (grooving) que melhora a frenagem em dias de chuva.","O reversor de empuxo do motor direito estava travado havia dias, condição autorizada para operação mesmo assim.","A manete do motor direito permaneceu na posição de decolagem durante a tentativa de pouso, reduzindo a frenagem.","Outros pilotos já haviam relatado dificuldade para parar em Congonhas com a pista molhada.","CENIPA — Centro de Investigação e Prevenção de Acidentes Aeronáuticos","A pista estava molhada e sem ranhuras de frenagem (grooving) na hora do pouso.","O reversor do motor 2 estava mecanicamente travado havia quatro dias.","Os dados do voo mostram a manete direita na posição de decolagem, não de reversão.","Relatos de outros pilotos apontavam risco conhecido de aquaplanagem na pista 35L.","O CENIPA não apontou uma causa única, mas uma combinação de fatores: pista sem grooving, reversor travado e a manete do motor direito posicionada incorretamente, que juntos impediram a frenagem a tempo.","O acidente acelerou a exigência de grooving (sulcos de drenagem) em pistas molhadas no Brasil e levou a ANAC a revisar os critérios de distância mínima de pista para o Airbus A320 em Congonhas.","Piloto / Tripulação","A manete do motor direito permaneceu na posição de decolagem durante a tentativa de pouso, reduzindo a frenagem — um ponto de verificação de configuração da aeronave antes do toque.","Outros pilotos já haviam relatado, antes deste voo, dificuldade para parar em Congonhas com a pista molhada — um sinal de risco conhecido que circulava informalmente, sem virar ação formal.","Se você soubesse, como neste caso, que outras tripulações já relataram dificuldade de frenagem numa pista específica em dias de chuva, que canal formal existe hoje na sua empresa pra registrar isso — e ele realmente é usado?","Manutenção","O reversor de empuxo do motor direito estava mecanicamente travado havia quatro dias — uma condição que, apesar de tecnicamente autorizada para operação, reduziu a capacidade de frenagem no momento em que mais foi necessária.","O caso ilustra a diferença entre \"autorizado a voar com a pendência\" (MEL) e \"risco operacional aceitável no dia a dia\" — dois julgamentos que nem sempre estão alinhados.","Quando um item entra na lista de pendências autorizadas (MEL), quem revisa se essa pendência interage mal com outras condições do dia (pista molhada, por exemplo) — ou cada pendência é avaliada isoladamente?","Qual era o modelo da aeronave do voo TAM 3054?","Boeing 737","Airbus A320","Fokker 100","Embraer 190","De onde partiu o voo antes de tentar pousar em Congonhas?","Curitiba","Porto Alegre","Recife","Belo Horizonte","Em que ano ocorreu o acidente?","Quantas pessoas morreram ao todo?","Qual condição da pista contribuiu para o acidente?","Pista congelada","Pista sem ranhuras de frenagem (grooving) e molhada","Pista muito curta","Pista sem iluminação","O que estava travado em um dos motores?","O trem de pouso","O reversor de empuxo","O flap","O leme","Qual órgão foi responsável pela investigação oficial?","NTSB","BEA","CENIPA","Aerocivil","A manete do motor direito estava em qual posição durante o pouso?","Reversão total","D
